name: Check for new filings and dashboard orders

on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # every 15 minutes
  workflow_dispatch: {}

concurrency:
  group: quick-check
  cancel-in-progress: false      # a check already running finishes; at most one more waits behind it

permissions:
  contents: read
  actions: write               # to start the full update when new filings appear

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York        # dates and times in Eastern
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: |                  # retry: the package server occasionally hiccups
          for i in 1 2 3 4; do pip install --retries 5 --timeout 60 -r requirements.txt && exit 0; sleep $((i * 20)); done
          exit 1

      - name: Restore the list of filings already seen
        uses: actions/cache/restore@v4
        with:
          path: quick_state
          key: quick-${{ github.run_id }}
          restore-keys: quick-

      - name: Look for new House and Senate filings
        env:
          GH_TOKEN: ${{ github.token }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          MAX_TAP_DOLLARS: ${{ vars.MAX_TAP_DOLLARS }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python quick_check.py

      - name: Save the list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: quick_state
          key: quick-${{ github.run_id }}
