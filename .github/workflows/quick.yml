name: Check for new filings and dashboard orders

on:
  schedule:
    # backup starter only: the app server (Cloudflare Worker) starts this check every 5 minutes in market hours and
    # every 30 minutes otherwise. Nov 5 (owner: no wasted runs): a scheduled start stops at the gate below when the
    # Worker started a check in the last 20 minutes, so it only does the work if the Worker has stopped.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: quick-check
  cancel-in-progress: false      # a check already running finishes; at most one more waits behind it

permissions:
  contents: read
  actions: write               # to start the full update when new filings appear

jobs:
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-20 min' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/quick.yml/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=1" --jq '.total_count' || echo 0)
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "The app server started a check in the last 20 minutes; this backup start isn't needed"
          else
            echo "No check from the app server in 20 minutes; running it here"
          fi

  check:
    needs: gate
    if: always() && needs.gate.outputs.skip != '1'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York        # dates and times in Eastern
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Python and libraries (ready-made, reused)
        uses: ./.github/actions/python-libs

      - name: Restore the list of filings already seen
        uses: actions/cache/restore@v4
        with:
          path: quick_state
          key: quick-${{ github.run_id }}
          restore-keys: quick-

      - name: Look for new House and Senate filings
        env:
          GH_TOKEN: ${{ github.token }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          MAX_TAP_DOLLARS: ${{ vars.MAX_TAP_DOLLARS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python quick_check.py

      - name: Save the list
        if: always()
        uses: actions/cache/save@v4
        with:
          path: quick_state
          key: quick-${{ github.run_id }}
