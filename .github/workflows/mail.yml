name: Send app emails

# Started by the app's server when someone asks for a sign-in link (or the owner adds an account). Sends whatever is
# waiting in R2 under mail/outbox/ through the owner's Gmail, then deletes it. The log never shows addresses.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: app-mail
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --retries 5 requests
      - name: Send waiting emails
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python send_mail.py
