name: Members' posts, live (hourly)
on:
  workflow_dispatch: {}          # Cloudflare starts it every hour (GitHub's own hourly schedule is unreliable)
permissions:
  contents: read
concurrency:
  group: posts-live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/New_York
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
      - name: Text-in-images reader
        run: sudo apt-get install -y -qq tesseract-ocr >/dev/null 2>&1 || true
      - name: Python and libraries (ready-made, reused)
        uses: ./.github/actions/python-libs
        with:
          ml: "true"
      - name: Restore the sentiment model
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-roberta-sentiment-v1
      - name: Restore saved data (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}-live
          restore-keys: data-
      - name: Restore members' posts (read-only)
        uses: actions/cache/restore@v4
        with:
          path: social
          key: social-${{ github.run_id }}-live
          restore-keys: social-
      - name: Collect, read and sort new posts; alert
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python posts_live.py 12
