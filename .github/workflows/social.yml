name: Build members' posts history (one-time, resumable)
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to spend collecting"
        default: "300"
      chain:
        description: "Back-to-back runs so far (leave at 0)"
        default: "0"
      left:
        description: "Posts still to sort after the previous run (leave empty)"
        default: ""
permissions:
  contents: read
  actions: write          # start the next run while the history is still filling
concurrency:
  group: social
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: America/New_York
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get install -y -qq tesseract-ocr >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr) || echo "no tesseract: text in images is skipped"
          for i in 1 2 3; do pip install -q -r requirements.txt -r requirements-ml.txt && exit 0; sleep 20; done; exit 1
      - name: Restore saved data (read-only here; company names and lobbyists for tagging)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Restore the sentiment model
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-roberta-sentiment-v1
      - name: Restore archived press releases (departed members)
        uses: actions/cache/restore@v4
        with:
          path: wb
          key: wb-${{ github.run_id }}
          restore-keys: wb-
      - name: Restore members' posts
        uses: actions/cache/restore@v4
        with:
          path: social
          key: social-${{ github.run_id }}
          restore-keys: social-
      - name: Collect
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python update_social.py ${{ github.event.inputs.minutes || '300' }}
      - name: Save members' posts
        if: always() && hashFiles('social/.changed') != ''
        uses: actions/cache/save@v4
        with:
          path: social
          key: social-${{ github.run_id }}
      - name: Start the next run if the history isn't finished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ github.event.inputs.chain || '0' }}
          PREV: ${{ github.event.inputs.left || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Nov 6: a flat 6-run cap ended the chain with 3.4M posts still to sort. Past 6 runs the chain now goes on
        # while each run shrinks the backlog (up to 20); if it stops unfinished, Data health says so.
        run: |
          LEFT=$(cat social/unsorted_left.txt 2>/dev/null | tr -cd 0-9)
          echo "Posts still to sort: ${LEFT:-unknown} (previous run: ${PREV:-unknown})"
          if [ ! -f social/needs_more_runs ]; then
            echo "History finished; no next run"
          elif [ "$CHAIN" -lt 6 ] || { [ "$CHAIN" -lt 20 ] && [ -n "$LEFT" ] && [ -n "$PREV" ] && [ "$LEFT" -lt "$PREV" ]; }; then
            gh workflow run social.yml -f chain=$((CHAIN + 1)) -f minutes=${{ github.event.inputs.minutes || '300' }} -f left="$LEFT"
            echo "Started run $((CHAIN + 2))"
            python -c "from congress_signals import health as H; H.finish('social_history', [])" || true
          else
            msg="Posts history runs stopped after $((CHAIN + 1)) runs with ${LEFT:-an unknown number of} posts still to sort (no progress or the 20-run limit); the daily update restarts them when the backlog is large"
            echo "::warning::$msg"
            python -c "import sys; from congress_signals import health as H; H.finish('social_history', [sys.argv[1]])" "$msg" || true
          fi
          if [ ! -f social/needs_more_runs ]; then
            python -c "from congress_signals import health as H; H.finish('social_history', [])" || true
          fi
