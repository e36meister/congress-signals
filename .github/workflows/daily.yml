name: Daily congress trade signals

on:
  schedule:
    # Cloudflare starts the update on time at 10:43 and 23:43 UTC (6:43 AM / 7:43 PM New York, summer);
    # GitHub's own schedule (often 10-25 minutes late) is only a fallback and skips itself if an update already ran
    - cron: "20 11 * * *"
    - cron: "20 0 * * *"
  workflow_dispatch:           # "Run workflow" button, also used to chain runs while history is filling
    inputs:
      chain:
        description: "How many back-to-back runs came before this one (leave at 0)"
        default: "0"
      why:
        description: "Who started it (scheduled / filings / manual)"
        default: "manual"
      dry_run:
        description: "Test run: no orders, no emails or alerts, no uploads, nothing saved"
        default: "false"

permissions:
  contents: write              # monthly keep-alive commit
  actions: write               # start the next run while history is still filling

concurrency:
  group: daily-run${{ github.event.inputs.dry_run == 'true' && '-test' || '' }}
  cancel-in-progress: false

jobs:
  gate:                          # the late GitHub schedule runs only when Cloudflare's on-time start didn't happen
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            since=$(date -u -d '-150 minutes' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?created=>$since&per_page=20" \
                  --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length" || echo 0)
            if [ "$n" -gt 0 ]; then go=0; echo "An update already started in the last 2.5 hours; skipping"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York        # dates and times in Eastern
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: |                  # retry: the package server occasionally hiccups
          sudo apt-get install -y -qq tesseract-ocr >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr) || echo "tesseract not installed; scanned reports are skipped"
          for i in 1 2 3 4; do pip install --retries 5 --timeout 60 -r requirements.txt && exit 0; sleep $((i * 20)); done
          exit 1

      - name: Restore saved data
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Restore institutional data (13D/13G, short interest, 13F)
        uses: actions/cache/restore@v4
        with:
          path: inst
          key: inst-${{ github.run_id }}
          restore-keys: inst-

      - name: Restore members' posts (press releases, X archive, Bluesky, ...)
        uses: actions/cache/restore@v4
        with:
          path: social
          key: social-${{ github.run_id }}
          restore-keys: social-

      - name: Restore archived press releases (departed members)
        uses: actions/cache/restore@v4
        with:
          path: wb
          key: wb-${{ github.run_id }}
          restore-keys: wb-

      - name: Collect, score, backtest and update the dashboard
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          QUIVER_API_KEY: ${{ secrets.QUIVER_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          GMAIL_ADDRESS: ${{ github.event.inputs.dry_run != 'true' && secrets.GMAIL_ADDRESS || '' }}
          GMAIL_APP_PASSWORD: ${{ github.event.inputs.dry_run != 'true' && secrets.GMAIL_APP_PASSWORD || '' }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ github.event.inputs.dry_run != 'true' && secrets.GDRIVE_SERVICE_ACCOUNT_JSON || '' }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ github.event.inputs.dry_run != 'true' && secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ github.event.inputs.dry_run != 'true' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
          USE_TUNED_WEIGHTS: ${{ vars.USE_TUNED_WEIGHTS }}
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          TRADING_MODE: ${{ vars.TRADING_MODE }}
          AUTO_TRADE: ${{ vars.AUTO_TRADE }}
          AUTO_TRADE_LIVE: ${{ vars.AUTO_TRADE_LIVE }}
          DOLLARS_PER_TRADE: ${{ vars.DOLLARS_PER_TRADE }}
          MAX_POSITIONS: ${{ vars.MAX_POSITIONS }}
          MAX_INVESTED_PCT: ${{ vars.MAX_INVESTED_PCT }}
          SMALL_SLEEVE_PCT: ${{ vars.SMALL_SLEEVE_PCT }}
          TIME_BUDGET_MIN: "320"
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          SENATE_SCANS_SEPARATE: "1"
        run: python run_daily.py

      - name: Save data for tomorrow (even if the run stopped early)
        if: always() && github.event.inputs.dry_run != 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}

      - name: Start the next run right away if data collection isn't finished
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ github.event.inputs.chain || '0' }}
        run: |
          if [ -f data/state/needs_more_runs ] && [ "$CHAIN" -lt 8 ]; then
            NEXT=$((CHAIN + 1))
            echo "Starting back-to-back run $NEXT"
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily.yml/dispatches" \
              -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"chain\":\"$NEXT\"}}"
          else
            echo "No extra run needed"
          fi

      - name: Monthly keep-alive (GitHub pauses schedules after 60 quiet days)
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" -lt 13 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Monthly keep-alive" && git push || true
          fi

  scans:                         # scanned paper reports and the history fill, after the update (same saved data)
    needs: update
    if: always() && needs.update.result != 'skipped' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: |                  # retry: the package server occasionally hiccups
          sudo apt-get install -y -qq tesseract-ocr >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr) || echo "tesseract not installed; scanned reports are skipped"
          for i in 1 2 3 4; do pip install --retries 5 --timeout 60 -r requirements.txt && exit 0; sleep $((i * 20)); done
          exit 1

      - name: Restore saved data (just saved by the update)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}-scans
          restore-keys: data-

      - name: Read scanned Senate reports (built-in reader)
        continue-on-error: true
        timeout-minutes: 35
        run: python scan_senate.py

      - name: Read older scanned House reports
        continue-on-error: true
        timeout-minutes: 35
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
        run: python scan_house.py

      - name: Fill older years and less-traded companies (lobbying, grants, speeches, contracts, events)
        continue-on-error: true
        timeout-minutes: 55
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python backfill_enrich.py 45

      - name: Save data for tomorrow
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}-scans

  institutions:                  # runs alongside the update on its own machine
    needs: gate
    if: needs.gate.outputs.go == '1' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: |                  # retry: the package server occasionally hiccups
          for i in 1 2 3 4; do pip install --retries 5 --timeout 60 -r requirements.txt && exit 0; sleep $((i * 20)); done
          exit 1

      - name: Restore saved data (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}-inst
          restore-keys: data-

      - name: Restore institutional data
        uses: actions/cache/restore@v4
        with:
          path: inst
          key: inst-${{ github.run_id }}
          restore-keys: inst-

      - name: Update institutional data (once the history build is complete)
        id: inst
        if: hashFiles('inst/complete') != ''
        continue-on-error: true
        timeout-minutes: 15
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python update_institutions.py 8

      - name: Save institutional data
        if: always() && steps.inst.outcome == 'success' && hashFiles('inst/.changed') != ''
        uses: actions/cache/save@v4
        with:
          path: inst
          key: inst-${{ github.run_id }}

  social:                        # runs alongside the update on its own machine
    needs: gate
    if: needs.gate.outputs.go == '1' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install libraries
        run: |                  # retry: the package server occasionally hiccups
          for i in 1 2 3 4; do pip install --retries 5 --timeout 60 -r requirements.txt && exit 0; sleep $((i * 20)); done
          exit 1

      - name: Restore saved data (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}-social
          restore-keys: data-

      - name: Restore members' posts
        uses: actions/cache/restore@v4
        with:
          path: social
          key: social-${{ github.run_id }}
          restore-keys: social-

      - name: Restore archived press releases (departed members)
        uses: actions/cache/restore@v4
        with:
          path: wb
          key: wb-${{ github.run_id }}
          restore-keys: wb-

      - name: Update members' posts (once the history build is complete)
        id: social
        if: hashFiles('social/complete') != ''
        continue-on-error: true
        timeout-minutes: 20
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python update_social.py 12 --daily

      - name: Save members' posts
        if: always() && steps.social.outcome == 'success' && hashFiles('social/.changed') != ''
        uses: actions/cache/save@v4
        with:
          path: social
          key: social-${{ github.run_id }}
