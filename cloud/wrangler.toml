name = "capitol-capital"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true        # kept on so widgets and shortcuts set up with the old address still work
preview_urls = false
routes = [{ pattern = "capitolcapital.cc", custom_domain = true }, { pattern = "www.capitolcapital.cc", custom_domain = true }]

[vars]
APP_HOST = "capitolcapital.cc"   # sign-in links point here; pages on the old address forward here

[assets]
directory = "./app"
binding = "ASSETS"
run_worker_first = true   # every request goes through the login check first
not_found_handling = "single-page-application"

[[r2_buckets]]
binding = "DATA"
bucket_name = "capitol-capital-data"

[observability]
enabled = false   # don't keep request logs

[triggers]
crons = ["* * * * *"]
