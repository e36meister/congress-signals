<style>

  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E131A; --surface:#151C26; --sunken:#1B2330; --ink:#E6EBF2; --ink2:#B4BECC; --muted:#8B97A8; --rule:#27303D;

  --good:#4CC38A; --good-soft:#12291E; --bad:#F2877B; --bad-soft:#331816; --warn:#E3A857; --warn-soft:#2E2210;

}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}

nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}

nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.chart{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 12px 8px;position:relative}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:0 4px 6px}

.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:170px}

/* factor bars */

.fgroup{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.fgroup h3{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.foot{font-size:12.5px;color:var(--muted)}

/* ticker popup */
.tkl{font:inherit;font-weight:600;color:inherit;background:none;border:0;padding:0;margin:0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer;letter-spacing:inherit}

.mbg{position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.45);display:grid;grid-template-columns:minmax(0,900px);justify-content:center;align-items:start;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow:auto}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:10px;width:100%;min-width:0;padding:14px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:grid;gap:10px}
.modal>*{min-width:0}

.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mh .t{font:600 22px var(--mono);letter-spacing:.3px}

.spans{display:flex;gap:2px;align-items:center;flex-wrap:wrap}

.tc{position:relative;user-select:none;-webkit-user-select:none}

.mk{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid;background:var(--sunken);padding:0;cursor:pointer;display:grid;place-items:center;font:600 9px var(--body);color:var(--ink2);overflow:hidden;z-index:2}

<script>
(() => {
"use strict";
const SERVER = "Google Drive";
const FILE_TITLE = "dashboard_data.json";
const state = { data: null, tab: "today", fileId: null, modified: null, error: null, tradeSide: "longs", tradeFilter: "all", q: "",
  folderId: null, requests: [], confirm: null, amounts: {}, tapMsg: {}, sending: false };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v, d = 1, signed = true) => v == null || isNaN(v) ? "–" : (signed && v > 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const pnum = (v, d = 1) => v == null || isNaN(v) ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d) + "%";
const cls = v => v == null || isNaN(v) ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "";
const fmtDate = s => { if (!s) return "–"; const d = new Date(s + (s.length === 10 ? "T12:00:00" : "")); return isNaN(d) ? s : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };
const ET = "America/New_York";
function toDate(iso) { if (!iso) return null; const s = String(iso); const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) || s.length <= 10 ? s : s + "Z"); return isNaN(d) ? null : d; }
function fmtET(iso) {
  const d = toDate(iso); if (!d) return "–";
  return d.toLocaleString("en-US", { timeZone: ET, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET";
}
function dateET(iso) {
  const d = toDate(iso); if (!d) return "–";
  return d.toLocaleDateString("en-US", { timeZone: ET, month: "short", day: "numeric", year: "numeric" });
}
function ago(iso) {
  const t = Date.parse(iso); if (isNaN(t)) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 36) return h + " hr ago";
  return Math.round(h / 24) + " days ago";
}
try { const t = localStorage.getItem("ctd-tab"); if (t) state.tab = t; } catch (e) {}
if (/^#(today|record|defense|small|works|real|port)$/.test(location.hash)) state.tab = location.hash.slice(1);

// ---------- status ----------
function setStatus(kind, text, showRefresh) {
  $("#dot").className = "dot " + (kind || "");
  $("#statusText").textContent = text;
  $("#refresh").hidden = !showRefresh;
}

// ---------- tabs ----------
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  state.tab = b.dataset.tab;
  try { localStorage.setItem("ctd-tab", state.tab); } catch (e) {}
  render();
}));

// ---------- rendering ----------
function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  const main = $("#main");
  const d = state.data;
  if (!d) {
    main.innerHTML = state.error ? `<div class="note err">${state.error}</div>` : `<div class="empty">Loading your latest results…</div>`;
    return;
  }
  let html = "";
  if (d.version === 1) html += `<div class="note warn"><b>Showing results from the first version (5 signals).</b> Run the new notebook (Run all) and this page switches to the full version with buy, short and avoid picks.</div>`;
  if (state.tab === "today") html += renderToday(d);
  if (state.tab === "record") html += renderRecord(d);
  if (state.tab === "defense") html += renderDefense(d);
  if (state.tab === "small") html += renderSmall(d);
  if (state.tab === "works") html += renderWorks(d);
  if (state.tab === "real") html += renderReal(d);
  if (state.tab === "port") html += renderPortfolio(d);
  main.innerHTML = html;
  bind();
  try { document.querySelector('nav.tabs button[aria-selected="true"]')?.scrollIntoView({ inline: "nearest", block: "nearest" }); } catch (e) {}
}

function peopleOf(r) {
  if (Array.isArray(r.ppl) && r.ppl.length) return r.ppl;
  return String(r.m || "").split(/,\s*(?![^()]*\))/).filter(Boolean).map(x => {
    const m = x.match(/^(.*?)\s*\(([^)]+)\)\s*$/); return m ? { n: m[1], r: m[2] } : { n: x.trim() };
  });
}
function tagOf(p) {
  const T = state.data?.member_tags || {};
  return (p.b && T.bio?.[p.b]) || T.names?.[p.n] || "";
}
function tagHtml(p) { const t = tagOf(p); return t ? `<span class="ptag ${esc(t[0])}">${esc(t)}</span>` : ""; }
function membersText(m) {
  return String(m || "").split(/,\s*(?![^()]*\))/).filter(Boolean).map(x => {
    const mm = x.match(/^(.*?)\s*\(([^)]+)\)\s*$/); const n = (mm ? mm[1] : x).trim();
    return esc(x.trim()) + tagHtml({ n });
  }).join(", ");
}
function avatar(p, small) {
  const src = p.b && state.data?.photos?.[p.b];
  const cls = "av" + (small ? " sm" : "");
  if (src) return `<img class="${cls}" src="${src}" alt="" loading="lazy">`;
  const parts = String(p.n || "?").replace(/\b(Mr|Mrs|Ms|Dr|Hon|Jr|Sr|II|III)\b\.?/g, "").trim().split(/\s+/);
  const ini = ((parts[0] || "?")[0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  return `<span class="${cls}" aria-hidden="true">${esc(ini)}</span>`;
}
function peopleRow(r, side) {
  const ps = peopleOf(r);
  return `<div class="ppl"><span class="lbl">${side === "sell" ? "Sold by" : "Bought by"}</span>${ps.map(p => `<span class="person">${avatar(p)}<span><span class="pn">${esc(p.n)}${tagHtml(p)}</span>${p.r ? `<span class="pr">${esc(p.r)}</span>` : ""}</span></span>`).join("")}</div>`;
}
function peopleCell(r) {
  return `<div class="who-cell">${peopleOf(r).map(p => `<span class="nm">${avatar(p, true)}${esc(p.n)}${tagHtml(p)}</span>`).join("")}</div>`;
}

const OPEN = ["new", "accepted", "pending_new", "partially_filled", "accepted_for_bidding", "held", "calculated"];
const tickerOf = name => (name.match(/^order_(?:request|done|failed)_([A-Z][A-Z0-9-]{0,6})_/) || [])[1];
function pendingFor(t) { return (state.taps || []).find(o => o.t === t && OPEN.includes(o.status)); }
function buyArea(r) {
  const p = state.data?.portfolio;
  if (!p || !state.folderId) return "";
  const held = (p.positions || []).some(x => x.t === r.t);
  if (pendingFor(r.t)) return `<span class="chip new">Order placed · waiting to fill</span>`;
  return `<button type="button" class="buybtn" data-buy="${esc(r.t)}"${held ? " title=\"You already hold this\"" : ""}>${held ? "Buy more" : "Buy"}</button>`;
}
function suggestion(r) {
  const L = state.data?.portfolio?.limits || {};
  const base = L.per_pick || L.dollars;
  if (!base) return null;
  const on = (L.sizing || state.data?.adaptive?.policy?.sizing || "equal") !== "equal";
  const k = on && r.sz != null ? r.sz : 1;
  const amt = Math.max(10, Math.round(base * k / 10) * 10);
  return { amt, k, on, sh: r.px ? amt / r.px : null };
}
function suggestLine(r) {
  const g = suggestion(r); if (!g) return "";
  const sh = g.sh == null ? "" : ` ≈ ${g.sh >= 10 ? Math.round(g.sh).toLocaleString() : g.sh.toFixed(1)} sh`;
  const why = !g.on ? "standard size" : g.k > 1.02 ? `${g.k.toFixed(2)}× · stronger pick` : g.k < 0.98 ? `${g.k.toFixed(2)}× · near the bar` : "standard size";
  return `<div class="sc" title="Suggested amount for this pick">Suggested ${money(g.amt)}${sh}<div class="foot" style="text-align:inherit">${why}</div></div>`;
}
function confirmBox(r) {
  if (state.confirm !== r.t) return state.tapMsg[r.t] ? `<div class="tapmsg ${state.tapMsg[r.t].ok ? "pos" : "neg"}">${esc(state.tapMsg[r.t].text)}</div>` : "";
  const p = state.data.portfolio, real = p.mode === "live";
  const amt = state.amounts[r.t] ?? (suggestion(r)?.amt || p.limits?.dollars || 5000);
  return `<div class="confirm"><span>Buy <b>${esc(r.t)}</b> for $</span>
    <input type="number" inputmode="decimal" min="1" step="100" id="amt-${esc(r.t)}" value="${esc(amt)}" aria-label="Dollar amount">
    <span class="${real ? "real" : ""}">${real ? "Real money account" : "Paper account (fake money)"}</span>
    <button type="button" class="buybtn" data-send="${esc(r.t)}"${state.sending ? " disabled" : ""}>${state.sending ? "Sending…" : "Send order"}</button>
    <button type="button" class="link" data-cancel="1">Cancel</button>
    <span class="foot">Sent to Alpaca right away; fills now if the market is open, otherwise at the next open.</span>${state.tapMsg[r.t] ? `<div class="tapmsg neg">${esc(state.tapMsg[r.t].text)}</div>` : ""}</div>`;
}

function tradeLine(r) {
  const d = r.d ? String(r.d).slice(0, 10) : null, td = r.td ? String(r.td).slice(0, 10) : null;
  if (!td) return `Disclosed ${esc(fmtDate(d))}`;
  const lag = r.lag != null ? Math.round(r.lag) : (d ? Math.round((Date.parse(d) - Date.parse(td)) / 864e5) : null);
  return `${r.action === "SHORT" || r.action === "avoid" ? "Sold" : "Bought"} ${esc(fmtDate(td))} · disclosed ${esc(fmtDate(d))}${lag != null ? ` (${lag} day${lag === 1 ? "" : "s"} later)` : ""}`;
}
function pickRow(r, side) {
  const isNew = (state.data.watchlist?.new || []).some(n => n.t === r.t && (side === "sell" ? n.action === "SHORT" : n.action === "BUY"));
  const ctx = [];
  if (r.an) ctx.push("Analysts: " + esc(r.an.replace(/_/g, " ")));
  if (r.up != null) ctx.push("Target upside " + pnum(r.up, 0));
  if (r.earn) ctx.push("Earnings " + esc(fmtDate(String(r.earn).slice(0, 10))));
  if (r.news != null) ctx.push(esc(r.news) + " news stories this week");
  if (r.nwm) ctx.push(esc(r.nwm) + " stories mention the member and company together");
  (r.hear || []).forEach(h => ctx.push(`<b>Testifies before Congress ${esc(fmtDate(h.date))}</b>: ${esc(h.title.length > 90 ? h.title.slice(0, 88) + "…" : h.title)}`));
  const pctTop = r.pct != null ? Math.max(1, Math.round(100 - r.pct)) : null;
  return `<article class="pick">
    <div class="tk"><b>${tkBtn(r.t)}</b><span class="chip ${esc(r.action)}">${esc(r.action)}</span>${isNew ? `<span class="chip new">New</span>` : ""}${r.def ? `<span class="chip watch">Defense</span>` : ""}${r.ags ? `<span class="chip avoid" title="The member bought while most analysts rated it hold or worse">Against Wall Street</span>` : ""}</div>
    <div>
      <div class="co">${esc(r.co || r.t)}${r.sec ? ` <span class="who">· ${esc(r.sec)}</span>` : ""}</div>
      <div class="who">${tradeLine(r)}</div>
      ${peopleRow(r, side)}
      <div class="why">${esc(r.why)}</div>
      ${ctx.length ? `<div class="ctx">${ctx.map(c => `<span>${c}</span>`).join("")}</div>` : ""}
    </div>
    <div class="side">
      <div class="meter" title="Score ${r.s}"><i style="width:${Math.max(3, Math.min(100, r.s || 0))}%"></i></div>
      <div class="sc">Score ${r.s != null ? Number(r.s).toFixed(0) : "–"}${pctTop != null ? ` · top ${pctTop}%` : ""}</div>
      ${r.mt != null ? `<div class="mv ${cls(r.mt)}">${pct(r.mt)} since purchase</div>` : ""}<div class="mv ${cls(r.move)}">${pct(r.move)} since disclosure</div>
      ${side === "buy" && r.action === "BUY" ? suggestLine(r) : ""}
      ${side === "buy" ? buyArea(r) : ""}
    </div>
    ${side === "buy" ? confirmBox(r) : ""}
  </article>`;
}

function renderToday(d) {
  const w = d.watchlist;
  if (!w) return `<div class="empty">No watchlist yet. Run the new notebook through <b>Step 3</b> and today's picks show up here.</div>`;
  const buys = w.buys || [], sells = w.sells || [];
  const nb = buys.filter(r => r.action === "BUY").length, ns = sells.filter(r => r.action === "SHORT").length, na = sells.filter(r => r.action === "avoid").length;
  const topBuys = buys.filter(r => r.action === "BUY"), watch = buys.filter(r => r.action !== "BUY");
  return `
  <div class="tiles">
    <div class="tile"><span class="v">${nb}</span><span class="l">Buy candidates</span></div>
    ${ns ? `<div class="tile"><span class="v">${ns}</span><span class="l">Short candidates</span></div>` : ""}
    <div class="tile"><span class="v">${na}</span><span class="l">Stocks to avoid</span></div>
    <div class="tile"><span class="v">${(w.new || []).length}</span><span class="l">New since the last run</span></div>
  </div>
  <section class="panel">
    <div class="ph"><h2>Buy candidates</h2><span class="sub">Purchases disclosed in the last ${w.lookback} days that score in the top of all past buy signals</span></div>
    ${topBuys.length ? `<div class="picks">${topBuys.map(r => pickRow(r, "buy")).join("")}</div>` : `<div class="empty">No purchase cleared the bar right now.</div>`}
  </section>
  ${worthSection(d)}
  <section class="panel">
    <div class="ph"><h2>${sells.some(r => r.action === "SHORT") ? "Short and avoid" : "Stocks to avoid"}</h2><span class="sub">Sales that look like the ones that were followed by drops</span></div>
    ${sells.length ? `<div class="picks">${sells.map(r => pickRow(r, "sell")).join("")}</div>` : `<div class="empty">No strong sell signals right now.</div>`}
  </section>
  ${unusualSection(d)}
  ${watch.length ? `<section class="panel"><div class="ph"><h2>Also bought recently</h2><span class="sub">Below the bar; for reference</span></div>
    <div class="tbl scroll"><table><thead><tr><th>Ticker</th><th>Company</th><th class="n">Score</th><th>Bought by</th><th>Disclosed</th><th class="n">Since</th></tr></thead><tbody>
    ${watch.map(r => `<tr><td class="mono">${tkBtn(r.t)}</td><td>${esc(r.co || "")}</td><td class="n">${r.s != null ? Number(r.s).toFixed(0) : "–"}</td><td>${peopleCell(r)}</td><td class="nw">${esc(fmtDate(r.d))}</td><td class="n ${cls(r.move)}">${pct(r.move)}</td></tr>`).join("")}
    </tbody></table></div></section>` : ""}
  <p class="foot">Analyst, earnings and news details are context only; they aren't part of the score. Watchlist built ${esc(ago(w.updated))} (${esc(fmtET(w.updated))}).</p>`;
}

function worthSection(d) {
  const u = d.worth || [];
  if (!u.length) return "";
  const picks = new Set([...(d.watchlist?.buys || []).filter(r => r.action === "BUY"), ...(d.watchlist?.sells || []).filter(r => r.action !== "watch")].map(r => r.t));
  const buyList = new Set((d.watchlist?.buys || []).filter(r => r.action === "BUY").map(r => r.t));
  // Buy button here too; a stock already on the buy list keeps its button up there (one order form per stock)
  const side = r => buyList.has(r.t) ? `<span class="foot">Buy it from Buy candidates above</span>` : buyArea({ t: r.t });
  return `<section class="panel"><div class="ph"><h2>Worth a look</h2><span class="sub">Recent disclosures with a rare red flag, whatever their score</span></div>
    <div class="picks">${u.map(r => `<article class="pick">
      <div class="tk"><b>${tkBtn(r.t)}</b>${picks.has(r.t) ? `<span class="chip new">On the list</span>` : ""}</div>
      <div><div class="co">${esc(r.co || infoFor(r.t).co || r.t)}</div>
        <div class="ppl">${(r.who || []).map(w => `<span class="person">${avatar({ n: w.n, b: w.b })}<span><span class="pn">${esc(w.n)}${tagHtml({ n: w.n, b: w.b })}</span><span class="pr"><span class="bs ${w.ty}">${w.ty === "buy" ? "Bought" : "Sold"}</span> ${esc(fmtDate(w.td))} · disclosed ${esc(fmtDate(w.d))}</span></span></span>`).join("")}</div>
        <div class="why">${(r.why || []).map(esc).join("; ")}</div></div>
      <div class="side">${side(r)}</div>
      ${buyList.has(r.t) ? "" : confirmBox({ t: r.t })}</article>`).join("")}</div>
    <p class="foot">These aren't buy or sell signals on their own: the backtest hasn't shown these flags help yet. They're here so nothing unusual slips by. New ones are also emailed to you.</p></section>`;
}
function unusualSection(d) {
  const u = d.unusual || [];
  if (!u.length) return "";
  const xf = v => v == null ? "–" : v.toFixed(1) + "×";
  return `<section class="panel"><div class="ph"><h2>Unusual activity</h2><span class="sub">Stocks members traded in the last 90 days with unusually heavy trading this past week</span></div>
    <div class="tbl scroll"><table><thead><tr><th>Ticker</th><th>Company</th><th class="n">Volume, last week</th><th class="n">Busiest day</th><th class="n">Price, 5 days</th><th>Members who traded</th></tr></thead><tbody>
    ${u.map(r => `<tr><td class="mono">${tkBtn(r.t)}</td><td>${esc(r.co || infoFor(r.t).co || "")}</td><td class="n">${xf(r.ratio)} normal</td><td class="n">${xf(r.peak)}</td><td class="n ${cls(r.move5)}">${pct(r.move5)}</td>
      <td><div class="who-cell">${(r.who || []).map(w => `<span class="nm">${avatar({ n: w.n, b: w.b }, true)}${esc(w.n)}${tagHtml({ n: w.n, b: w.b })} <span class="bs ${w.ty}">${w.ty === "buy" ? "bought" : "sold"}</span> <span class="foot">${esc(fmtDate(w.td))}</span></span>`).join("")}</div></td></tr>`).join("")}
    </tbody></table></div>
    <p class="foot">Heavy trading can mean others are acting on news before it's public, but it also follows earnings, index changes and ordinary headlines. Treat it as a reason to look closer, not a signal on its own. Volume as of ${esc(fmtDate(u[0].asof))}.</p></section>`;
}
function statRow(ts, name) { return (ts || []).find(x => x.name === name) || {}; }

function renderRecord(d) {
  const b = d.backtest;
  if (!b) return `<div class="empty">No backtest yet. Run the new notebook through <b>Step 2</b>.</div>`;
  const perf = Object.fromEntries((b.perf || []).map(p => [p.name, p]));
  const L = perf["Long picks"] || {}, S = perf["S&P 500 (SPY)"] || {};
  const st = statRow(b.trade_stats, "Long picks");
  const beat = (L["Annual return (CAGR)"] ?? -1) > (S["Annual return (CAGR)"] ?? 0);
  const shortSt = statRow(b.trade_stats, "Short picks");
  const tiles = `
  <div class="tiles">
    <div class="tile"><span class="v ${beat ? "pos" : "neg"}">${pct(L["Annual return (CAGR)"])}</span><span class="l">Long picks, per year</span><span class="c">S&amp;P 500: ${pct(S["Annual return (CAGR)"])}</span></div>
    <div class="tile"><span class="v">${st["Beat SPY (%)"] != null ? Math.round(st["Beat SPY (%)"]) + "%" : "–"}</span><span class="l">Picks that beat the S&amp;P 500</span><span class="c">${st["Closed trades"] ?? "–"} finished picks</span></div>
    <div class="tile"><span class="v ${cls(st["Avg vs SPY per trade (%)"])}">${pnum(st["Avg vs SPY per trade (%)"])}</span><span class="l">Average pick vs S&amp;P 500</span><span class="c">Typical pick: ${pnum(st["Median vs SPY (%)"])}</span></div>
    ${shortSt["Closed trades"] ? `<div class="tile"><span class="v">${Math.round(shortSt["Beat SPY (%)"])}%</span><span class="l">Short picks that worked</span><span class="c">${shortSt["Closed trades"]} finished shorts</span></div>` : ""}
    <div class="tile"><span class="v neg">${pct(L["Worst drawdown"])}</span><span class="l">Worst drop, long picks</span><span class="c">S&amp;P 500: ${pct(S["Worst drawdown"])}</span></div>
  </div>`;
  const sizing = b.slots ? `Each pick gets 1/${b.slots} of the money; the rest sits in the S&amp;P 500.` : `Money not in a pick sat in cash.`;
  const perfRows = perfTable(b.perf);
  const side = state.tradeSide;
  const list = (b[side] || []).filter(t => {
    if (state.tradeFilter === "won" && !(t.ex != null && (side === "shorts" ? t.ex < 0 : t.ex > 0) && t.res !== "open")) return false;
    if (state.tradeFilter === "lost" && !(t.ex != null && (side === "shorts" ? t.ex >= 0 : t.ex <= 0) && t.res !== "open")) return false;
    if (state.tradeFilter === "open" && t.res !== "open") return false;
    if (state.q) { const q = state.q.toLowerCase(); return [t.t, t.co, t.m, t.sec].some(x => String(x || "").toLowerCase().includes(q)); }
    return true;
  });
  const total = side === "longs" ? b.n_longs : b.n_shorts;
  return `${tiles}
  <section class="panel">
    <div class="ph"><h2>Growth of $1 vs the S&amp;P 500</h2><span class="sub">${esc(fmtDate(b.span?.[0]))} to ${esc(fmtDate(b.span?.[1]))} · hold ${b.settings?.HOLD_DAYS ?? 60} trading days · ${sizing}</span></div>
    <div class="chart" id="chart"></div>
  </section>
  <section class="panel">
    <div class="ph"><h2>Portfolio results</h2></div>
    ${perfRows}
  </section>
  <section class="panel">
    <div class="ph"><h2>Every pick the strategy would have made</h2><span class="sub">Bought the trading day after each trade was disclosed${total > (b[side] || []).length ? ` · latest ${(b[side] || []).length} of ${total} shown; the full list is in your Drive reports folder` : ""}</span></div>
    <div class="filters">
      ${b.shorts && b.shorts.length ? `<div class="seg" role="group" aria-label="Side"><button type="button" data-side="longs" aria-pressed="${side === "longs"}">Buys</button><button type="button" data-side="shorts" aria-pressed="${side === "shorts"}">Shorts</button></div>` : ""}
      <div class="seg" role="group" aria-label="Result"><button type="button" data-f="all" aria-pressed="${state.tradeFilter === "all"}">All</button><button type="button" data-f="won" aria-pressed="${state.tradeFilter === "won"}">Beat S&amp;P</button><button type="button" data-f="lost" aria-pressed="${state.tradeFilter === "lost"}">Lagged</button><button type="button" data-f="open" aria-pressed="${state.tradeFilter === "open"}">Still open</button></div>
      <input type="search" id="q" placeholder="Search ticker, member, sector" value="${esc(state.q)}" aria-label="Search picks">
      <span class="sub foot">${list.length} shown</span>
    </div>
    <div class="tbl scroll"><table><thead><tr><th>Disclosed</th><th>Ticker</th><th>Members</th><th class="n">Score</th><th>Why</th><th class="n">Stock</th><th class="n">S&amp;P 500</th><th class="n">Difference</th><th>Result</th></tr></thead><tbody>
    ${list.map(t => `<tr><td class="nw">${esc(fmtDate(t.d))}</td><td class="mono">${esc(t.t)}</td><td>${membersText(t.m)}</td><td class="n">${t.s != null ? Number(t.s).toFixed(0) : "–"}</td><td class="why">${esc(t.why)}</td><td class="n ${cls(t.r)}">${pct(t.r)}</td><td class="n">${pct(t.spy)}</td><td class="n ${cls(side === "shorts" ? -t.ex : t.ex)}">${pct(t.ex)}</td><td class="nw">${esc(t.res)}</td></tr>`).join("") || `<tr><td colspan="9" class="foot">No picks match.</td></tr>`}
    </tbody></table></div>
  </section>`;

function perfTable(perf) {

function verdictFor(rows) {
  const byG = Object.fromEntries(rows.map(r => [r.group, r]));
  const hi = byG.high || byG.yes, lo = byG.low || byG.no;
  if (!hi || !lo || hi.avg == null || lo.avg == null) return ["no", "Not enough data"];
  const diff = hi.avg - lo.avg;
  if (hi.n < 30) return ["no", "Too few trades"];
  if (diff > 0.01) return ["yes", "Helps"];
  if (diff < -0.01) return ["rev", "Works backwards"];
  return ["no", "No clear effect"];
}

function factorBlock(rows, title) {
  if (!rows || !rows.length) return `<div class="empty">No data yet.</div>`;
  const groups = {};
  rows.forEach(r => (groups[r.signal] = groups[r.signal] || []).push(r));
  const max = Math.max(0.02, ...rows.map(r => Math.abs(r.avg || 0)));
  const order = ["no", "yes", "low", "mid", "high"];
  return `<div class="fac">${Object.entries(groups).map(([sig, rs]) => {
    rs.sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));
    const [vk, vt] = verdictFor(rs);
    return `<div class="fgroup"><h3><span>${esc(sig)}</span><span class="verdict ${vk}">${vt}</span></h3>
      ${rs.map(r => { const w = Math.abs(r.avg || 0) / max * 50; const left = r.avg >= 0 ? 50 : 50 - w;
        return `<div class="frow"><span class="g">${esc(r.group)}</span><span class="bar"><i style="left:${left}%;width:${w}%;background:${r.avg >= 0 ? "var(--good)" : "var(--bad)"}"></i></span><span class="val ${cls(r.avg)}">${pct(r.avg)} · ${Math.round(r.hit)}% · ${r.n.toLocaleString()}</span></div>`; }).join("")}
    </div>`;
  }).join("")}</div>`;
}

function sureWord(t) { return t == null ? "–" : t >= 3 ? "Very sure" : t >= 1.65 ? "Sure" : t >= 1 ? "Somewhat" : "Not sure"; }
function sureFoot(r) {
  if (r.Bar == null) return sureWord(r.Sureness);
  const t = r["Sureness (earlier years)"] ?? r.Sureness, bar = r.Bar;
  const w = t == null ? "–" : t >= bar ? "Sure enough" : t >= 1 ? "Somewhat sure" : "Not sure";
  const rec = r["Gain (last 3 years)"];
  return `${w}${(r["Options tried"] || 1) > 1 ? ` (bar ${bar.toFixed(1)}: ${r["Options tried"]} options tried)` : ""}${rec != null ? ` · last 3 yrs ${pct(rec)}` : ""}`;
}
function verdictChip(v) {
  const k = /^Switched|Clearly better|^Kept/.test(v) ? "BUY" : /^Current/.test(v) ? "watch" : /^Worse|^Undone/.test(v) ? "SHORT" : "avoid";
  return `<span class="chip ${k}">${esc(v)}</span>`;
}
function adjTable(rows) {
  const groups = [];
  rows.forEach(r => { let g = groups.find(x => x.name === r.Setting); if (!g) groups.push(g = { name: r.Setting, rows: [] }); g.rows.push(r); });
  return groups.map(g => { const rk = g.rows.some(r => r["Worst drop"] != null);
  return `<h3 class="subh">${esc(g.name)}</h3><div class="tbl${rk ? " scroll" : ""}"><table><thead><tr><th>Option</th><th class="n">vs S&amp;P / yr</th><th class="n">Gain</th>${rk ? `<th class="n">Worst drop</th><th class="n">Worst trade</th>` : ""}<th>Result</th></tr></thead><tbody>
  ${g.rows.map(r => `<tr><td>${esc(r.Option.replace(" trading days", " days"))}</td><td class="n ${cls(r["Per year vs S&P"])}">${pct(r["Per year vs S&P"])}</td><td class="n ${cls(r["Gain vs current"])}">${r.Verdict === "Current" ? "–" : pct(r["Gain vs current"])}</td>${rk ? `<td class="n ${cls(r["Worst drop"])}">${pct(r["Worst drop"])}</td><td class="n ${cls(r["Worst trade"])}">${pct(r["Worst trade"])}</td>` : ""}<td>${verdictChip(r.Verdict)}${r.Verdict === "Current" ? "" : `<div class="foot">${sureFoot(r)}</div>`}</td></tr>`).join("")}
  </tbody></table></div>${rk ? `<p class="note">Worst drop: the strategy's biggest fall from a high. Worst trade: the single pick that lost the most.</p>` : ""}`; }).join("");
}

const SERIES_VAR = { "Never-seen-years picks": "--s1", "Regular backtest, same years": "--s4", "Paper account": "--s1", "Small-company picks": "--s1", "Small-company index (IWM)": "--s3", "Long picks": "--s1", "Short picks": "--s2", "Copy every purchase": "--s4", "Defense fund (ITA)": "--s3", "S&P 500 (SPY)": "--spy" };
function drawChart(b = state.data?.backtest, sel = "#chart") {
  const host = $(sel);
  if (!host || !b?.curve?.dates?.length) { if (host) host.innerHTML = `<div class="empty">No growth curve in this data.</div>`; return; }
  const css = getComputedStyle(document.documentElement);
  const dates = b.curve.dates;
  const names = Object.keys(b.curve.series).filter(n => n in SERIES_VAR || /Long \d+% \/ short/.test(n));
  const colorOf = n => css.getPropertyValue(SERIES_VAR[n] || "--s3").trim();
  const W = Math.max(320, host.clientWidth - 24), H = W < 520 ? 240 : 320, m = { l: 48, r: 12, t: 10, b: 26 };
  let lo = 0, hi = 0;
  names.forEach(n => b.curve.series[n].forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  const band = b.band && b.curve.series[b.band.around] ? (() => {
    const base = b.curve.series[b.band.around], t0 = Date.parse(dates[0]);

  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;

  years.forEach(([yy, i], k) => { if (k === 0 && years.length > 1 && years[1][1] - i < dates.length / 12) return; g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${yy}</text>`; });

  }
  names.forEach(n => {
    const s = b.curve.series[n]; let dstr = "", pen = false;
    s.forEach((v, i) => { if (v == null) { pen = false; return; } dstr += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });

    paths += `<path d="${dstr}" fill="none" stroke="${colorOf(n)}" stroke-width="2" ${spy ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
    const lastI = s.length - 1 - [...s].reverse().findIndex(v => v != null);
    if (lastI >= 0 && lastI < s.length) paths += `<circle cx="${x(lastI)}" cy="${y(s[lastI])}" r="3.5" fill="${colorOf(n)}" stroke="${css.getPropertyValue("--surface")}" stroke-width="2"/>`;
  });
  host.innerHTML = `<div class="legend">${band ? `<span><i class="band"></i>Luck range</span>` : ""}${names.map(n => `<span><i class="${/SPY/.test(n) ? "dash" : ""}" style="background:${colorOf(n)}"></i>${esc(n.replace(" (SPY)", ""))} <b class="mono ${cls(b.curve.series[n].filter(v => v != null).slice(-1)[0])}">${pnum(b.curve.series[n].filter(v => v != null).slice(-1)[0], 0)}</b></span>`).join("")}</div>
  <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth of each portfolio compared with the S&P 500">${g}${paths}<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="${css.getPropertyValue("--muted")}" stroke-width="1" visibility="hidden"/><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  const hit = $("#hit", host), tip = $("#tip", host), xh = $("#xh", host);
  const move = ev => {
    const r = hit.getBoundingClientRect(); const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(dates.length - 1, Math.round(px / r.width * (dates.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="d">${esc(fmtDate(dates[i]))}</div>` + names.map(n => `<div class="r"><span style="color:${colorOf(n)}">●</span><span style="flex:1">${esc(n.replace(" (SPY)", ""))}</span><b>${pnum(b.curve.series[n][i], 1)}</b></div>`).join("") + (band && band.up[i] != null ? `<div class="r"><span style="flex:1;color:var(--muted)">Luck range</span><b>${pnum(band.dn[i], 1)} to ${pnum(band.up[i], 1)}</b></div>` : "");

  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("mouseleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
}

  const xOfI = i => m.l + (W - m.l - m.r) * (idx.indexOf(i) / (idx.length - 1));
  const dayIndex = d => { let j = dates.findIndex(x => x >= d); if (j < 0) j = dates.length - 1; while (j < dates.length && all[j] == null) j++; return Math.min(j, idx[idx.length - 1]); };
  const xOfD = d => { const j = dayIndex(d); return idx.indexOf(j) >= 0 ? xOfI(j) : null; };
  const y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  const step = (() => { const r = (hi - lo) / 5, p = Math.pow(10, Math.floor(Math.log10(r))); return [1, 2, 2.5, 5, 10].map(k => k * p).find(k => r <= k) || 10 * p; })();
  let g = "";
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${cv("--grid")}"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? "$" + Math.round(v).toLocaleString() : "$" + (+v.toFixed(2))}</text>`;
  const nT = W < 520 ? 3 : 5; for (let k = 0; k <= nT; k++) { const i = idx[Math.round(k * (idx.length - 1) / nT)]; const d = new Date(dates[i] + "T12:00:00");
    g += `<text x="${xOfI(i)}" y="${H - m.b + 16}" text-anchor="${k === 0 ? "start" : k === nT ? "end" : "middle"}">${d.toLocaleDateString(undefined, months <= 12 ? { month: "short", day: "numeric" } : { month: "short", year: "numeric" })}</text>`; }
  const line = idx.map((i, k) => (k ? "L" : "M") + xOfI(i).toFixed(1) + "," + y(all[i]).toFixed(1)).join("");
  const up = all[idx[idx.length - 1]] >= all[idx[0]];
  const chg = all[idx[idx.length - 1]] / all[idx[0]] - 1;
  document.getElementById("mpx").innerHTML = `${money2(all[idx[idx.length - 1]])}<div class="${cls(chg)}" style="font-size:12.5px">${pct(chg)} · ${pop.span}</div>`;
  const many = trades.length > 30;
  // markers: headshot at the trade date on the price line, stacked when they'd overlap; "disc." on the disclosure date
  const size = W < 520 ? 22 : 26, used = [];
  const mk = trades.map(tr => {
    const x = xOfD(tr.td); const j = dayIndex(tr.td); const yy = y(all[j] ?? tr.p ?? lo);
    let off = 0; const sz = many ? 10 : size;
    while (used.some(u => Math.abs(u.x - x) < sz * 0.9 && Math.abs(u.y - (yy - off)) < sz * 0.9)) off += sz * 0.95;
    used.push({ x, y: yy - off });
    return { tr, x, y: yy - off, base: yy };
  });
  const dz = trades.filter(tr => tr.d && tr.d <= last).map(tr => ({ tr, x: xOfD(tr.d) }));
  const dzUsed = []; dz.forEach(o => { let row = 0; while (dzUsed.some(u => u.r === row && Math.abs(u.x - o.x) < 28)) row++; dzUsed.push({ x: o.x, r: row }); o.row = row; });
  const stems = mk.filter(o => o.y !== o.base).map(o => `<line x1="${o.x}" x2="${o.x}" y1="${o.base}" y2="${o.y}" stroke="${cv(o.tr.ty === "buy" ? "--good" : "--bad")}" stroke-width="1" opacity=".6"/>`).join("");
  host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t)} price, ${pop.span}">${g}
    <path d="${line}" fill="none" stroke="${cv("--s1")}" stroke-width="2" stroke-linejoin="round"/>${stems}
    ${mk.map(o => `<circle cx="${o.x}" cy="${o.base}" r="3" fill="${cv(o.tr.ty === "buy" ? "--good" : "--bad")}"/>`).join("")}
    <line id="tln" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="${cv("--accent")}" stroke-dasharray="3 3" visibility="hidden"/>
    <line id="txh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="${cv("--muted")}" visibility="hidden"/>
    <rect id="thit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg>
    ${mk.map(o => `<button type="button" class="mk ${many ? "dot" : ""}" data-k="${o.tr.k}" style="left:${o.x}px;top:${o.y}px;width:${many ? 10 : size}px;height:${many ? 10 : size}px;border-color:var(--${o.tr.ty === "buy" ? "good" : "bad"});${many ? `background:var(--${o.tr.ty === "buy" ? "good" : "bad"})` : ""}" title="${esc(o.tr.n)}: ${o.tr.ty === "buy" ? "bought" : "sold"} ${esc(fmtDate(o.tr.td))}">${many ? "" : headshot(o.tr, "", 0)}</button>`).join("")}
    ${many && !pop.sel ? "" : dz.filter(o => !many || (pop.sel && pop.sel.k === o.tr.k)).map(o => `<span class="dz" data-k="${o.tr.k}" style="left:${o.x}px;top:${H - m.b + 22 + o.row * 0}px;color:var(--${o.tr.ty === "buy" ? "good" : "bad"})" title="${esc(o.tr.n)} disclosed ${esc(fmtDate(o.tr.d))}">disc.</span>`).join("")}
    <div class="tcip" id="tcip" hidden></div>`;
  // the disclosure marks share one row; overlapping ones are thinned out so labels stay readable
  if (!many) { const seen = []; host.querySelectorAll(".dz").forEach(el => { const x = parseFloat(el.style.left); if (seen.some(v => Math.abs(v - x) < 26)) el.style.visibility = "hidden"; else seen.push(x); }); }
  const det = document.getElementById("tdet"), list = document.getElementById("tlist");
  const select = k => {
    pop.sel = k == null ? null : trades.find(x => x.k === k) || null;
    host.querySelectorAll(".mk,.dz").forEach(el => el.classList.toggle("on", pop.sel && +el.dataset.k === pop.sel.k));
    list.querySelectorAll("tr[data-k]").forEach(el => el.classList.toggle("on", pop.sel && +el.dataset.k === pop.sel.k));
    const ln = host.querySelector("#tln");
    if (pop.sel && pop.sel.d && pop.sel.d <= last) { const x = xOfD(pop.sel.d); ln.setAttribute("x1", x); ln.setAttribute("x2", x); ln.setAttribute("stroke", cv(pop.sel.ty === "buy" ? "--good" : "--bad")); ln.setAttribute("visibility", "visible"); }
    else ln.setAttribute("visibility", "hidden");
    if (many && pop.sel) { const dzs = host.querySelectorAll(".dz"); dzs.forEach(e => e.remove());
      if (pop.sel.d && pop.sel.d <= last) host.insertAdjacentHTML("beforeend", `<span class="dz on" data-k="${pop.sel.k}" style="left:${xOfD(pop.sel.d)}px;top:${H - m.b + 22}px;color:var(--${pop.sel.ty === "buy" ? "good" : "bad"})">disc.</span>`); }
    det.innerHTML = pop.sel ? `<div class="tdet">${headshot(pop.sel, "av", 0)}<div>${tradeLineText(pop.sel)}</div></div>` : "";
  };
  host.querySelectorAll(".mk,.dz").forEach(el => el.addEventListener("click", ev => { ev.stopPropagation(); const k = +el.dataset.k; select(pop.sel && pop.sel.k === k ? null : k); }));
  // trades in this span, newest first
  const rows = trades.slice().sort((a, b) => b.td.localeCompare(a.td));
  list.innerHTML = rows.length ? `<div class="tbl scroll tlist"><table><thead><tr><th>Member</th><th></th><th>Traded</th><th class="n">Price</th><th class="n">Amount</th><th>Disclosed</th></tr></thead><tbody>
    ${rows.map(tr => `<tr data-k="${tr.k}"><td><span class="nm" style="display:inline-flex;align-items:center;gap:6px">${headshot(tr, "av sm", 0)}${esc(tr.n)}${tagHtml({ n: tr.n, b: tr.b })}</span></td><td><span class="bs ${tr.ty}">${tr.ty === "buy" ? "Buy" : "Sell"}</span></td><td class="nw">${esc(fmtDate(tr.td))}</td><td class="n">${priceCell(tr)}</td><td class="n">${kfmt(tr.lo)}${tr.hi ? "–" + kfmt(tr.hi) : "+"}<div class="foot">${esc(shares(tr) || "")}</div></td><td class="nw">${esc(fmtDate(tr.d))}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="foot">No member trades of ${esc(t)} in this period${(C.trades[t] || []).length ? "; try a longer timespan" : ""}.</div>`;
  list.querySelectorAll("tr[data-k]").forEach(el => el.addEventListener("click", () => { const k = +el.dataset.k; select(pop.sel && pop.sel.k === k ? null : k); }));
  // crosshair with the day's close
  const hit = host.querySelector("#thit"), tip = host.querySelector("#tcip"), xh = host.querySelector("#txh");
  const move = ev => {
    const r = hit.getBoundingClientRect(), px_ = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const k = Math.max(0, Math.min(idx.length - 1, Math.round(px_ / r.width * (idx.length - 1)))), i = idx[k], x = xOfI(i);
    xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `${esc(fmtDate(dates[i]))} · <b>${money2(all[i])}</b>`; tip.hidden = false;
    tip.style.left = Math.min(Math.max(0, x - 70), W - 160) + "px"; tip.style.top = "0px";
  };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("mouseleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
  hit.addEventListener("click", () => select(null));
  if (pop.sel) select(pop.sel.k);
}
addEventListener("resize", () => { if (pop.t && pop.charts) { clearTimeout(pop.rt); pop.rt = setTimeout(drawTickerChart, 150); } });

// ---------- data from Cloudflare ----------
function errorText(e) {
  switch (e?.code) {
    case "login": return "Please log in.";
    case "no_file": return "No results on Cloudflare yet. They arrive with the next update (within about 15 minutes).";
    case "offline": return "You're offline. Connect to the internet and tap Refresh.";
    default: return "Couldn't load results" + (e?.message ? ": " + esc(e.message) : ".");
  }
}
async function api(path, opts = {}) {
  let r;
  try { r = await fetch(path, { credentials: "same-origin", ...opts }); }
  catch (e) { throw { code: "offline" }; }
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw { code: "login" }; }
  let js = null;
  try { js = await r.json(); } catch (e) { if (r.ok) throw { code: "bad_json", message: "the results file is incomplete; try Refresh in a minute" }; }
  if (r.status === 404 && js?.error === "no-file") throw { code: "no_file" };
  if (!r.ok) throw { code: js?.error || "http", why: js?.why, message: js?.message || ("error " + r.status), status: r.status };
  return { js, headers: r.headers };
}
const WHY_BUY = { "amount-over-limit": "the amount is over your per-order limit", "not-enough-cash": "not enough buying power",
  "not-tradable": "Alpaca can't trade this stock", "not-found": "stock not found on Alpaca", "no-price": "no current price",
  "amount-too-small": "the amount is less than one share", "no-keys": "no Alpaca keys are set up", "bad-request": "the request couldn't be read" };

let loading = false, lastData = 0, lastLive = null, liveTimer = null;
async function loadData() {
  if (loading) return; loading = true;
  try {
    const { js } = await api("/api/data");
    state.data = js; state.error = null; lastData = Date.now();
    if (lastLive) applyLive(lastLive);
    const upd = js.updated;
    const hours = (Date.now() - Date.parse(upd)) / 3.6e6;
    setStatus(hours > 36 ? "stale" : "ok", "Results updated " + ago(upd) + " (" + fmtET(upd) + ")" + (hours > 36 ? " · the daily update hasn't run since then" : ""), true);
  } catch (e) {
    if (e.code === "login") return;
    if (state.data) setStatus("stale", e.code === "offline" ? "Offline · showing the last results" : "Couldn't refresh · showing the last results", true);
    else { state.error = errorText(e); setStatus("err", e.code === "no_file" ? "Waiting for the first upload" : "Couldn't load results", true); }
  } finally { loading = false; render(); }
  loadLive();
}

// live account numbers straight from Alpaca, laid over the last full update
function applyLive(L) {
  const p = state.data?.portfolio;
  state.taps = L.taps || [];
  if (!p) return;
  const old = Object.fromEntries((p.positions || []).map(x => [x.t, x]));
  p.positions = (L.positions || []).map(x => ({ bot: false, sleeve: null, hold: null, bought: null, held: null, ...(old[x.t] || {}), ...x }))
    .sort((a, b) => (b.mv || 0) - (a.mv || 0));
  if (L.equity != null) { p.equity = L.equity; p.cash = L.cash; if (L.last_equity) p.day_pl = L.equity - L.last_equity; }
  p.market_open = L.market_open; p.next_open = L.next_open; p.updated = L.at;
}
async function loadLive() {
  clearTimeout(liveTimer);
  if (document.visibilityState === "visible" && state.data && !window.__CTD_SAMPLE) {
    try { lastLive = (await api("/api/live")).js; applyLive(lastLive); render(); } catch (e) {}
  }
  liveTimer = setTimeout(loadLive, 60000);
}

async function sendOrder(t) {
  const inp = document.getElementById("amt-" + t);
  const dollars = Math.round(parseFloat(inp ? inp.value : state.amounts[t]) * 100) / 100;
  if (!(dollars >= 1)) { state.tapMsg[t] = { ok: false, text: "Enter a dollar amount." }; render(); return; }
  state.sending = true; render();
  try {
    const { js } = await api("/api/buy", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t, dollars }) });
    state.tapMsg[t] = { ok: true, text: `Order placed: ${money(dollars)} of ${t}` + (js.qty ? ` (${js.qty} shares)` : "") +
      (js.market_open ? "." : `. It fills when the market opens (${fmtET(js.next_open)}).`) };
    state.confirm = null;
    loadLive();
  } catch (e) {
    state.tapMsg[t] = { ok: false, text: e.code === "offline" ? "You're offline; the order wasn't sent." :
      e.code === "login" ? "Log in again, then tap Buy." :
      "Not placed: " + (WHY_BUY[e.why] || (e.why || "").replace(/-/g, " ") || e.message || "unknown reason") + "." };
  } finally { state.sending = false; render(); }
}
document.getElementById("main").addEventListener("click", ev => {
  const b = ev.target.closest("[data-buy],[data-send],[data-cancel]");
  if (!b) return;
  if (b.dataset.buy) { state.confirm = b.dataset.buy; delete state.tapMsg[b.dataset.buy]; render(); document.getElementById("amt-" + b.dataset.buy)?.focus(); }
  else if (b.dataset.send) { if (!state.sending) sendOrder(b.dataset.send); }
  else if (b.dataset.cancel) { state.confirm = null; render(); }
});
document.getElementById("main").addEventListener("input", ev => {
  if (ev.target.id && ev.target.id.startsWith("amt-")) state.amounts[ev.target.id.slice(4)] = ev.target.value;
});
$("#refresh").addEventListener("click", () => { setStatus("", "Checking for new results…", false); loadData(); });

// ---------- login ----------
function showLogin(msg) {
  $("#login").hidden = false;
  $("#pcMsg").textContent = msg || "";
  setTimeout(() => $("#pc").focus(), 50);
}
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const go = $("#pcGo"); go.disabled = true; $("#pcMsg").textContent = "";
  try {
    await api("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ passcode: $("#pc").value }) });
    $("#login").hidden = true; $("#pc").value = "";
    loadData();
  } catch (e) {
    $("#pcMsg").textContent = e.code === "offline" ? "You're offline." : (e.message || "Couldn't log in.");
  } finally { go.disabled = false; }
});

// refresh when the app comes back to the screen
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !$("#login").hidden) return;
  if (Date.now() - lastData > 5 * 60000) loadData(); else loadLive();
});
setInterval(() => { if (document.visibilityState === "visible" && $("#login").hidden) loadData(); }, 5 * 60000);

state.folderId = "cloud";       // turns on the Buy buttons
// preview hook for local screenshots only
if (window.__CTD_SAMPLE) { state.data = window.__CTD_SAMPLE; state.confirm = window.__CTD_CONFIRM || null; state.taps = window.__CTD_TAPS || [];
  if (window.__CTD_LOGIN) showLogin(); setStatus("ok", "Results updated " + ago(state.data.updated), true); render(); return; }
render();
api("/api/session").then(() => loadData(), e => { if (e.code !== "login") { state.error = errorText(e); setStatus("err", "Can't reach the server", true); render(); } });
})();
</script>
