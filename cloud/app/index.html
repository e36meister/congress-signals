<script>

const APP_BUILD = '0.1.dev-2618647', APP_BUILT = '2026-11-11T08:03+00:00', APP_SHA = '2618647';
// ---------- family accounts (owner, Nov 2 2026) ----------
// A family account sees Today (Buy candidates only), Members, Alerts, its own Account and a short More menu (company
// search, notifications, settings, questions, bug report). The server only answers those (cloud/accounts.js); this
// hides every button and link that would point anywhere else, and render() sends any other page back to Today.
// The owner gets the Accounts page (under More) to add people and see each portfolio.
let ROLE = "owner", SESSION_ME = null;
const isViewer = () => ROLE === "viewer";
const VIEWER_TABS = new Set(["today", "members", "port", "alerts", "more", "search", "vnotif", "vset", "faq", "blog", "bug", "terms", "privacy", "tax"]);
const VIEWER_MORE = [
  { k: "search", l: "Company search", d: "Any ticker or company: its chart, what's going on, and every member's trades" },
  { k: "vnotif", l: "Notifications", d: "Push and email: trades, the daily close, big moves, your own account alerts" },
  { k: "tax", l: "Taxes", d: "Every sale's gain or loss, your Form 8949 statement and what to file" },
  { k: "vset", l: "Settings", d: "Profile picture, extra explanations, home-screen widget, sign out" },
  { k: "faq", l: "Questions and answers", d: "How the tool picks, buys, sells and sizes, and what you can do" },
  { k: "blog", l: "Blog", d: "How things work: the Buy and Sell buttons, suggested sizing" },
  { k: "bug", l: "Report a bug or suggest a feature", d: "Something broken, or an idea for the app? It goes straight to the Operator" },
];
// Today sections a family account sees; the jump bar shows once there are two or more (owner, Nov 3 2026)
const VIEWER_SECTIONS = new Set(["today-buy"]);
const VIEWER_SUB = new Set(["search", "vnotif", "vset", "faq", "blog", "bug", "terms", "privacy", "tax"]);
function applyRole(s) {
  ROLE = s && s.role === "viewer" ? "viewer" : "owner";
  SESSION_ME = s || null;
  setTimeout(applyLeakGuards, 0);
  document.documentElement.classList.toggle("viewer", isViewer());
  // Extra explanations (owner, Nov 10 2026): saved on their account, so the owner can turn it on or off for them
  // from Accounts and they can still change it in Settings
  document.documentElement.classList.toggle("tips", isViewer() && !!(s && s.tips));
  if (isViewer() && !VIEWER_TABS.has(state.tab)) state.tab = "today";
}
function guardTab() { if (isViewer() && !VIEWER_TABS.has(state.tab)) state.tab = "today"; }
// the picture on chart markers where you bought or sold: the owner's photo, or the family member's own
function myPhoto() {
  if (!isViewer()) return "/me.jpg";
  return SESSION_ME && SESSION_ME.photo ? "/api/me/photo?v=" + encodeURIComponent(SESSION_ME.photo) : "/no-photo";

async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement("canvas");
    c.width = c.height = 256;
    c.getContext("2d").drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, 256, 256);
    return c.toDataURL("image/jpeg", 0.85);
  } finally { URL.revokeObjectURL(url); }
}
document.addEventListener("change", async ev => {
  if (ev.target.id !== "vphoto" || !isViewer() || !ev.target.files || !ev.target.files[0]) return;
  VA.photoBusy = true; VA.photoMsg = null; render();
  try {
    const data = await shrinkPhoto(ev.target.files[0]);
    const { js } = await api("/api/me/photo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ data }) });
    SESSION_ME.photo = js.photo; SESSION_ME.photo_prompted = true;
    VA.photoMsg = { ok: true, text: "Saved. It'll show on a stock's chart once you've traded it." };
  } catch (e) { VA.photoMsg = { ok: false, text: e.message && e.message !== "error 400" ? e.message : "That picture didn't work. Try another one." }; }
  VA.photoBusy = false; render();
});

});

// ---------- first time in, after the picture: turn on alerts (once per phone; alerts are per device) ----------
// Shown only where alerts can work (on iPhone: the home-screen app), and not again once on or skipped here.
let ALERT_STEP = null;     // null = not checked yet, true = show, false = don't
function alertStepSeen() { try { return localStorage.getItem("cc-alert-step") === "1"; } catch (e) { return false; } }
function alertStepDone() { try { localStorage.setItem("cc-alert-step", "1"); } catch (e) {} ALERT_STEP = false; }
function needsAlertStep() {
  if (!isViewer() || alertStepSeen()) return false;
  if (ALERT_STEP === null) {
    ALERT_STEP = false;
    alertsStatus().then(st => { if (st === "off") { ALERT_STEP = true; render(); } else if (st === "on") alertStepDone(); });
  }
  return ALERT_STEP;
}
function renderAlertStep() {
  return `<section class="panel"><div class="ph"><h2>Turn on alerts</h2></div>
    <p>Get a notification on this phone when the tool buys or sells in your account, plus a short summary after the market closes. Tapping one opens the app right to it.</p>

}

function renderViewerAccount(d, opts = {}) {
  const V = d.viewer || {}, ro = !!opts.readOnly;
  if (!V.terms && !ro) return renderTermsSign(true);
  if (!V.connected && !ro) return renderConnect();
  if (!V.connected && ro) return `<div class="empty">They haven't connected their Alpaca account yet.</div>`;
  // before the first update there's no snapshot yet: the page shows zeros, with a note on what happens next
  const first = !d.portfolio;
  const p = d.portfolio || { equity: 0, cash: 0, day_pl: 0, positions: [], orders: [], limits: {}, updated: null, market_open: null };
  const firstNote = first ? `<div class="note">${VA.keyMsg ? `<b>${esc(VA.keyMsg.text)}</b> ` : ""}${ro ? "They're connected; this fills in at the next update."
      : V.hold ? "Your Alpaca account is connected. This page fills in with your account at the next update (within a few hours)."
      : V.paused ? "Your Alpaca account is connected. Trading is paused, so nothing is bought until you resume it."
      : V.auto === false ? "Your Alpaca account is connected. Auto-buying turned off by Operator: nothing is bought until the Operator turns it back on."
      : "Your Alpaca account is connected and the tool is buying the current picks for it now. This page fills in within a few minutes; pull down to refresh."}</div>` : "";
  const pos = p.positions || [], ords = p.orders || [], L = p.limits || {};
  const picks = pos.filter(x => x.bot && x.sleeve !== "park"), park = pos.filter(x => x.sleeve === "park"), own = pos.filter(x => !x.bot && x.sleeve !== "park");
  const mainP = picks.filter(x => x.sleeve !== "small"), smallP = picks.filter(x => x.sleeve === "small");
  const grp = a => { const v = a.reduce((s, x) => s + (x.mv || 0), 0), g = a.reduce((s, x) => s + (x.pl || 0), 0); return { v, g, pc: v - g > 0 ? g / (v - g) : 0, n: a.length }; };
  const GM = grp(mainP), GS = grp(smallP);
  const invested = picks.reduce((a, x) => a + (x.mv || 0), 0), gain = picks.reduce((a, x) => a + (x.pl || 0), 0), parked = park.reduce((a, x) => a + (x.mv || 0), 0);
  const C = d.close_report;
  const auto = V.hold ? `<span class="chip watch">View only for now</span>` : V.paused ? `<span class="chip avoid">Trading paused</span>` : V.auto !== false ? `<span class="chip BUY">Auto-buying on</span>` : `<span class="chip avoid">${ro ? "Auto-buying turned off by you" : "Auto-buying turned off by Operator"}</span>`;
  const row = x => {

      : `Yours<div class="foot">You bought this yourself; the tool leaves it alone</div>`;

    const off = !!(V.hold || V.paused);
    const bBtn = !buyListHas(x.t) ? "" : off ? `<button type="button" class="buybtn vb" disabled aria-disabled="true">Buy more</button>`
      : `<button type="button" class="buybtn vb" data-vbuy="${esc(x.t)}">${VA.open === x.t ? "Close" : "Buy more"}</button>`;
    const sBtn = V.hold ? `<button type="button" class="vsell" disabled aria-disabled="true">Sell</button>`
      : `<button type="button" class="vsell" data-vsell="${esc(x.t)}">${VA.sellOpen === x.t ? "Close" : "Sell"}</button>`;

  return `${ro ? "" : tip("<b>Your Account.</b> Everything here is your own real-money Alpaca account. The tool buys new picks for you as they're found, each with a share of your balance set by your buy size; spare cash waits the way you chose under Spare cash. Tap a ticker for its chart.")}

    <div class="tile"><span class="v ${cls(GM.pc)}">${pct(GM.pc, 2)}</span><span class="l">Main picks</span><span class="c">${(GM.g > 0 ? "+" : "") + money(GM.g)} · ${money(GM.v)} in ${GM.n} pick${GM.n === 1 ? "" : "s"}</span></div>
    <div class="tile"><span class="v ${cls(GS.pc)}">${pct(GS.pc, 2)}</span><span class="l">Small-company buys</span><span class="c">${(GS.g > 0 ? "+" : "") + money(GS.g)} · ${money(GS.v)} in ${GS.n} stock${GS.n === 1 ? "" : "s"}</span></div>
    <div class="tile"><span class="v">${money(V.park === "cash" ? Math.max(0, +p.cash || 0) + parked : parked)}</span><span class="l">${V.park === "cash" ? "Cash waiting for picks" : "Waiting for picks"}</span><span class="c">${V.park === "cash" ? "Kept as cash" : "In SGOV"}</span></div>
    ${!(C && C.since_start != null) ? `<div class="tile"><span class="v">${money(0)}</span><span class="l">Gain since start</span><span class="c">${pct(0, 2)} · starts counting at the first market close</span></div>` : ""}
    ${C && C.since_start != null ? `<div class="tile"><span class="v ${cls(C.gain ?? C.since_start)}">${C.gain != null ? (C.gain > 0 ? "+" : "") + money(C.gain) : pct(C.since_start, 2)}</span><span class="l">Gain since ${esc(fmtDate(C.start))}</span><span class="c">${pct(C.since_start, 2)}${C.net_in ? ` · deposits not counted` : ""} · last close ${esc(fmtDate(C.date))}</span></div>` : ""}
    ${C && C.since_start != null && C.spy_since_start != null ? `<div class="tile"><span class="v ${cls(C.since_start - C.spy_since_start)}">${pnum((C.since_start - C.spy_since_start) * 100, 2)}</span><span class="l">${C.since_start >= C.spy_since_start ? "Ahead of" : "Behind"} the S&amp;P since start</span><span class="c">You ${pct(C.since_start, 2)} · S&amp;P ${pct(C.spy_since_start, 2)}</span></div>`

  </div>
  ${parkPanel(d, ro)}
  ${sizePanel(d, ro)}
  ${(() => {

// Sell: any position but the parked fund, whenever they want, with a note on what selling early means
function vSellRow(x) {
  if (VA.sellOpen !== x.t) return "";
  const t = x.t, mode = VA.sellMode[t] || "all", m = VA.msg[t], sh = Number(x.qty).toLocaleString(undefined, { maximumFractionDigits: 4 });
  const opt = (k, l) => `<button type="button" class="seg1" data-vsellmode="${esc(t)}|${k}" aria-pressed="${mode === k}">${l}</button>`;
  const note = x.bot
    ? `<b>Before you sell:</b> the tool holds each pick for a set time because that's what tested best, and it sells ${esc(t)} itself when the time comes (or keeps it longer while it's beating the S&amp;P 500). Selling early means this pick won't get the result the strategy measured, and the tool won't buy ${esc(t)} back for this pick for 45 days. Selling part leaves the rest under the tool's rules.`
    : `<b>Before you sell:</b> this is a stock you bought yourself; the tool doesn't manage it.`;
  return `<tr class="sellrow"><td colspan="6"><div class="sellbox">
    <div class="note warn" style="margin:0 0 10px">${note} A stock held under a year counts as a short-term gain or loss for taxes.</div>
    <div class="seg" role="group" aria-label="How much">${opt("all", "All")}${opt("shares", "Shares")}${opt("dollars", "$ amount")}</div>
    ${mode === "all" ? `<p style="margin:8px 0">Sell all ${sh} shares of ${esc(t)} (about ${money(x.mv)}).</p>`
      : `<div style="margin-top:8px"><input id="vsell-${esc(t)}" class="amt" type="number" inputmode="decimal" min="0" step="any" value="${esc(VA.amt["s" + t] ?? "")}" placeholder="${mode === "shares" ? "Shares" : "Dollars"}" style="max-width:140px"></div>`}
    <div style="display:flex;gap:10px;align-items:center;margin-top:8px"><button type="button" class="vsell go" data-vsellsend="${esc(t)}"${VA.busy ? " disabled" : ""}>${VA.busy ? "Sending…" : "Send sell order"}</button>
      <button type="button" class="link" data-vsell="${esc(t)}">Cancel</button></div>
    <div class="foot">Real money. Fills now if the market is open, otherwise at the next open.</div>
    ${m ? `<div class="tapmsg ${m.ok ? "pos" : "neg"}">${esc(m.text)}</div>` : ""}</div></td></tr>`;
}

function renderConnect() {

  return `<section class="panel"><div class="ph"><h2>Connect your Alpaca account</h2></div>
  <p>The tool trades your own real-money Alpaca account: it buys the current picks as soon as you connect, then each new pick as it comes in, sized from your balance (pick a buy size below), sells on its schedule, and handles your spare cash the way you choose below. It needs a key from Alpaca to do that. You do this once.</p>
  <ol class="steps">
    <li>On a computer or phone browser, sign in at <b>app.alpaca.markets</b> and make sure you're in your <b>Live</b> account (not Paper) at the top left.</li>
    <li>On the home page, find <b>API Keys</b> on the right and tap <b>Generate New Keys</b>.</li>
    <li>Copy the <b>Key</b> and the <b>Secret</b> into the boxes below. Alpaca shows the secret only once.</li>
  </ol>
  <form id="vkeys" class="keysform" autocomplete="off">
    <input id="vk" type="text" placeholder="Key (starts with AK)" autocapitalize="characters" spellcheck="false" aria-label="Alpaca key" required>
    <input id="vs" type="password" placeholder="Secret" spellcheck="false" aria-label="Alpaca secret" required>

  </form>

  <p class="foot">The key is stored encrypted and is never shown again, here or anywhere else. It lets the tool place trades; it can't move money out of your account. To stop the tool, delete the key in Alpaca at any time.</p></section>${parkPanel(state.data || {}, false)}${sizePanel(state.data || {}, false)}`;
}

document.addEventListener("submit", async ev => {
  if (ev.target.id !== "vkeys") return;
  ev.preventDefault();
  if (VA.keyBusy) return;
  // Nov 3: the boxes were read after render() had redrawn the form, so they were always empty and every try came back
  // "Neither box looks like an Alpaca key". Read them first; put them back if Alpaca says no, so they needn't re-paste.
  const key = $("#vk").value, secret = $("#vs").value;
  if (!VA.park) { VA.keyMsg = { ok: false, text: "Choose what happens to your spare cash (below) before connecting." }; render(); const k = $("#vk"), s2 = $("#vs"); if (k) k.value = key; if (s2) s2.value = secret; return; }
  VA.keyBusy = true; VA.keyMsg = null; render();
  let ok = false;
  try {
    const { js } = await api("/api/me/keys", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key, secret, size: VA.size || "standard", park: VA.park || "" }) });
    ok = true;
    VA.keyMsg = { ok: true, text: js.message || "Connected." };
    if (state.data) state.data.viewer = { ...(state.data.viewer || {}), connected: true };
    if (SESSION_ME) SESSION_ME.connected = true;
  } catch (e) { VA.keyMsg = { ok: false, text: e.message || "Couldn't connect. Try again." }; }
  VA.keyBusy = false; render();
  if (!ok) { const k = $("#vk"), s = $("#vs"); if (k) k.value = key; if (s) s.value = secret; }
});

const errText = e => e && e.message && !/^error \d+$/.test(e.message) ? e.message : (WHY_BUY[e && e.why] || (e && e.why) || "try again");
document.addEventListener("click", async ev => {
  if (!isViewer()) return;
  const o = ev.target.closest("[data-vbuy]");
  if (o) { const t = o.dataset.vbuy; VA.open = VA.open === t ? null : t; VA.sellOpen = null; delete VA.msg[t]; render(); return; }
  const so = ev.target.closest("[data-vsell]");
  if (so) { const t = so.dataset.vsell; VA.sellOpen = VA.sellOpen === t ? null : t; VA.open = null; delete VA.msg[t]; render(); return; }
  const sm = ev.target.closest("[data-vsellmode]");
  if (sm) { const [t, k] = sm.dataset.vsellmode.split("|"); VA.sellMode[t] = k; render(); return; }
  const s = ev.target.closest("[data-vbuysend]");
  if (s && !VA.busy) {
    const t = s.dataset.vbuysend, el = document.getElementById("vbuy-" + t), dollars = parseFloat(el && el.value);
    VA.amt[t] = el ? el.value : "";
    if (!(dollars >= 1)) { VA.msg[t] = { ok: false, text: "Enter an amount of $1 or more." }; render(); return; }
    VA.busy = true; render();
    try {
      const { js } = await api("/api/buy-more", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t, dollars }) });
      VA.msg[t] = { ok: true, text: `Order sent: ${money(dollars)} of ${t}` + (js.market_open ? "." : ". It fills at the next market open.") };
      VA.open = null; delete VA.amt[t];
      setTimeout(loadLive, 4000);
    } catch (e) { VA.msg[t] = { ok: false, text: "Not sent: " + errText(e) + "." }; }
    VA.busy = false; render(); return;
  }
  const ss = ev.target.closest("[data-vsellsend]");
  if (ss && !VA.busy) {
    const t = ss.dataset.vsellsend, mode = VA.sellMode[t] || "all", el = document.getElementById("vsell-" + t), amount = el ? parseFloat(el.value) : null;
    if (el) VA.amt["s" + t] = el.value;
    if (mode !== "all" && !(amount > 0)) { VA.msg[t] = { ok: false, text: mode === "shares" ? "Enter how many shares." : "Enter a dollar amount." }; render(); return; }
    VA.busy = true; render();
    try {
      const { js } = await api("/api/sell", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t, mode, amount }) });
      VA.msg[t] = { ok: true, text: `Sell order sent${js.all ? ` for all of ${t}` : ` for ${js.qty ? js.qty + " shares" : money(js.notional)} of ${t}`}` + (js.market_open ? "." : ". It fills at the next market open.") };
      VA.sellOpen = null; delete VA.amt["s" + t];
      setTimeout(loadLive, 4000);
    } catch (e) { VA.msg[t] = { ok: false, text: "Not sent: " + errText(e) + "." }; }
    VA.busy = false; render();
  }
});

function renderFaq() {
  const hold = state.data?.adaptive?.policy?.hold_other ?? 60;
  const qa = [
    ["What does the tool do?", "Members of Congress have to report their stock trades. The tool reads every report, scores each purchase on dozens of signals (the member's track record, their committees, the size and timing of the trade and more) and puts the ones that score near the top of all past purchases on the Buy list. It buys those for you automatically."],
    ["How much does it buy?", "Every pick gets the same share of your account. The weekly check keeps testing that against giving stronger picks more, and same-size has stayed ahead. About 30% of the money goes to a separate group of small-company picks held longer."],
    ["When does it sell?", `Most picks are held about ${hold} trading days (roughly ${Math.round(hold / 21)} months). At the end, a pick that's ahead of the S&P 500 is kept and checked every day, and sold once it falls behind. These rules change only when the weekly check finds something clearly better.`],
    ["Where's my cash?", "You choose, under Spare cash on your Account page. SGOV: money not in a pick waits in SGOV, a fund of short-term U.S. Treasury bills that earns about what they pay and barely moves in price; the tool sells some when a new pick needs the money. Cash: it stays as cash in your Alpaca account (turn on Alpaca's High-Yield Cash in your Alpaca dashboard to earn interest on it). You can switch any time."],
    ["Can I buy or sell myself?", "You can buy a stock that's on today's Buy list (it's then handled like the tool's own buy) and sell anything you hold, any time, from Account. Both show a note first: the tool's results come from sticking to its rules."],
    ["What if I sell a pick early?", "It's sold right away (or at the next open). The tool won't buy that stock back for the same pick for 45 days. If you sell part, the rest stays under the tool's rules."],
    ["What do I see on a chart?", "The stock's price with every member's buys and sales on it, your own buys and sales (with your picture, if you added one), and \"What's going on\": a recent big move explained and the latest headlines."],
    ["Why isn't a stock I like on the list?", "A stock is only on the Buy list when a member bought it recently and the purchase scores in the top of all past purchases. Company search shows any stock's chart and members' trades."],
    ["Is this guaranteed to make money?", "No. The strategy is tested on past years, and past results don't promise future ones. It can lose money, sometimes for a long stretch. Only put in money you're comfortable leaving for a while."],
    ["Taxes?", "Alpaca sends you a 1099 each year with every sale. Selling a stock you held under a year is a short-term gain or loss, taxed like regular income."],
    ["How do I stop it?", "Turn on Pause trading at the bottom of your Account page: the tool stops buying and selling and holds what you have until you resume. Deleting the key in your Alpaca account also stops it for good. What you hold stays yours either way."],
  ];
  return `<section class="panel"><div class="ph"><h2>Questions and answers</h2></div>
    <div class="faq">${qa.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div>
    <p class="foot">Something not covered here? Use Report a bug or suggest a feature and ask; it goes to the Operator.</p></section>`;
}

const ACC = { list: null, err: null, loading: false, busy: false, msg: null, view: null, data: null, live: null, adding: false };
function accLoad(force) {
  if (ACC.loading || (ACC.list && !force)) return;
  ACC.loading = true;
  api("/api/accounts").then(r => { ACC.list = r.js.accounts || []; ACC.hold = r.js.hold !== false; ACC.maint = r.js.maint || { on: true }; ACC.err = null; }).catch(e => { ACC.err = e; })
    .finally(() => { ACC.loading = false; if (state.tab === "accounts") render(); });
}
async function accPost(body) {
  ACC.busy = true; render();
  try { const { js } = await api("/api/accounts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); ACC.msg = { ok: true, text: js.message || "Done." }; }
  catch (e) { ACC.msg = { ok: false, text: e.message || "That didn't work. Try again." }; }
  ACC.busy = false; accLoad(true);
}
async function accOpen(id) {
  ACC.view = id; ACC.data = null; ACC.live = null; render(); window.scrollTo(0, 0);
  try { ACC.data = (await api("/api/accounts/view?id=" + encodeURIComponent(id))).js; } catch (e) { ACC.data = { error: e.message || "Couldn't load it." }; }
  render();
  try {
    const L = (await api("/api/accounts/live?id=" + encodeURIComponent(id))).js, p = ACC.data && ACC.data.portfolio;
    if (p && L) {
      const old = Object.fromEntries((p.positions || []).map(x => [x.t, x]));

// ---------- Data health: every source's open problems (from each job and the app's server), and recent fixes ----------
const HEALTH = { js: null, err: null, loading: false };
const JOB_LABEL = { daily: "Daily update", live: "Hourly posts", social: "Posts (daily)", close: "Market-close report", quick: "Filings and orders check",
  institutions: "Institutions", watchdog: "Job watchdog", scan_house: "House scanned reports", scan_senate: "Senate scanned reports", backfill_enrich: "Backfill" };
function dataWarning(w) {
  return `<div class="note err"><b>Picks may be off: some of the data they're built from is broken, so new auto-buys are paused.</b>
    <ul style="margin:6px 0 0 18px">${w.problems.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <button type="button" class="link" data-more="health">See Data health</button></div>`;
}
function renderHealth() {
  if (!HEALTH.js && !HEALTH.loading && !HEALTH.err) {
    HEALTH.loading = true;
    loadHealth().then(js => { HEALTH.js = js || {}; HEALTH.err = null; }).catch(e => { HEALTH.err = e; })
      .finally(() => { HEALTH.loading = false; if (state.tab === "health") render(); });
  }
  if (HEALTH.err) return `<div class="note err">Couldn't load Data health${HEALTH.err.code === "app_only" ? " (it's in the phone app)" : ""}. <button type="button" class="link" data-more="health" onclick="HEALTH.err=null">Try again</button></div>`;
  if (!HEALTH.js) return `<div class="empty">Loading…</div>`;
  const jobs = Object.entries(HEALTH.js.jobs?.jobs || {}), app = Object.entries(HEALTH.js.app || {});
  const open = [];
  for (const [j, v] of jobs) for (const x of (v.open || [])) open.push({ where: JOB_LABEL[j] || j, ...x });
  for (const [k, v] of app) if (v.open) open.push({ where: "App server", kind: "app", text: v.text, first: v.first, last: v.last, runs: v.n });
  const rank = { critical: 0, crash: 1, watchdog: 2, site: 3, app: 3, problem: 4, failure: 5 };
  open.sort((a, b) => (rank[a.kind] ?? 9) - (rank[b.kind] ?? 9) || String(b.last).localeCompare(String(a.last)));
  const fixed = [...(HEALTH.js.jobs?.fixed || []).map(x => ({ where: JOB_LABEL[x.job] || x.job, text: x.text, at: x.at })),
    ...app.filter(([, v]) => !v.open && v.fixed).map(([, v]) => ({ where: "App server", text: v.text, at: v.fixed }))]
    .sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 30);
  const kindTag = k => ({ critical: "Picks paused", crash: "Job crashed", watchdog: "Job silent", site: "Website", app: "App", problem: "Data", failure: "Error" })[k] || "Problem";
  const runs = jobs.filter(([j]) => j !== "watchdog").map(([j, v]) => `${esc(JOB_LABEL[j] || j)} ${esc(ago(v.at))}`).join(" · ");
  return `<section class="panel"><div class="ph"><h2>${open.length ? `${open.length} open problem${open.length === 1 ? "" : "s"}` : "Everything is working"}</h2>
    </div>
  ${open.length ? `<div class="hlist">${open.map(x => `<div class="hrow"><span class="chip ${["critical", "crash"].includes(x.kind) ? "SHORT" : x.kind === "failure" ? "watch" : "avoid"}">${kindTag(x.kind)}</span>
      <div><div>${esc(x.text)}</div><div class="foot">${esc(x.where)} · since ${esc(fmtET(x.first))}${x.runs > 1 ? ` · ${x.runs} runs in a row` : ""}</div></div></div>`).join("")}</div>`
    : `<div class="empty">No source failed or came back empty in the latest runs.</div>`}
  <p class="foot">Last reports: ${runs || "–"}</p></section>
  ${fixed.length ? `<section class="panel"><div class="ph"><h2>Fixed in the last 2 weeks</h2></div><div class="hlist">${fixed.map(x => `<div class="hrow"><span class="chip BUY">Fixed</span><div><div>${esc(x.text)}</div><div class="foot">${esc(x.where)} · ${esc(fmtET(x.at))}</div></div></div>`).join("")}</div></section>` : ""}`;
}

// ---------- your profile: laid out like a member's page, from your Alpaca account ----------
const ME = { who: "all", open: null };
function renderMe(d) {
  const P = d.portfolio || {}, c = d.close_report || {};
  const fills = [];
  for (const [t, fs] of Object.entries(P.fills || {})) for (const f of fs || []) if (f && f[0]) fills.push({ t, td: String(f[0]).slice(0, 10), side: f[1], qty: f[2], px: f[3], by: f[4], own: true });
  fills.sort((a, b) => b.td.localeCompare(a.td) || a.t.localeCompare(b.t));
  const BY = { you: "You", tap: "Buy button", tool: "The tool" };
  const shown = fills;
  const pos = Object.fromEntries((P.positions || []).map(x => [x.t, x]));
  const v = liveVsSpy(d);
  const sinceBuy = f => { const x = pos[f.t]; return f.side === "buy" && x && x.px && f.px ? x.px / f.px - 1 : null; };
  const nb = fills.filter(f => f.side === "buy").length, ns = fills.length - nb;
  return `<section class="panel"><div class="mehead"><img src="/me.jpg" alt="" onerror="this.style.display='none'"><div><h2>Your profile</h2>
      <div class="foot">${P.mode === "live" ? "Real money" : "Paper account"}${c.start ? ` · since ${esc(fmtDate(c.start))}` : ""} · ${nb} buy${nb === 1 ? "" : "s"}, ${ns} sale${ns === 1 ? "" : "s"}</div></div><button type="button" class="btn ghost" data-more="tax" style="margin-left:auto;align-self:center">Taxes</button></div></section>
  <div class="tiles">
    <div class="tile"><span class="v">${money(P.equity)}</span><span class="l">Account value</span></div>
    ${v ? `<div class="tile"><span class="v ${cls(v.acct)}">${pnum(v.acct, 2)}</span><span class="l">Your results since start</span><span class="c">S&amp;P ${pnum(v.spy, 2)}</span></div>
    <div class="tile"><span class="v ${cls(v.gap)}">${pnum(v.gap, 2)}</span><span class="l">${v.gap >= 0 ? "Ahead of" : "Behind"} the S&amp;P</span></div>` : ""}
    <div class="tile"><span class="v">${(P.positions || []).length}</span><span class="l">Open positions</span></div>
  </div>
  ${c.series?.dates?.length ? `<section class="panel"><div class="ph"><h2>You vs the S&amp;P</h2></div><div class="chart" id="mechart"></div></section>` : ""}
  <section class="panel"><div class="ph"><h2>Trades</h2><span class="sub">Tap one for its context · <span class="mtag" style="margin:0">manual</span> = you placed it</span></div>
    ${shown.length ? shown.slice(0, 200).map((f, i) => {
      const k = f.t + "|" + f.td + "|" + f.side + "|" + i, g = sinceBuy(f);
      return `<div class="metr"><div class="top" data-meopen="${esc(k)}" style="cursor:pointer">${tkBtn(f.t)}<span class="bs ${f.side}">${f.side === "buy" ? "Bought" : "Sold"}</span>
        <span>${esc(fmtDate(f.td))}</span><span class="mono">${Number(f.qty).toLocaleString(undefined, { maximumFractionDigits: 4 })} sh at ${money2(f.px)}</span>
        ${g != null ? `<span class="${cls(g)}">${pct(g)} since</span>` : ""}${f.by === "tool" ? "" : `<span class="mtag">manual</span>`}</div>
        ${ME.open === k ? ctxBlock(f) : ""}</div>`;

function peopleOf(r) {
  if (Array.isArray(r.ppl) && r.ppl.length) return r.ppl;
  return String(r.m || "").split(/,\s*(?![^()]*\))/).filter(Boolean).map(x => {
    const m = x.match(/^(.*?)\s*\(([^)]+)\)\s*$/); return m ? { n: m[1], r: m[2] } : { n: x.trim() };
  });
}
function tagOf(p) {
  const T = state.data?.member_tags || {};
  return (p.b && T.bio?.[p.b]) || T.names?.[p.n] || "";
}
function tagHtml(p) { const t = tagOf(p); return t ? `<span class="ptag ${esc(t[0])}">${esc(t)}</span>` : ""; }
function membersText(m) {
  return String(m || "").split(/,\s*(?![^()]*\))/).filter(Boolean).map(x => {
    const mm = x.match(/^(.*?)\s*\(([^)]+)\)\s*$/); const n = (mm ? mm[1] : x).trim();
    return mlink(n) + (mm ? ` (${esc(mm[2])})` : "") + tagHtml({ n });
  }).join(", ");
}
function avatar(p, small) {
  const src = p.b && state.data?.photos?.[p.b];
  const cls = "av" + (small ? " sm" : "");
  if (src) return `<img class="${cls}" src="${src}" alt="" loading="lazy">`;
  const parts = String(p.n || "?").replace(/\b(Mr|Mrs|Ms|Dr|Hon|Jr|Sr|II|III)\b\.?/g, "").trim().split(/\s+/);
  const ini = ((parts[0] || "?")[0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  return `<span class="${cls}" aria-hidden="true">${esc(ini)}</span>`;
}
// each member's own track under their name (owner, Oct 21: with 2+ members, who has which record)
function trackText(p, side) {
  if (p.tr == null) return "";
  return side === "sell" ? `Sales lag ${Number(p.tr).toFixed(1)}% (${p.tn})` : `Track ${p.tr > 0 ? "+" : ""}${Number(p.tr).toFixed(1)}% (${p.tn})`;
}
// (Nov 9: BHE, 2 buyers) a person missing the photo ID or faith label borrows it from the same member on any other card
function fillPerson(p) {
  if (p.b && p.r) return p;
  const w = state.data?.watchlist || {};
  for (const row of [...(w.buys || []), ...(w.sells || [])]) for (const q of (Array.isArray(row.ppl) ? row.ppl : [])) {
    if (q.n !== p.n) continue;
    if (!p.b && q.b) p = { ...p, b: q.b };
    if (!p.r && q.r) p = { ...p, r: q.r };
    if (p.b && p.r) return p;
  }
  return p;
}
// owner, Nov 9: with 2+ members each name is on its own line (photo, party tag, faith), with the labels that are only
// theirs right under their name; labels every member shares stay once on the card
function peopleRow(r, side, own) {
  const ps = peopleOf(r).map(fillPerson);
  const multi = ps.length > 1;
  return `<div class="ppl${multi ? " multi" : ""}"><span class="lbl">${side === "sell" ? "Sold by" : "Bought by"}</span>${ps.map(p => {
    const sub = [p.r, multi ? trackText(p, side) : ""].filter(Boolean).join(" · ");
    const mine = multi && own ? own.get(p.n) : null;
    return `<div class="pblk"><span class="person">${avatar(p)}<span><span class="pn">${mlink(p.n, p.b)}${tagHtml(p)}</span>${sub ? `<span class="pr">${esc(sub)}</span>` : ""}</span></span>${mine && mine.length ? tagsHtml(mine, 5, `${String(p.n).replace(/^(Hon\.?\s+)/i, "")}: why`).replace('<div class="tags">', '<div class="tags pwhy">') : ""}</div>`;
  }).join("")}</div>`;
}
// the "N bought / N sold within 30d" label isn't needed on a card that lists every buyer or seller (owner, Nov 9)
const CROWD_RX = /\d+ members? (?:bought|sold) within 30d/i;
const noCrowd = rs => (Array.isArray(rs) ? rs : String(rs || "").split(/;\s*/)).filter(x => !CROWD_RX.test(String(x)));
// with 2+ members the track is shown under each name, so the card's single Track tag (the top member's) is dropped
// with 2+ members on a pick: reasons every member shares stay on the card; the rest show under each member's name
function splitWhy(r) {
  const trk = x => /past buys [+\-]?[\d.]+% vs SPY avg|stocks this member sold lagged SPY/i.test(x);   // shown next to each name already
  const ps = peopleOf(r).filter(p => Array.isArray(p.why)).map(p => ({ ...p, why: p.why.filter(x => !trk(x)) }));
  if (ps.length < 2) return null;
  const key = x => reasonTag(x).label;
  const sets = ps.map(p => new Set(p.why.map(key)));
  const shared = ps[0].why.filter(x => sets.every(st => st.has(key(x))));
  const sk = new Set(shared.map(key));
  return { shared, per: ps.map(p => ({ p, own: p.why.filter(x => !sk.has(key(x))) })).filter(x => x.own.length) };
}
function whyFor(r) {
  const ps = peopleOf(r);
  if (ps.length < 2 || !ps.some(p => p.tr != null)) return r.why;
  const rs = (Array.isArray(r.why) ? r.why : String(r.why || "").split(/;\s*/));
  return rs.filter(x => !/past buys [+\-]?[\d.]+% vs SPY avg|stocks this member sold lagged SPY/i.test(x));
}
function peopleCell(r) {
  return `<div class="who-cell">${peopleOf(r).map(p => `<span class="nm">${avatar(p, true)}${mlink(p.n, p.b)}${tagHtml(p)}</span>`).join("")}</div>`;
}

const OPEN = ["new", "accepted", "pending_new", "partially_filled", "accepted_for_bidding", "held", "calculated"];
const tickerOf = name => (name.match(/^order_(?:request|done|failed)_([A-Z][A-Z0-9-]{0,6})_/) || [])[1];
function pendingFor(t) { return (state.taps || []).find(o => o.t === t && OPEN.includes(o.status)); }
function buyArea(r) {
  if (isViewer()) return vBuyArea(r);
  const p = state.data?.portfolio;
  if (!p || !state.folderId) return "";
  const held = (p.positions || []).some(x => x.t === r.t);
  if (pendingFor(r.t)) return `<span class="chip new">Order placed · waiting to fill</span>`;
  return `<button type="button" class="buybtn" data-buy="${esc(r.t)}"${held ? " title=\"You already hold this\"" : ""}>${held ? "Buy more" : "Buy"}</button>`;
}
function suggestion(r) {
  const L = state.data?.portfolio?.limits || {};
  const base = L.per_pick || L.dollars;
  if (!base) return null;
  const on = (L.sizing || state.data?.adaptive?.policy?.sizing || "equal") !== "equal";
  const k = on && r.sz != null ? r.sz : 1;
  const amt = Math.max(10, Math.round(base * k / 10) * 10);
  return { amt, k, on, sh: r.px ? amt / r.px : null };
}
function suggestLine(r) {
  if (isViewer()) return "";
  const g = suggestion(r); if (!g) return "";
  const sh = g.sh == null ? "" : ` ≈ ${g.sh >= 10 ? Math.round(g.sh).toLocaleString() : g.sh.toFixed(1)} sh`;
  const why = !g.on ? "standard size" : g.k > 1.02 ? `${g.k.toFixed(2)}× · stronger pick` : g.k < 0.98 ? `${g.k.toFixed(2)}× · near the bar` : "standard size";
  return `<div class="sc" title="Suggested amount for this pick">Suggested ${money(g.amt)}${sh}<div class="foot" style="text-align:inherit">${why}</div></div>`;
}
function confirmBox(r) {
  if (isViewer()) return vBuyBox(r.t, false);
  if (state.confirm !== r.t) return state.tapMsg[r.t] ? `<div class="tapmsg ${state.tapMsg[r.t].ok ? "pos" : "neg"}">${esc(state.tapMsg[r.t].text)}</div>` : "";
  const p = state.data.portfolio, real = p.mode === "live";
  const amt = state.amounts[r.t] ?? (suggestion(r)?.amt || p.limits?.dollars || 5000);
  return `<div class="confirm"><span>Buy <b>${esc(r.t)}</b> for $</span>
    <input type="number" inputmode="decimal" min="1" step="100" id="amt-${esc(r.t)}" value="${esc(amt)}" aria-label="Dollar amount">
    <span class="${real ? "real" : ""}">${real ? "Real money account" : "Paper account (fake money)"}</span>
    <button type="button" class="buybtn" data-send="${esc(r.t)}"${state.sending ? " disabled" : ""}>${state.sending ? "Sending…" : "Send order"}</button>
    <button type="button" class="link" data-cancel="1">Cancel</button>
    <span class="foot">Sent to Alpaca right away; fills now if the market is open, otherwise tries after-hours and pre-market (within 0.5% of the last price), then the open.</span>${state.tapMsg[r.t] ? `<div class="tapmsg neg">${esc(state.tapMsg[r.t].text)}</div>` : ""}</div>`;
}

// ---------- shorthand tags: a short word on the card, the full reason in a popup ----------

  [/^large \(\$([\d,]+)\+\)/i, m => "Big trade " + kfmt(+m[1].replace(/,/g, "")) + "+",

  [/past buys ([+\-]?[\d.]+%) vs SPY avg \((\d+)\)/i, m => `Track ${m[1]} (${m[2]})`, "", "", "plain"],

  [/company lobbies this member's committees/i, () => "Lobbies committee", "The company lobbies the committees this member sits on."],
  [/company PAC gave member \$([\d,]+)/i, m => `PAC $${m[1]}`, "The company's PAC gave this member money."],
  [/sponsored (\d+) (.+?) bill/i, m => `Bill sponsor`, "The member sponsored a bill in this area."],
  [/voted on a bill in this industry near the trade/i, () => "Vote nearby", "The member voted on a bill in this industry close to the trade date."],
  [/first time trading this stock/i, () => "First trade", "The first time this member traded this stock."],
  [/defense awards rising \(\$([\d.,]+[MB]?)/i, m => `Defense $${m[1]}`, "Defense Department awards to the company are rising."],

  [/their campaign paid the company/i, () => "Campaign paid co.", "The member's campaign paid this company."],

  [/company is based in their state/i, () => "Home state", "The company is based in the member's state."],
  [/used options/i, () => "Options", "The trade used options."],
  [/spouse or family account/i, () => "Spouse/family", "The trade was in a spouse's or family member's account."],
  [/(\d+)x their usual (?:trade )?size/i, m => `${m[1]}× size`, "Much bigger than this member's usual trade."],

let TIPS = [];
function reasonTag(text) {
  const t = String(text || "").trim();
  for (const [rx, lab, about, tone, plain] of TAG_RULES) {
    const m = t.match(rx);
    if (m) return { label: lab(m), about, tone: tone || (/^but\b/i.test(t) ? "neg" : ""), full: t, plain: !!plain };
  }
  const words = t.replace(/^but\s+/i, "").split(/\s+/);
  return { label: words.slice(0, 3).join(" ") + (words.length > 3 ? "…" : ""), about: "", tone: /^but\b/i.test(t) ? "neg" : "", full: t };
}
function tipBtn(label, title, body, cls = "") {
  const id = TIPS.push({ title, body }) - 1;
  return `<button type="button" class="tag ${cls}" data-tip="${id}">${esc(label)}</button>`;
}
function tagsHtml(reasons, max = 6, title = "Why it's flagged") {
  const rs = (Array.isArray(reasons) ? reasons : String(reasons || "").split(/;\s*/)).map(x => String(x).trim()).filter(Boolean);
  if (!rs.length) return "";
  const tags = rs.map(reasonTag);
  const seen = new Set(), uniq = tags.filter(g => !seen.has(g.label) && seen.add(g.label));
  const all = `<ul class="tipl">${rs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const shown = uniq.slice(0, max).map(g => g.plain ? `<span class="tag plain">${esc(g.label)}</span>` : tipBtn(g.label, g.label, `<p>${esc(g.full)}</p>${g.about ? `<p class="foot xtip">${esc(g.about)}</p>` : ""}`, g.tone));
  if (uniq.length > max) shown.push(tipBtn(`+${uniq.length - max} more`, title, all, "more"));
  else if (rs.length > 1) shown.push(tipBtn("All", title, all, "more"));
  return `<div class="tags">${shown.join("")}</div>`;
}
function openTip(i) {
  const t = TIPS[i]; if (!t) return;
  let bg = document.getElementById("tipbg");
  if (!bg) { bg = document.createElement("div"); bg.id = "tipbg"; bg.className = "tipbg"; document.body.appendChild(bg); }
  bg.innerHTML = `<div class="tipsheet" role="dialog" aria-modal="true" aria-label="${esc(t.title)}"><div class="tiph"><b>${esc(t.title)}</b><button type="button" class="link" data-tipclose="1" aria-label="Close">Close</button></div><div class="tipb">${t.body}</div></div>`;
  bg.hidden = false;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-tip]");
  if (b) { ev.preventDefault(); openTip(+b.dataset.tip); return; }
  const bg = document.getElementById("tipbg");
  if (bg && !bg.hidden && (ev.target === bg || ev.target.closest("[data-tipclose]"))) { bg.hidden = true; bg.innerHTML = ""; }
});
addEventListener("keydown", e => { const bg = document.getElementById("tipbg"); if (e.key === "Escape" && bg && !bg.hidden) { bg.hidden = true; bg.innerHTML = ""; } });

function fmtShort(d) {
  const x = new Date(String(d).slice(0, 10) + "T12:00:00");
  return isNaN(x) ? String(d || "") : x.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function tradeLine(r) {
  const d = r.d ? String(r.d).slice(0, 10) : null, td = r.td ? String(r.td).slice(0, 10) : null;
  if (!td) return `Disclosed ${esc(fmtDate(d))}`;
  const lag = r.lag != null ? Math.round(r.lag) : (d ? Math.round((Date.parse(d) - Date.parse(td)) / 864e5) : null);
  return `${r.action === "SHORT" || r.action === "avoid" ? "Sold" : "Bought"} ${esc(fmtShort(td))} · filed ${esc(fmtShort(d))}${lag != null ? ` (${lag}d)` : ""}`;
}
function pickRow(r, side) {
  const isNew = (state.data.watchlist?.new || []).some(n => n.t === r.t && (side === "sell" ? n.action === "SHORT" : n.action === "BUY"));
  const ctx = [];
  const ctxNote = "Context only: not part of the score.";
  if (r.an) ctx.push(tipBtn(`Analysts ${r.an.replace(/_/g, " ")}`, "Analysts", `<p>Wall Street analysts' average rating: <b>${esc(r.an.replace(/_/g, " "))}</b>.</p><p class="foot">${ctxNote}</p>`, "ctx"));
  if (r.up != null) ctx.push(tipBtn(`Target ${pnum(r.up, 0)}`, "Analyst price target", `<p>Analysts' average price target is ${esc(pnum(r.up, 0))} from today's price.</p><p class="foot">${ctxNote}</p>`, "ctx"));
  if (r.earn) ctx.push(tipBtn(`Earnings ${fmtShort(r.earn)}`, "Next earnings report", `<p>${esc(fmtDate(String(r.earn).slice(0, 10)))}</p><p class="foot">${ctxNote}</p>`, "ctx"));
  if (r.news != null) ctx.push(tipBtn(`${r.news} news`, "News this week", `<p>${esc(r.news)} news stories about the company this week.</p><p class="foot">${ctxNote}</p>`, "ctx"));
  if (r.nwm) ctx.push(tipBtn(`${r.nwm} member+co news`, "In the news together", `<p>${esc(r.nwm)} stories mention the member and the company together.</p>`, "ctx"));
  (r.hear || []).forEach(h => ctx.push(tipBtn(`Testifies ${fmtShort(h.date)}`, "Testifies before Congress", `<p><b>${esc(fmtDate(h.date))}</b>: ${esc(h.title)}</p>`, "neg")));
  const pctTop = r.pct != null ? Math.max(1, Math.round(100 - r.pct)) : null;
  return `<article class="pick" data-hl="pick:${esc(r.t)}">
    <div class="tk"><b>${tkBtn(r.t)}</b><span class="chip ${esc(r.action)}">${esc(r.action)}</span>${isNew ? `<span class="chip new">New</span>` : ""}${r.def ? `<span class="chip watch">Defense</span>` : ""}${r.ags ? `<span class="chip avoid" title="The member bought while most analysts rated it hold or worse">Against Wall Street</span>` : ""}</div>
    <div>
      <div class="co">${esc(r.co || r.t)}${r.sec ? ` <span class="who">· ${esc(r.sec)}</span>` : ""}</div>
      <div class="who">${tradeLine(r)}</div>
      ${moverChip(r.t)}
      ${(() => { const sp = splitWhy(r);
        if (!sp) return peopleRow(r, side) + tagsHtml(noCrowd(whyFor(r)), 6, `Why ${r.t} is on the list`);
        const own = new Map(sp.per.map(x => [x.p.n, noCrowd(x.own)]));
        return peopleRow(r, side, own) + tagsHtml(noCrowd(sp.shared), 6, `Why ${r.t} is on the list`); })()}
      ${ctx.length ? `<div class="tags">${ctx.join("")}</div>` : ""}
    </div>
    <div class="side">
      <div class="meter" title="Score ${r.s}"><i style="width:${Math.max(3, Math.min(100, r.s || 0))}%"></i></div>
      <div class="sc">Score ${r.s != null ? Number(r.s).toFixed(0) : "–"}${pctTop != null ? ` · top ${pctTop}%` : ""}</div>
      ${r.mt != null ? `<div class="mv ${cls(r.mt)}">${pct(r.mt)} since purchase</div>` : ""}<div class="mv ${cls(r.move)}">${pct(r.move)} since disclosure</div>
      ${side === "buy" && r.action === "BUY" ? suggestLine(r) : ""}
      ${side === "buy" ? buyArea(r) : ""}
    </div>
    ${side === "buy" ? confirmBox(r) : ""}
  </article>`;
}

// a jump bar for the Today tab: one tap to each section (it stays under the header while scrolling)
function todayJump(d, nb, nAvoid, nAlso) {
  if (isViewer() && VIEWER_SECTIONS.size < 2) return "";
  const notable = (POSTS.feed?.items || []).filter(x => x.lvl >= 2).length;
  const items = [["today-buy", "Buy", nb], ["today-worth", "Worth a look", (d.worth || []).length],
    ["posts", "Posts", POSTS.err?.code === "app_only" ? null : notable], ["today-avoid", "Avoid", nAvoid],

const JUMP_SHORT = { "Defense buy candidates": "Buy", "Defense stocks to avoid": "Avoid", "Defense picks vs the market": "Chart",
  "Defense portfolio results": "Results", "Which signals worked for defense stocks": "Signals", "Recent defense picks": "Recent picks",
  "Small-company candidates": "Candidates", "Growth of $1": "Chart", "Results": "Results", "Year by year": "By year",
  "Recent small-company picks": "Recent picks", "The 45-day disclosure delay": "Delay", "How long to hold": "Hold time",
  "Do skilled members stay skilled?": "Skill", "Company size": "Size", "Busiest traders check": "Busiest", "Trading partners": "Partners",
  "Copycat traders": "Copycats", "Buy signals": "Buy signals", "Sell signals": "Sell signals", "Weight tuning": "Tuning", "Missing price data": "Missing data" };
function autoJump(html, prefix) {
  const rx = /<section class="panel"( id="[^"]*")?><div class="ph"><h2>([\s\S]*?)<\/h2>/g;
  const found = [];
  let k = 0;
  const out = html.replace(rx, (all, idAttr, title) => {
    const id = idAttr ? idAttr.slice(5, -1) : `${prefix}-${k++}`;
    found.push({ id, title: title.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").trim() });
    return `<section class="panel" id="${id}"><div class="ph"><h2>${title}</h2>`;
  });
  if (found.length < 3) return out;
  // stocks listed in each section: count the cards between its start and the next section
  const pos = found.map(f => out.indexOf(`id="${f.id}"`));
  const nav = found.map((f, i) => {
    const seg = out.slice(pos[i], i + 1 < pos.length ? pos[i + 1] : undefined);
    const n = (seg.match(/<article class="pick"/g) || []).length;
    const lab = JUMP_SHORT[f.title] || (f.title.length > 18 ? f.title.slice(0, 16) + "…" : f.title);
    return `<button type="button" data-jump="${esc(f.id)}">${esc(lab)}${n ? ` <span class="jn">${n}</span>` : ""}</button>`;
  }).join("");
  return `<nav class="jump" aria-label="Sections on this page">${nav}</nav>` + out;
}

function verdictFor(rows) {
  const byG = Object.fromEntries(rows.map(r => [r.group, r]));
  const hi = byG.high || byG.yes, lo = byG.low || byG.no;
  if (!hi || !lo || hi.avg == null || lo.avg == null) return ["no", "Not enough data"];
  const diff = hi.avg - lo.avg;
  if (hi.n < 30) return ["no", "Too few trades"];
  if (diff > 0.01) return ["yes", "Helps"];
  if (diff < -0.01) return ["rev", "Works backwards"];
  return ["no", "No clear effect"];
}

function factorBlock(rows, title) {
  if (!rows || !rows.length) return `<div class="empty">No data yet.</div>`;
  const groups = {};
  rows.forEach(r => (groups[r.signal] = groups[r.signal] || []).push(r));
  const max = Math.max(0.02, ...rows.map(r => Math.abs(r.avg || 0)));
  const order = ["no", "yes", "low", "mid", "high"];
  return `<div class="fac">${Object.entries(groups).map(([sig, rs]) => {
    rs.sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));
    const [vk, vt] = verdictFor(rs);
    return `<div class="fgroup"><h3><span>${esc(sig)}</span><span class="verdict ${vk}">${vt}</span></h3>
      ${rs.map(r => { const w = Math.abs(r.avg || 0) / max * 50; const left = r.avg >= 0 ? 50 : 50 - w;
        return `<div class="frow"><span class="g">${esc(r.group)}</span><span class="bar"><i style="left:${left}%;width:${w}%;background:${r.avg >= 0 ? "var(--good)" : "var(--bad)"}"></i></span><span class="val ${cls(r.avg)}">${pct(r.avg)} · ${Math.round(r.hit)}% · ${r.n.toLocaleString()}</span></div>`; }).join("")}
    </div>`;
  }).join("")}</div>`;
}

function money(v, d = 0) { return v == null || isNaN(v) ? "–" : (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); }
const WHY = { "expired": "request was over 2 days old", "amount-over-limit": "amount is over your per-order limit", "not-enough-cash": "not enough buying power",
  "not-tradable": "Alpaca can't trade this stock", "not-found": "stock not found on Alpaca", "no-price": "no current price", "amount-too-small": "amount is less than one share",

function reqSection() {

  </tbody></table></div></section>`;
}
function addTradingDays(iso, n) {
  const d = new Date(iso + "T12:00:00");
  let left = n;
  while (left > 0) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) left--; }
  return d.toISOString().slice(0, 10);
}
function busDays(iso) {          // trading days (Mon-Fri) from a YYYY-MM-DD date to today
  const d = new Date(iso + "T12:00:00"), now = new Date(); let n = 0;
  for (d.setDate(d.getDate() + 1); d <= now; d.setDate(d.getDate() + 1)) if (d.getDay() % 6) n++;
  return n;
}
function suggestedHold(t) {
  const d = state.data, pol = d.adaptive?.policy || {}, L = d.portfolio?.limits || {};
  const row = [...(d.watchlist?.buys || []), ...(d.watchlist?.sells || [])].find(r => r.t === t);
  const small = !!(row && row.cap != null && row.cap < 2e9);
  return { days: small ? (pol.hold_small ?? L.hold_small ?? L.hold_days ?? 60) : (pol.hold_other ?? L.hold_days ?? 60), small };
}
function soldNote(x) {
  const m = state.data?.member_sold?.[x.t];

  return `<div><span class="chip avoid" title="A member whose purchase was behind this buy has disclosed a sale">Member sold</span></div>

}
function heldCell(x, L) {

  }
  const s = suggestedHold(x.t);
  if (x.ruled) {                 // your buy from Oct 30 on: the tool's sell rules, with an alert and Keep first
    const M = state.manual || state.data?.portfolio?.manual || {}, sym = x.t.replace(/-/g, "."), pd = (M.pending || {})[sym], kp = (M.keep || {})[sym];
    const start = x.rule_start || x.bought, held = start ? busDays(start) : (x.held ?? 0);
    const head = `${held} of ${s.days} days`;

    }
    if (kp && pd) return `${head}<div class="foot" style="white-space:normal;min-width:170px">You chose Keep: ${(pd.reasons || []).map(r => esc(r.t)).join("; ")}. A new reason sends a new alert.</div>`;

  if (!x.bought) return `${s.days}-day hold suggested${s.small ? " (small company)" : ""}`;
  const when = addTradingDays(x.bought, s.days), due = (x.held ?? 0) >= s.days;
  return `${x.held ?? 0} of ${s.days} days<div class="foot ${due ? "neg" : ""}">${due ? "Past the suggested hold" : "Suggested sell ~" + esc(fmtDate(when))} · bought before Oct 30, the tool doesn't sell it</div>`;
}

function sureWord(t) { return t == null ? "–" : t >= 3 ? "Very sure" : t >= 1.65 ? "Sure" : t >= 1 ? "Somewhat" : "Not sure"; }

async function sendTieReview(key, verdict) {
  const note = ($("#tienote")?.value ?? TIE.note[key] ?? "").trim();

  try {
    const js = await saveTieReview(key, verdict, note, verdict === "relative" ? ($("#tierel")?.value || "relative") : undefined);
    if (js.review) TIE.rev[key] = js.review; else delete TIE.rev[key];
    delete TIE.note[key];

// ---------- chart ----------
const SERIES_VAR = { "S&P 100 fund + picks": "--s4", "Never-seen-years picks": "--s1", "Regular backtest, same years": "--s4", "Paper account": "--s1", "Small-company picks": "--s1", "Small-company index (IWM)": "--s3", "Long picks": "--s1", "Short picks": "--s2", "Copy every purchase": "--s4", "Defense fund (ITA)": "--s3", "S&P 500 (SPY)": "--spy" };
function drawChart(b = state.data?.backtest, sel = "#chart") {
  const host = $(sel);
  if (!host || !b?.curve?.dates?.length) { if (host) host.innerHTML = `<div class="empty">No growth curve in this data.</div>`; return; }
  const css = getComputedStyle(document.documentElement);
  const dates = b.curve.dates;
  const names = Object.keys(b.curve.series).filter(n => n in SERIES_VAR || /Long \d+% \/ short/.test(n));
  const colorOf = n => css.getPropertyValue(SERIES_VAR[n] || "--s3").trim();
  const W = Math.max(320, host.clientWidth - 24), H = W < 520 ? 240 : 320, m = { l: 48, r: 12, t: 10, b: 26 };
  let lo = 0, hi = 0;
  names.forEach(n => b.curve.series[n].forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  const band = b.band && b.curve.series[b.band.around] ? (() => {
    const base = b.curve.series[b.band.around], t0 = Date.parse(dates[0]);
    const up = [], dn = [];
    base.forEach((v, i) => {
      if (v == null) { up.push(null); dn.push(null); return; }
      const yrs = Math.max(0, (Date.parse(dates[i]) - t0) / 31557600000), w = (b.band.z || 1) * b.band.te * Math.sqrt(yrs) * 100;
      up.push(v + w); dn.push(v - w); lo = Math.min(lo, v - w); hi = Math.max(hi, v + w);
    });
    return { up, dn };
  })() : null;
  const span = hi - lo || 1; const step = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => span / s <= 6) || 2000;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => m.l + (W - m.l - m.r) * (i / Math.max(1, dates.length - 1));
  const y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css.getPropertyValue(v === 0 ? "--rule" : "--grid")}" stroke-width="1"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${v}%</text>`;
  const years = []; dates.forEach((d, i) => { const yy = d.slice(0, 4); if (!years.length || years[years.length - 1][0] !== yy) years.push([yy, i]); });
  years.forEach(([yy, i], k) => { if (k === 0 && years.length > 1 && years[1][1] - i < dates.length / 12) return; g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${yy}</text>`; });
  let paths = "";
  if (band) {
    const idx = band.up.map((v, i) => v == null ? -1 : i).filter(i => i >= 0);
    if (idx.length > 1) paths += `<path d="${idx.map((i, k) => (k ? "L" : "M") + x(i).toFixed(1) + "," + y(band.up[i]).toFixed(1)).join("")}${idx.slice().reverse().map(i => "L" + x(i).toFixed(1) + "," + y(band.dn[i]).toFixed(1)).join("")}Z" fill="${css.getPropertyValue("--accent-soft")}" stroke="none"/>`;
  }
  names.forEach(n => {
    const s = b.curve.series[n]; let dstr = "", pen = false;
    s.forEach((v, i) => { if (v == null) { pen = false; return; } dstr += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
    const spy = /SPY/.test(n);
    paths += `<path d="${dstr}" fill="none" stroke="${colorOf(n)}" stroke-width="2" ${spy ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
    const lastI = s.length - 1 - [...s].reverse().findIndex(v => v != null);
    if (lastI >= 0 && lastI < s.length) paths += `<circle cx="${x(lastI)}" cy="${y(s[lastI])}" r="3.5" fill="${colorOf(n)}" stroke="${css.getPropertyValue("--surface")}" stroke-width="2"/>`;
  });
  host.innerHTML = `<div class="legend">${band ? `<span><i class="band"></i>Luck range</span>` : ""}${names.map(n => `<span><i class="${/SPY/.test(n) ? "dash" : ""}" style="background:${colorOf(n)}"></i>${esc(n.replace(" (SPY)", ""))} <b class="mono ${cls(b.curve.series[n].filter(v => v != null).slice(-1)[0])}">${pnum(b.curve.series[n].filter(v => v != null).slice(-1)[0], 0)}</b></span>`).join("")}</div>
  <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth of each portfolio compared with the S&P 500">${g}${paths}<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="${css.getPropertyValue("--muted")}" stroke-width="1" visibility="hidden"/><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  const hit = $("#hit", host), tip = $("#tip", host), xh = $("#xh", host);
  const move = ev => {
    const r = hit.getBoundingClientRect(); const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(dates.length - 1, Math.round(px / r.width * (dates.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="d">${esc(fmtDate(dates[i]))}</div>` + names.map(n => `<div class="r"><span style="color:${colorOf(n)}">●</span><span style="flex:1">${esc(n.replace(" (SPY)", ""))}</span><b>${pnum(b.curve.series[n][i], 1)}</b></div>`).join("") + (band && band.up[i] != null ? `<div class="r"><span style="flex:1;color:var(--muted)">Luck range</span><b>${pnum(band.dn[i], 1)} to ${pnum(band.up[i], 1)}</b></div>` : "");
    tip.hidden = false;
    const tx = x(i) + 16 + 190 > W ? x(i) - 200 : x(i) + 16; tip.style.left = tx + "px"; tip.style.top = "48px";
  };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("mouseleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
}

// ---------- alerts (push notifications; iPhone: only from the home-screen app) ----------
function keyBytes(s) { const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function alertsState() {
  const btn = $("#alerts");
  if (!btn || !("serviceWorker" in navigator)) return;
  const reg = await navigator.serviceWorker.register("/sw.js").catch(() => null);
  if (!reg || !("PushManager" in window) || !("Notification" in window)) {
    // an iPhone Safari tab can't get alerts; the home-screen app can
    if (/iPhone|iPad/.test(navigator.userAgent)) { btn.textContent = "Alerts"; btn.dataset.mode = "info"; btn.hidden = false; }
    return;
  }
  const sub = await reg.pushManager.getSubscription();
  btn.dataset.mode = "on"; btn.textContent = "Turn on alerts";
  btn.hidden = !!(sub && Notification.permission === "granted");
}
// true when alerts are on for this phone/browser (asks for permission; must run from a tap)
async function enableAlerts() {
  const btn = $("#alerts");
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { alert("Notifications are off for Capitol Capital. Turn them on in iPhone Settings → Notifications → Capitol Capital, then tap the button again."); return false; }
    const reg = await navigator.serviceWorker.ready;
    const { js } = await api("/api/push/key");
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(js.key) });
    await api("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sub: sub.toJSON() }) });
    if (btn) btn.hidden = true;
    return true;
  } catch (e) {
    if (e.code !== "login") alert("Couldn't turn on alerts: " + (e.message || e.code || e));
    return false;
  }
}
// can this phone/browser get alerts, and are they already on?
async function alertsStatus() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return "unsupported";
  const reg = await navigator.serviceWorker.getRegistration().catch(() => null);
  const sub = reg ? await reg.pushManager.getSubscription().catch(() => null) : null;
  return sub && Notification.permission === "granted" ? "on" : "off";
}
$("#alerts").addEventListener("click", async () => {
  const btn = $("#alerts");
  if (btn.dataset.mode === "info") { alert("Alerts work in the home-screen app. Open Capitol Capital from its icon, then tap “Turn on alerts”."); return; }
  btn.disabled = true;
  try { await enableAlerts(); } finally { btn.disabled = false; }
});

// ---------- phone: wide tables as cards ----------
// Each cell gets its column name (shown as a label on phones); tables with 4+ columns and up to 25 rows become a
// stack of cards on narrow screens (CSS in the app build). The ticker/stock column, if any, is the card's title.
const TITLE_COL = /^(ticker|stock|company|member|portfolio|setting|signal|year|when)$/i;
function cardify(root) {
  for (const tbl of root.querySelectorAll(".tbl")) {
    if (tbl.classList.contains("tlist") || tbl.dataset.cd) continue;
    const t = tbl.querySelector("table"); if (!t) continue;
    const heads = [...t.querySelectorAll("thead th")].map(th => th.textContent.trim());
    const rows = t.querySelectorAll("tbody tr");
    tbl.dataset.cd = "1";
    if (heads.length < 4 || rows.length > 25) continue;
    let ti = heads.findIndex(h => TITLE_COL.test(h)); if (ti < 0) ti = 0;
    for (const tr of rows) {
      let i = 0;
      for (const td of tr.children) {
        td.dataset.l = td.colSpan > 1 ? "" : (heads[i] || "");
        if (i === ti && td.colSpan === 1) td.classList.add("ttl");
        else if (td.textContent.trim().length > 26 || td.querySelector(".who-cell,.bar,svg")) td.classList.add("full");
        i += td.colSpan || 1;
      }
    }
    tbl.classList.add("cards");
  }
}
let cardQueued = false;
new MutationObserver(() => { if (cardQueued) return; cardQueued = true; requestAnimationFrame(() => { cardQueued = false; cardify(document.body); }); })
  .observe(document.body, { childList: true, subtree: true });

// ---------- pull to refresh (home-screen app has no browser reload) ----------
(() => {
  const ind = document.createElement("div"); ind.id = "ptr"; ind.setAttribute("aria-hidden", "true"); document.body.appendChild(ind);
  const PULL = 80;
  let y0 = null, dy = 0, busy = false;
  const show = (d, text, go) => { ind.textContent = text; ind.classList.toggle("go", !!go);
    ind.style.transform = `translate(-50%, ${Math.min(d, PULL + 20) - 60}px)`; ind.style.opacity = String(Math.min(1, d / 40)); };
  const hide = () => { ind.style.transition = "transform .2s, opacity .2s"; ind.style.transform = "translate(-50%,-60px)"; ind.style.opacity = "0";
    setTimeout(() => { ind.style.transition = ""; }, 220); };
  addEventListener("touchstart", e => {
    const modal = document.querySelector(".mbg:not([hidden])");
    y0 = (!busy && scrollY <= 0 && e.touches.length === 1 && $("#login").hidden && !modal) ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    dy = (e.touches[0].clientY - y0) * 0.6;
    if (dy <= 0 || scrollY > 0) { if (dy < 0) y0 = null; return; }
    show(dy, dy >= PULL ? "Release to refresh" : "Pull to refresh", dy >= PULL);
  }, { passive: true });
  addEventListener("touchend", async () => {
    if (y0 == null) return; y0 = null;
    if (dy < PULL) { hide(); return; }
    busy = true; show(PULL, "Refreshing…", true);
    try { lastEtag = null; setStatus("", "Checking for new results…", false); await loadData(); }
    finally { busy = false; show(PULL, "Up to date", true); setTimeout(hide, 600); }
  }, { passive: true });
})();

// ---------- table headers stay in view while scrolling (owner, Nov 3 2026) ----------
// Wide tables scroll sideways inside their box, so a plain CSS sticky header can't follow the page. Instead, when a
// table's header has scrolled up under the app's top bar while its rows are still on screen, a copy of that header
// is pinned just below the top bar, with the same column widths and sideways position. Phone card layouts (no
// header row) are left alone. Tables that scroll inside their own box also get a CSS sticky header (in the styles).
(() => {
  const main = document.getElementById("main");
  if (!main) return;
  const bar = document.createElement("div");
  bar.className = "stickyhead"; bar.hidden = true; bar.setAttribute("aria-hidden", "true");
  document.body.appendChild(bar);
  let cur = null, raf = 0;
  const topEdge = () => {
    const h = document.querySelector("header.top");
    let t = h ? Math.max(0, h.getBoundingClientRect().bottom) : 0;
    const mw = main.querySelector(".mwin");                   // Members: its time-window bar is pinned too
    if (mw && mw.offsetParent) { const r = mw.getBoundingClientRect(); if (r.top <= t + 2) t = Math.max(t, r.bottom); }
    return t;
  };
  function update() {
    raf = 0;
    const top = topEdge();
    let pick = null, wrap = null;
    for (const t of main.querySelectorAll("table")) {
      const th = t.tHead;
      if (!th || !th.rows[0] || getComputedStyle(th).display === "none" || !t.offsetParent) continue;
      const w = t.closest(".tbl") || t.parentElement, wr = w.getBoundingClientRect(), tr = t.getBoundingClientRect();
      const shown = Math.min(tr.bottom, wr.bottom), hh = th.getBoundingClientRect().height;
      if (Math.max(tr.top, wr.top) < top && shown > top + hh + 12) { pick = t; wrap = w; break; }
    }
    if (!pick) { bar.hidden = true; cur = null; return; }
    if (cur !== pick) {
      cur = pick; bar.innerHTML = "";
      const tb = document.createElement("table");
      tb.appendChild(pick.tHead.cloneNode(true));
      bar.appendChild(tb);
    }
    const tb = bar.firstChild, src = pick.tHead.rows[0].cells, dst = tb.tHead.rows[0].cells;
    for (let i = 0; i < src.length && i < dst.length; i++) {
      const w = src[i].getBoundingClientRect().width + "px";
      Object.assign(dst[i].style, { width: w, minWidth: w, maxWidth: w, boxSizing: "border-box" });
    }
    const wr = wrap.getBoundingClientRect(), pr = pick.getBoundingClientRect();
    tb.style.width = pr.width + "px";
    tb.style.transform = `translateX(${pr.left - wr.left}px)`;
    Object.assign(bar.style, { top: top + "px", left: wr.left + "px", width: wr.width + "px" });
    bar.hidden = false;
  }
  const queue = () => { if (!raf) raf = requestAnimationFrame(update); };
  addEventListener("scroll", queue, { passive: true });
  addEventListener("resize", queue);
  document.addEventListener("scroll", queue, { capture: true, passive: true });    // sideways scrolling inside a table
  new MutationObserver(() => { cur = null; queue(); }).observe(main, { childList: true, subtree: true });
})();

// the top bar's height changes when its status line wraps (phones): keep --hdr current so pinned bars (Members'
// time window) sit right under it (owner, Nov 4 2026: they were cut off when scrolling)
try { const hb = document.querySelector("header.top"); if (hb && "ResizeObserver" in window) new ResizeObserver(() => setHeaderHeight()).observe(hb); } catch (e) {}
})();

<script>
(function () {
  function off(el) {
    if (el.dataset.nocorrect) return;
    el.dataset.nocorrect = "1";
    el.setAttribute("autocorrect", "off");
    el.setAttribute("autocapitalize", "off");
    el.setAttribute("spellcheck", "false");
    el.spellcheck = false;
    if (!el.hasAttribute("autocomplete")) el.setAttribute("autocomplete", "off");
  }
  function scan(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches("input,textarea,[contenteditable]")) off(root);
    root.querySelectorAll("input,textarea,[contenteditable]").forEach(off);
  }
  function start() {
    scan(document.body);
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(scan))).observe(document.body, { childList: true, subtree: true });
  }
  if (document.body) start(); else document.addEventListener("DOMContentLoaded", start);
})();
</script>
