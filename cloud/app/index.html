<title>Capitol Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F5F8; --surface:#FFFFFF; --sunken:#EEF1F5; --ink:#152033; --ink2:#46536A; --muted:#6B778A; --rule:#DCE1E8;
  --accent:#1D4F91; --accent-soft:#E3ECF8;
  --good:#0B7A4B; --good-soft:#E2F3EA; --bad:#B42318; --bad-soft:#FBE7E5; --warn:#95590A; --warn-soft:#FBF0DC;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#c98500; --spy:#8A93A3; --grid:#E6E9EE;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --head:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E131A; --surface:#151C26; --sunken:#1B2330; --ink:#E6EBF2; --ink2:#B4BECC; --muted:#8B97A8; --rule:#27303D;
    --accent:#7FAEEA; --accent-soft:#1C2B40;
    --good:#4CC38A; --good-soft:#12291E; --bad:#F2877B; --bad-soft:#331816; --warn:#E3A857; --warn-soft:#2E2210;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --spy:#7C8696; --grid:#222B37;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E131A; --surface:#151C26; --sunken:#1B2330; --ink:#E6EBF2; --ink2:#B4BECC; --muted:#8B97A8; --rule:#27303D;
  --accent:#7FAEEA; --accent-soft:#1C2B40;
  --good:#4CC38A; --good-soft:#12291E; --bad:#F2877B; --bad-soft:#331816; --warn:#E3A857; --warn-soft:#2E2210;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --spy:#7C8696; --grid:#222B37;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--head);text-wrap:balance;margin:0}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:16px 0;border-bottom:1px solid var(--rule)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.brand h1{font-size:24px;font-weight:600;letter-spacing:.2px}
.brand .seal{font:500 11px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.stale{background:var(--warn)} .dot.err{background:var(--bad)}
button.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:2px 4px;border-radius:4px}
button.link:hover{text-decoration:underline}
nav.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav.tabs button{font:600 14px var(--head);letter-spacing:.3px;color:var(--ink2);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 10px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-top:20px;display:grid;gap:24px}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--ink2)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note.err{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
section.panel{display:grid;gap:12px;align-content:start}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}
.ph h2{font-size:19px;font-weight:600}
.ph .sub{font-size:13px;color:var(--muted)}
.morelist{display:grid}
.tag.plain{cursor:default;border:0;background:none;padding:4px 2px;color:var(--ink2);font-weight:500}
.hlist{display:grid;gap:10px}
.hrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14px;border-top:1px solid var(--rule);padding-top:10px}
.hrow:first-child{border-top:0;padding-top:0}
.hrow .chip{white-space:nowrap}
.moreitem{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l c" "d c";align-items:center;gap:2px 12px;text-align:left;
  background:none;border:0;border-top:1px solid var(--rule);padding:14px 4px;cursor:pointer;color:var(--ink);font:inherit}
.moreitem:first-child{border-top:0}
.moreitem .ml{grid-area:l;font:600 16px var(--head)}
.moreitem .md{grid-area:d;font-size:13px;color:var(--muted)}
.moreitem .mc{grid-area:c;font-size:22px;color:var(--muted)}
.moreback{background:none;border:0;color:var(--accent);font:600 14px var(--body);padding:0;cursor:pointer;justify-self:start}
.newline{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.newline b{font:600 13px var(--mono)}
.daypick{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.daypick button{flex:0 0 auto}
.daypick button{font:600 12.5px var(--body);padding:6px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink2);cursor:pointer}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .daypick button[aria-pressed="true"]{color:#0E131A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .daypick button[aria-pressed="true"]{color:#0E131A}}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.dayc{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.dayc h3{margin:0;font:600 14px var(--head)}
.dayc .r{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.dayc .r span:first-child{color:var(--muted)}
.dayc .r span:last-child{font-family:var(--mono)}
.dayc .ords{border-top:1px solid var(--rule);padding-top:6px;font-size:12.5px;display:grid;gap:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:2px}
.tile .v{font:500 26px var(--mono);letter-spacing:-.5px}
.tile .l{font-size:12.5px;color:var(--muted)}
.tile .c{font-size:12.5px;color:var(--ink2)}
.pos{color:var(--good)} .neg{color:var(--bad)}
/* pick rows */
.picks{display:grid;gap:8px}
.pick{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:92px 1fr auto;gap:4px 16px;align-items:start}
.pick .tk{display:grid;gap:4px}
.pick .tk b{font:600 19px var(--mono);letter-spacing:.3px}
.chip{display:inline-block;font:600 11px var(--body);letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border-radius:999px;justify-self:start}
.chip.BUY{background:var(--good-soft);color:var(--good)}
.chip.SHORT{background:var(--bad-soft);color:var(--bad)}
.chip.avoid,.chip.mixed{background:var(--warn-soft);color:var(--warn)}
.chip.watch{background:var(--sunken);color:var(--ink2)}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.posts-feed{display:grid;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:600 12px var(--body);padding:4px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--sunken);color:var(--ink2);cursor:pointer;
  text-decoration:none;min-height:28px;display:inline-flex;align-items:center;white-space:nowrap}
.tag.neg{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.post{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.ctx{background:none}
.tag.more{background:none;border-style:dashed}
.tag.go{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.tag.who{background:none;border:0;padding:0;font-size:14px;color:var(--ink);text-decoration:underline dotted;min-height:0}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tipbg{position:fixed;inset:0;z-index:70;background:rgba(10,15,25,.4);display:flex;align-items:flex-end;justify-content:center}
.tipsheet{background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:70vh;overflow:auto;border-radius:14px 14px 0 0;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
@media (min-width:761px){.tipbg{align-items:center}.tipsheet{border-radius:12px}}
.tiph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.tipb p{margin:6px 0}
ul.tipl{margin:4px 0;padding-left:18px;display:grid;gap:4px}
ul.wposts{margin:6px 0 0;padding-left:18px;display:grid;gap:4px}
nav.jump{position:sticky;top:var(--hdr,96px);z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:8px;
  background:var(--ground);border-bottom:1px solid var(--rule);scrollbar-width:none}
nav.jump::-webkit-scrollbar{display:none}
nav.jump button{flex:0 0 auto;font:600 13px var(--body);color:var(--ink2);background:var(--surface);border:1px solid var(--rule);
  border-radius:999px;padding:7px 12px;min-height:36px;cursor:pointer;white-space:nowrap}
nav.jump button:active{background:var(--accent-soft);color:var(--accent)}
nav.jump .jn{font:600 11px var(--mono);color:var(--accent);margin-left:2px}
#today-buy,#today-worth,#posts,#today-avoid,#today-unusual,#today-also{scroll-margin-top:calc(var(--hdr,96px) + 60px)}
.post{border-top:1px solid var(--rule);padding-top:8px;overflow-wrap:anywhere}
.mlink{color:inherit;font:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);cursor:pointer}
.mlink:hover{text-decoration-color:currentColor}
/* alerts tab + jump-to highlight */
header.top .brand{padding-right:96px}
.mebtn{position:absolute;right:50px;top:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);padding:0;cursor:pointer;overflow:hidden;z-index:2}
.mebtn img{width:100%;height:100%;object-fit:cover;display:block}
.mebtn[aria-pressed="true"]{border-color:var(--accent)}
.mef{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;padding:0;border:2.5px solid;overflow:hidden;cursor:pointer;background:var(--sunken);z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mef img{width:100%;height:100%;object-fit:cover;display:block}
.mef.buy{border-color:var(--good)} .mef.sell{border-color:var(--bad)}
.mef.on{transform:translate(-50%,-50%) scale(1.25)}
.mehead{display:flex;align-items:center;gap:14px}
.mehead img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--rule)}
.mehead h2{margin:0;font:600 22px var(--head)}
.metr{border-top:1px solid var(--rule);padding:10px 0;display:grid;gap:4px}
.metr:first-child{border-top:0}
.metr .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px}
.bell{position:absolute;right:0;top:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--ink2);display:grid;place-items:center;cursor:pointer;padding:0;z-index:2}
.bell[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.bell .nb{position:absolute;top:-4px;right:-4px;margin:0}
.nb{display:inline-block;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:#fff;font:700 11px/18px var(--body);text-align:center;vertical-align:1px}
.alist{display:grid;gap:8px}
.alw{position:relative;border-radius:10px;overflow:hidden;touch-action:pan-y}
.alw .alx{position:absolute;inset:0;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font:600 14px var(--body);border-radius:10px}
.alw .al{position:relative;transition:transform .2s ease}
.alw.drag .al{transition:none}
.alw.gone{transition:max-height .25s ease .15s,opacity .25s ease;max-height:0!important;opacity:0}
.csbox{display:flex;gap:8px;margin:4px 0 12px}
.csbox input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink)}
.cslist{display:grid;gap:0}
.csrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-top:1px solid var(--rule);background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.csrow:first-child{border-top:0}
.csrow .ct{font:600 15px var(--mono);min-width:56px}
.csrow .cc{color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csrow .cn{font-size:12px;color:var(--muted);white-space:nowrap}
.al{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.al.unread{border-left:4px solid var(--accent)}
.al .at{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.al .tt{font-weight:600}
.al .bd{font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.al.open .bd{-webkit-line-clamp:unset;display:block}
.al ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.al li a,.al li button{font:inherit;font-size:13.5px;color:var(--accent);background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.hl{animation:hl 2.6s ease-out 1;border-radius:10px}
@keyframes hl{0%,35%{box-shadow:0 0 0 3px var(--accent);background:var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.post .why{margin:2px 0}
.post.lvl3 .why b{color:var(--bad)}
.tie-box{padding:10px 4px;white-space:normal;position:sticky;left:8px;width:min(640px,calc(100vw - 64px))}
.tie-box textarea{width:100%;font:16px var(--body);padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.tie-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{font:600 13px var(--body);padding:8px 14px;min-height:40px;border-radius:6px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);cursor:pointer}
.btn.sm{padding:3px 10px;min-height:30px;font-size:12px}
.btn.ghost{background:none;border-color:var(--rule);color:var(--ink2)}
.btn:disabled{opacity:.55;cursor:default}
.pick .co{font-weight:600}
.pick .who{font-size:13px;color:var(--ink2)}
.ppl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:8px}
.ppl .lbl{font-size:12px;color:var(--muted);letter-spacing:.3px}
.person{display:inline-flex;align-items:center;gap:8px;min-width:0}
.person .pn{display:block;font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.25}
.person .pr{display:block;font-size:11.5px;color:var(--muted);line-height:1.25}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;object-position:50% 20%;flex:none;background:var(--sunken);border:1px solid var(--rule);display:inline-grid;place-items:center;font:600 12px var(--body);color:var(--ink2)}
.av.sm{width:24px;height:24px;font-size:9.5px}
.ptag{display:inline-block;font:600 10.5px var(--mono);letter-spacing:.3px;padding:0 5px;border-radius:4px;margin-left:5px;vertical-align:1px;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.ptag.R{background:#FBE7E5;color:#B42318}.ptag.D{background:#E3ECF8;color:#1D4F91}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ptag.R{background:#331816;color:#F2877B}:root:not([data-theme="light"]) .ptag.D{background:#1C2B40;color:#7FAEEA}}
:root[data-theme="dark"] .ptag.R{background:#331816;color:#F2877B}:root[data-theme="dark"] .ptag.D{background:#1C2B40;color:#7FAEEA}
.legend i.band{height:10px;background:var(--accent-soft)!important;border:1px solid var(--rule)}
.who-cell{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.who-cell span.nm{display:inline-flex;align-items:center;gap:6px}
.pick .why{font-size:13.5px;color:var(--ink2);margin-top:4px}
.pick .ctx{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.pick .side{text-align:right;display:grid;gap:4px;justify-items:end}
.meter{width:120px;height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.pick .side .sc{font:500 13px var(--mono);color:var(--ink2)}
.pick .side .mv{font:500 13px var(--mono)}
.buybtn{font:600 13px var(--body);padding:6px 14px;border-radius:6px;border:1px solid var(--good);background:var(--good-soft);color:var(--good);cursor:pointer}
.buybtn:disabled{opacity:.55;cursor:default}
.subh{font-size:15px;font-weight:600;margin:4px 0 -4px}
.confirm{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--sunken);border-radius:8px;padding:10px 12px;margin-top:6px;font-size:13.5px}
.confirm input{font:500 14px var(--mono);width:110px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
.confirm .real{color:var(--bad);font-weight:600}
.tapmsg{grid-column:1/-1;font-size:13px;margin-top:4px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:6px 12px;font:500 13px var(--body);color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
input[type=search]{font:14px var(--body);padding:6px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink);min-width:0;width:220px;max-width:100%}
/* tables */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:600 11.5px var(--body);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);background:var(--sunken);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
td.why{min-width:240px;color:var(--ink2)}
td.nw{white-space:nowrap}
.scroll{max-height:560px;overflow:auto}
.alp{font-size:13px;font-weight:600;color:inherit;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;align-self:center}
/* chart */
.chart{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 12px 8px;position:relative}
.chart svg{display:block;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:0 4px 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--spy) 0 4px,transparent 4px 7px)!important}
svg text{fill:var(--muted);font:11px var(--mono)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:170px}
.tip .d{font:500 12px var(--mono);color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.tip .r b{font:500 12.5px var(--mono)}
/* factor bars */
.fac{display:grid;gap:14px}
.fgroup{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.fgroup h3{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.verdict{font:600 11px var(--body);letter-spacing:.6px;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.verdict.yes{background:var(--good-soft);color:var(--good)} .verdict.no{background:var(--sunken);color:var(--muted)} .verdict.rev{background:var(--bad-soft);color:var(--bad)}
.frow{display:grid;grid-template-columns:64px 1fr 150px;gap:10px;align-items:center;font-size:13px;padding-block:3px}
.frow .g{color:var(--ink2)}
.frow .bar{position:relative;height:14px;background:linear-gradient(var(--rule),var(--rule)) center/1px 100% no-repeat}
.frow .bar i{position:absolute;top:2px;height:10px;border-radius:2px}
.frow .val{font:500 12.5px var(--mono);text-align:right;white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--rule);border-radius:8px}
.foot{font-size:12.5px;color:var(--muted)}

/* ticker popup */
.tkl{font:inherit;font-weight:600;color:inherit;background:none;border:0;padding:0;margin:0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer;letter-spacing:inherit}
.tkl:hover{text-decoration-thickness:2px}
.mbg{position:fixed;inset:0;z-index:50;background:rgba(10,15,25,.45);display:grid;grid-template-columns:minmax(0,900px);justify-content:center;align-items:start;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow:auto}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:10px;width:100%;min-width:0;padding:14px 16px 16px;box-shadow:0 12px 40px rgba(0,0,0,.25);display:grid;gap:10px}
.modal>*{min-width:0}
#tlist,#tdet{min-width:0;overflow:hidden}
.mh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mh .t{font:600 22px var(--mono);letter-spacing:.3px}
.mh .co{font-size:13.5px;color:var(--ink2)}
.mh .px{font:500 15px var(--mono);text-align:right}
.mx{background:none;border:0;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:6px}
.mx:hover{color:var(--ink);background:var(--sunken)}
.spans{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.spans button{font:500 12px var(--mono);padding:2px 7px;border:0;border-radius:4px;background:none;color:var(--ink2);cursor:pointer}
.spans button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.spans .lg{margin-left:auto;display:flex;gap:12px;font-size:12px;color:var(--muted)}
.spans .lg i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid;vertical-align:-1px;margin-right:4px}
.tc{position:relative;user-select:none;-webkit-user-select:none}
.tc svg{display:block;overflow:visible}
.mk{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid;background:var(--sunken);padding:0;cursor:pointer;display:grid;place-items:center;font:600 9px var(--body);color:var(--ink2);overflow:hidden;z-index:2}
.mk img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.mk.on{z-index:4;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
.mk.dot{width:10px;height:10px;border-width:0}
.dz{position:absolute;transform:translateX(-50%);font:600 9.5px var(--mono);letter-spacing:.2px;padding:0 2px;background:var(--surface);cursor:pointer;z-index:2;white-space:nowrap}
.dz.on{z-index:4;outline:1.5px solid var(--accent);border-radius:3px}
.tcip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:5px 8px;font:500 12px var(--mono);box-shadow:0 4px 14px rgba(0,0,0,.12);white-space:nowrap;z-index:5}
.tdet{background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.tdet .av{width:40px;height:40px}
.tlist{max-height:240px}
.tlist td{padding:6px 8px;font-size:13px}
.tlist tr{cursor:pointer}
.tlist tr.on td{background:var(--accent-soft)}
.bs{font:600 11px var(--body);letter-spacing:.5px;text-transform:uppercase}
.bs.buy{color:var(--good)} .bs.sell{color:var(--bad)}
@media (max-width:620px){
  .pick{grid-template-columns:1fr;}
  .pick .tk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
  .pick .side{text-align:left;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-width:0}
  .frow{grid-template-columns:44px minmax(36px,1fr) auto;gap:8px}
  .frow .val{font-size:11.5px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .pick{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:no-preference){ .pick,.tile{transition:border-color .15s} .pick:hover{border-color:var(--accent)} }
/* members */
.mlist{display:grid;gap:6px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;font:inherit;color:inherit;cursor:pointer;width:100%}
.mrow:hover{border-color:var(--accent)}
.mrow .mn{display:grid;min-width:0}
.mrow .nm{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms{font-size:12.5px;color:var(--muted)}
.mrow .mv,.mt-r{font:500 14px var(--mono);text-align:right;display:grid;white-space:nowrap}
.mrow .mv .foot,.mt-r .foot{font:11px var(--body);color:var(--muted)}
.mback{justify-self:start;padding-left:0}
.mhead{display:flex;gap:12px;align-items:center}
.mhead h2{font-size:22px}
.av.lg{width:64px;height:64px;font-size:20px}
.tiles.mt{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.mwin{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:3}
.mwin .foot{grid-column:1/-1}
.mwin label{display:grid;gap:2px;font-size:13px;color:var(--ink2)}
.mwin input[type=range]{width:100%;accent-color:var(--accent)}
.mtrs{display:grid;gap:6px}
.mtr{background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.mtr.on{border-color:var(--accent)}
.mtr-h{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 12px;font:inherit;color:inherit;cursor:pointer}
.mt-t{display:grid;gap:1px}
.mt-t b{font:600 15px var(--mono)}
.mt-c{display:grid;min-width:0}
.mt-c .co{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtr-b{border-top:1px solid var(--rule);padding:10px 12px 12px;display:grid;gap:10px;background:var(--sunken)}
.mstats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink2)}
.mstats b{font-family:var(--mono);font-weight:500}
ol.tl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ol.tl li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.4;border-left:3px solid var(--rule);padding-left:8px}
ol.tl .tl-o{font:500 12px var(--mono);color:var(--muted);text-align:right;padding-top:1px}
ol.tl .kl{font:600 10.5px var(--body);letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-right:4px}
ol.tl li.k-cb{border-left-color:var(--bad)} ol.tl li.k-gov{border-left-color:var(--accent)} ol.tl li.k-co{border-left-color:var(--warn)}
ol.tl li.k-mem{border-left-color:var(--spy)} ol.tl li.k-post{border-left-color:var(--good)}
ol.tl li.tl-mark{border-left-color:var(--ink);font-weight:600}
ol.tl li.tl-mark.disc{border-left-color:var(--muted);font-weight:500;color:var(--ink2)}
ol.tl a,ol.posts a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
ol.posts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.posts li{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;display:grid;gap:2px;font-size:13.5px}
@media (max-width:620px){
  .mwin{grid-template-columns:1fr 1fr;gap:2px 14px;padding:6px 12px 4px;top:calc(env(safe-area-inset-top,0px) + 62px)}
  .mwin>.foot{display:none}
  .mwin label{font-size:12px}
  .tiles.mt .tile{padding:10px 12px}
  .tiles.mt .tile .v{font-size:21px}
  .mtr-h{grid-template-columns:56px minmax(0,1fr) auto;gap:8px;padding:8px 10px}
  ol.tl li{grid-template-columns:40px minmax(0,1fr);font-size:13px}
  .tiles.mt{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .tiles.mt .tile .c{font-size:11.5px}
  .mhead .av.lg{width:52px;height:52px}
}

.login{position:fixed;inset:0;z-index:100;background:var(--ground);display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
.login img{width:84px;height:84px;border-radius:20px;justify-self:center;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.login h1{font:600 26px var(--head)}
.login p{margin:0;color:var(--ink2);font-size:14px}
.login input{font:500 18px var(--mono);padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);text-align:center;width:100%}
.login button{font:600 16px var(--body);padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
:root[data-theme="dark"] .login button{color:#0E131A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .login button{color:#0E131A}}
.login button:disabled{opacity:.6}
.login .msg{min-height:20px;font-size:13.5px;color:var(--bad)}
@media (display-mode: standalone){ .bell,.mebtn{top:calc(max(16px,env(safe-area-inset-top,0px)) - 4px)} }
@media (display-mode: standalone){ header.top{padding-top:max(16px,env(safe-area-inset-top,0px))} }

@media (max-width: 760px){
  header.top{padding-block:10px 0}
  .bell{top:6px;width:36px;height:36px}
  .mebtn{top:6px;width:36px;height:36px;right:44px}
  .brand{align-items:center;gap:2px 12px;padding-bottom:8px}
  .brand .seal{display:none}
  .brand h1{font-size:19px;line-height:1.2}
  .status{font-size:12px;gap:6px;line-height:1.35}
  main{padding-top:14px;gap:18px}
  .tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
  .tile{padding:10px 12px}
  .tile .v{font-size:22px}
  .tile .l,.tile .c{font-size:12px;line-height:1.35}
  .tbl.cards{background:none;border:0;border-radius:0;overflow:visible;max-height:none}
  .tbl.cards table,.tbl.cards tbody{display:block}
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-bottom:8px}

  .tbl.cards span.nm{flex-wrap:wrap;row-gap:2px}
}

<script>
(() => {
"use strict";
const SERVER = "Google Drive";
const FILE_TITLE = "dashboard_data.json";
const state = { data: null, tab: "today", fileId: null, modified: null, error: null, tradeSide: "longs", tradeFilter: "all", q: "",
  folderId: null, requests: [], confirm: null, amounts: {}, tapMsg: {}, sending: false };
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v, d = 1, signed = true) => v == null || isNaN(v) ? "–" : (signed && v > 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const pnum = (v, d = 1) => v == null || isNaN(v) ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d) + "%";
const cls = v => v == null || isNaN(v) ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "";
const fmtDate = s => { if (!s) return "–"; const d = new Date(s + (s.length === 10 ? "T12:00:00" : "")); return isNaN(d) ? s : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };
const ET = "America/New_York";
function toDate(iso) { if (!iso) return null; const s = String(iso); const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) || s.length <= 10 ? s : s + "Z"); return isNaN(d) ? null : d; }
function fmtET(iso) {
  const d = toDate(iso); if (!d) return "–";
  return d.toLocaleString("en-US", { timeZone: ET, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET";
}
function dateET(iso) {
  const d = toDate(iso); if (!d) return "–";
  return d.toLocaleDateString("en-US", { timeZone: ET, month: "short", day: "numeric", year: "numeric" });
}
function ago(iso) {
  const t = Date.parse(iso); if (isNaN(t)) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 2) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 36) return h + " hr ago";
  return Math.round(h / 24) + " days ago";
}
try { const t = localStorage.getItem("ctd-tab"); if (t) state.tab = t; } catch (e) {}
if (/^#(today|record|defense|small|works|real|port|members|alerts)$/.test(location.hash)) state.tab = location.hash.slice(1);

// ---------- status ----------
function setStatus(kind, text, showRefresh) {
  $("#dot").className = "dot " + (kind || "");
  $("#statusText").textContent = text;
  $("#refresh").hidden = !showRefresh;
}

// ---------- tabs ----------
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  state.tab = b.dataset.tab;
  if (typeof MEM !== "undefined") MEM.missing = null;
  try { localStorage.setItem("ctd-tab", state.tab); } catch (e) {}
  render();
  window.scrollTo(0, 0);
}));

// pages behind the ☰ More button, in menu order
const MORE_TABS = [
  { k: "search", l: "Company search", d: "Any ticker or company: its chart with every member's trades" },
  { k: "small", l: "Small caps", d: "The small-company portfolio and its picks" },
  { k: "defense", l: "Defense", d: "Defense stocks members bought or sold" },
  { k: "record", l: "Track record", d: "How past picks did against the S&P 500" },
  { k: "works", l: "What works", d: "Which signals hold up, and the weekly automatic adjustments" },
  { k: "real", l: "Reality check", d: "Walk-forward test: the strategy on years it never saw" },
  { k: "health", l: "Data health", d: "Every data source: what's broken right now and what was fixed" },
];
function goTab(t) {
  state.tab = t;
  if (t === "health") { HEALTH.js = null; HEALTH.err = null; }
  if (typeof MEM !== "undefined") MEM.missing = null;
  try { localStorage.setItem("ctd-tab", t); } catch (e) {}
  render(); window.scrollTo(0, 0);
}
// ---------- Data health: every source's open problems (from each job and the app's server), and recent fixes ----------
const HEALTH = { js: null, err: null, loading: false };
const JOB_LABEL = { daily: "Daily update", live: "Hourly posts", social: "Posts (daily)", close: "Market-close report", quick: "Filings and orders check",
  institutions: "Institutions", watchdog: "Job watchdog", scan_house: "House scanned reports", scan_senate: "Senate scanned reports", backfill_enrich: "Backfill" };
function dataWarning(w) {
  return `<div class="note err"><b>Picks may be off: some of the data they're built from is broken, so new auto-buys are paused.</b>
    <ul style="margin:6px 0 0 18px">${w.problems.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <button type="button" class="link" data-more="health">See Data health</button></div>`;
}
function renderHealth() {
  if (!HEALTH.js && !HEALTH.loading && !HEALTH.err) {
    HEALTH.loading = true;
    loadHealth().then(js => { HEALTH.js = js || {}; HEALTH.err = null; }).catch(e => { HEALTH.err = e; })
      .finally(() => { HEALTH.loading = false; if (state.tab === "health") render(); });
  }
  if (HEALTH.err) return `<div class="note err">Couldn't load Data health${HEALTH.err.code === "app_only" ? " (it's in the phone app)" : ""}. <button type="button" class="link" data-more="health" onclick="HEALTH.err=null">Try again</button></div>`;
  if (!HEALTH.js) return `<div class="empty">Loading…</div>`;
  const jobs = Object.entries(HEALTH.js.jobs?.jobs || {}), app = Object.entries(HEALTH.js.app || {});
  const open = [];
  for (const [j, v] of jobs) for (const x of (v.open || [])) open.push({ where: JOB_LABEL[j] || j, ...x });
  for (const [k, v] of app) if (v.open) open.push({ where: "App server", kind: "app", text: v.text, first: v.first, last: v.last, runs: v.n });
  const rank = { critical: 0, crash: 1, watchdog: 2, site: 3, app: 3, problem: 4, failure: 5 };
  open.sort((a, b) => (rank[a.kind] ?? 9) - (rank[b.kind] ?? 9) || String(b.last).localeCompare(String(a.last)));
  const fixed = [...(HEALTH.js.jobs?.fixed || []).map(x => ({ where: JOB_LABEL[x.job] || x.job, text: x.text, at: x.at })),
    ...app.filter(([, v]) => !v.open && v.fixed).map(([, v]) => ({ where: "App server", text: v.text, at: v.fixed }))]
    .sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 30);
  const kindTag = k => ({ critical: "Picks paused", crash: "Job crashed", watchdog: "Job silent", site: "Website", app: "App", problem: "Data", failure: "Error" })[k] || "Problem";
  const runs = jobs.filter(([j]) => j !== "watchdog").map(([j, v]) => `${esc(JOB_LABEL[j] || j)} ${esc(ago(v.at))}`).join(" · ");
  return `<section class="panel"><div class="ph"><h2>${open.length ? `${open.length} open problem${open.length === 1 ? "" : "s"}` : "Everything is working"}</h2>
    <span class="sub">You get an alert when a new one appears. Claude checks this every morning and fixes what it can.</span></div>
  ${open.length ? `<div class="hlist">${open.map(x => `<div class="hrow"><span class="chip ${["critical", "crash"].includes(x.kind) ? "SHORT" : x.kind === "failure" ? "watch" : "avoid"}">${kindTag(x.kind)}</span>
      <div><div>${esc(x.text)}</div><div class="foot">${esc(x.where)} · since ${esc(fmtET(x.first))}${x.runs > 1 ? ` · ${x.runs} runs in a row` : ""}</div></div></div>`).join("")}</div>`
    : `<div class="empty">No source failed or came back empty in the latest runs.</div>`}
  <p class="foot">Last reports: ${runs || "–"}</p></section>
  ${fixed.length ? `<section class="panel"><div class="ph"><h2>Fixed in the last 2 weeks</h2></div><div class="hlist">${fixed.map(x => `<div class="hrow"><span class="chip BUY">Fixed</span><div><div>${esc(x.text)}</div><div class="foot">${esc(x.where)} · ${esc(fmtET(x.at))}</div></div></div>`).join("")}</div></section>` : ""}`;
}

// ---------- your profile: laid out like a member's page, from your Alpaca account ----------
const ME = { who: "all", open: null };
function renderMe(d) {
  const P = d.portfolio || {}, c = d.close_report || {};
  const fills = [];
  for (const [t, fs] of Object.entries(P.fills || {})) for (const f of fs || []) if (f && f[0]) fills.push({ t, td: String(f[0]).slice(0, 10), side: f[1], qty: f[2], px: f[3], by: f[4], own: true });
  fills.sort((a, b) => b.td.localeCompare(a.td) || a.t.localeCompare(b.t));
  const BY = { you: "You", tap: "Buy button", tool: "The tool" };
  const shown = fills.filter(f => ME.who === "all" || (ME.who === "you" ? f.by !== "tool" : f.by === "tool"));
  const pos = Object.fromEntries((P.positions || []).map(x => [x.t, x]));
  const v = liveVsSpy(d);
  const sinceBuy = f => { const x = pos[f.t]; return f.side === "buy" && x && x.px && f.px ? x.px / f.px - 1 : null; };
  const nb = fills.filter(f => f.side === "buy").length, ns = fills.length - nb;
  return `<section class="panel"><div class="mehead"><img src="/me.jpg" alt="" onerror="this.style.display='none'"><div><h2>Your profile</h2>
      <div class="foot">${P.mode === "live" ? "Real money" : "Paper account"}${c.start ? ` · since ${esc(fmtDate(c.start))}` : ""} · ${nb} buy${nb === 1 ? "" : "s"}, ${ns} sale${ns === 1 ? "" : "s"}</div></div></div></section>
  <div class="tiles">
    <div class="tile"><span class="v">${money(P.equity)}</span><span class="l">Account value</span></div>
    ${v ? `<div class="tile"><span class="v ${cls(v.acct)}">${pnum(v.acct, 2)}</span><span class="l">Your results since start</span><span class="c">S&amp;P ${pnum(v.spy, 2)}</span></div>
    <div class="tile"><span class="v ${cls(v.gap)}">${pnum(v.gap, 2)}</span><span class="l">${v.gap >= 0 ? "Ahead of" : "Behind"} the S&amp;P</span></div>` : ""}
    <div class="tile"><span class="v">${(P.positions || []).length}</span><span class="l">Open positions</span></div>
  </div>
  ${c.series?.dates?.length ? `<section class="panel"><div class="ph"><h2>You vs the S&amp;P</h2></div><div class="chart" id="mechart"></div></section>` : ""}
  <section class="panel"><div class="ph"><h2>Your trades</h2><span class="sub">Tap one for its context</span></div>
    <div class="daypick">${[["all", "All"], ["you", "Yours + Buy button"], ["tool", "The tool's"]].map(([k, l]) => `<button type="button" data-mewho="${k}" aria-pressed="${ME.who === k}">${l}</button>`).join("")}</div>
    ${shown.length ? shown.slice(0, 200).map((f, i) => {
      const k = f.t + "|" + f.td + "|" + f.side + "|" + i, g = sinceBuy(f);
      return `<div class="metr"><div class="top" data-meopen="${esc(k)}" style="cursor:pointer">${tkBtn(f.t)}<span class="bs ${f.side}">${f.side === "buy" ? "Bought" : "Sold"}</span>
        <span>${esc(fmtDate(f.td))}</span><span class="mono">${Number(f.qty).toLocaleString(undefined, { maximumFractionDigits: 4 })} sh at ${money2(f.px)}</span>
        ${g != null ? `<span class="${cls(g)}">${pct(g)} since</span>` : ""}<span class="foot">${esc(BY[f.by] || f.by || "")}</span></div>
        ${ME.open === k ? ctxBlock(f) : ""}</div>`;
    }).join("") : `<div class="empty">No trades in your account yet.</div>`}
  </section>`;
}
document.addEventListener("click", ev => {
  const w = ev.target.closest("[data-mewho]");
  if (w) { ME.who = w.dataset.mewho; ME.open = null; render(); return; }
  const o = ev.target.closest("[data-meopen]");
  if (o && !ev.target.closest("[data-chart]")) { ME.open = ME.open === o.dataset.meopen ? null : o.dataset.meopen; const y = scrollY; render(); scrollTo(0, y); }
});

// ---------- Company search: type a ticker or company name, tap a result (or press Go) for its chart popup ----------
const SEARCH = { q: "", items: null, err: null, n: 0 };
function searchRows() {
  if (SEARCH.err) return `<div class="note warn">${SEARCH.err.code === "app_only" ? "Company search is in the phone app." : esc(errorText(SEARCH.err))}</div>`;
  if (!SEARCH.q) return `<div class="foot">Type a ticker (like NVDA) or part of a company's name. Stocks members traded come first.</div>`;
  if (SEARCH.items === null) return `<div class="empty">Searching…</div>`;
  if (!SEARCH.items.length) return `<div class="foot">No company found. Press Go to look up ${esc(SEARCH.q.toUpperCase())} as a ticker anyway.</div>`;
  return `<div class="cslist">${SEARCH.items.map(x => `<button type="button" class="csrow" data-chart="${esc(x.t)}"><span class="ct">${esc(x.t)}</span><span class="cc">${esc(x.co || "")}</span><span class="cn">${x.n ? `${x.n.toLocaleString()} member trade${x.n === 1 ? "" : "s"}` : ""}</span></button>`).join("")}</div>`;
}
function renderSearch() {
  return `<section class="panel"><div class="ph"><h2>Company search</h2><span class="sub">Same chart as everywhere else: prices with every member's buys and sells.</span></div>
    <form class="csbox" id="csform" autocomplete="off"><input id="csq" type="search" inputmode="search" placeholder="Ticker or company" value="${esc(SEARCH.q)}" aria-label="Ticker or company" enterkeyhint="go"><button type="submit" class="btn">Go</button></form>
    <div id="csres">${searchRows()}</div></section>`;
}
let csTimer = null;
document.addEventListener("input", ev => {
  if (ev.target.id !== "csq") return;
  SEARCH.q = ev.target.value.trim(); SEARCH.items = null; SEARCH.err = null;
  const n = ++SEARCH.n, box = document.getElementById("csres");
  clearTimeout(csTimer);
  if (!SEARCH.q) { if (box) box.innerHTML = searchRows(); return; }
  csTimer = setTimeout(() => searchTickers(SEARCH.q).then(js => { if (n === SEARCH.n) SEARCH.items = (js && js.items) || []; },
    e => { if (n === SEARCH.n) SEARCH.err = e; }).finally(() => { const b = document.getElementById("csres"); if (n === SEARCH.n && b) b.innerHTML = searchRows(); }), 250);
  if (box) box.innerHTML = searchRows();
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "csform") return;
  ev.preventDefault();
  const q = (document.getElementById("csq")?.value || "").trim().toUpperCase();
  if (!q) return;
  const exact = (SEARCH.items || []).find(x => x.t === q);
  const t = exact ? exact.t : /^[A-Z][A-Z0-9.-]{0,9}$/.test(q) ? q.replace(/\./g, "-") : (SEARCH.items || [])[0]?.t;
  if (t) { document.getElementById("csq")?.blur(); openChart(t); }
});

function renderMore() {
  return `<section class="panel"><div class="morelist">
  ${MORE_TABS.map(m => `<button type="button" class="moreitem" data-more="${m.k}"><span class="ml">${esc(m.l)}</span><span class="md">${esc(m.d)}</span><span class="mc" aria-hidden="true">›</span></button>`).join("")}
  </div></section>`;
}
document.addEventListener("click", ev => { const b = ev.target.closest("[data-more]"); if (b) { ev.preventDefault(); goTab(b.dataset.more); } });

// your profile (the cat at the top right, next to the bell)
document.getElementById("mebtn")?.addEventListener("click", () => goTab(state.tab === "me" ? "today" : "me"));

// the bell at the top right opens the alerts list (tap again to go back to Today)
document.getElementById("bell").addEventListener("click", () => {
  state.tab = state.tab === "alerts" ? "today" : "alerts";
  if (state.tab === "alerts") ALERTS.items = null;
  render(); window.scrollTo(0, 0);
});

// ---------- rendering ----------
function render() {
  setHeaderHeight();
  TIPS = [];
  const navTab = MORE_TABS.some(m => m.k === state.tab) ? "more" : state.tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === navTab)));
  $("#bell")?.setAttribute("aria-pressed", String(state.tab === "alerts"));
  $("#mebtn")?.setAttribute("aria-pressed", String(state.tab === "me"));
  const main = $("#main");
  const d = state.data;
  if (!d) {
    main.innerHTML = state.error ? `<div class="note err">${state.error}</div>` : `<div class="empty">Loading your latest results…</div>`;
    return;
  }
  let html = "";
  if (d.version === 1) html += `<div class="note warn"><b>Showing results from the first version (5 signals).</b> Run the new notebook (Run all) and this page switches to the full version with buy, short and avoid picks.</div>`;
  if (MORE_TABS.some(m => m.k === state.tab)) html += `<button type="button" class="moreback" data-more="more">‹ More</button>`;
  if (state.tab === "more") html += renderMore();
  if (state.tab === "health") html += renderHealth();
  if (state.tab === "me") html += renderMe(d);
  if (d.data_warning && (d.data_warning.problems || []).length && ["today", "port"].includes(state.tab)) html += dataWarning(d.data_warning);
  if (state.tab === "today") html += renderToday(d);
  if (state.tab === "record") html += renderRecord(d);
  if (state.tab === "defense") html += renderDefense(d);
  if (state.tab === "small") html += renderSmall(d);
  if (state.tab === "works") html += renderWorks(d);
  if (state.tab === "real") html += renderReal(d);
  if (state.tab === "port") html += renderPortfolio(d);
  if (state.tab === "members") html += renderMembers(d);
  if (state.tab === "alerts") html += renderAlerts();
  if (state.tab === "search") html += renderSearch();
  main.innerHTML = html;
  bind();
  setTimeout(focusTarget, 0);
  try { document.querySelector('nav.tabs button[aria-selected="true"]')?.scrollIntoView({ inline: "nearest", block: "nearest" }); } catch (e) {}
}

function peopleOf(r) {
  if (Array.isArray(r.ppl) && r.ppl.length) return r.ppl;
  return String(r.m || "").split(/,\s*(?![^()]*\))/).filter(Boolean).map(x => {

function tagOf(p) {

function membersText(m) {

function avatar(p, small) {

const OPEN = ["new", "accepted", "pending_new", "partially_filled", "accepted_for_bidding", "held", "calculated"];
const tickerOf = name => (name.match(/^order_(?:request|done|failed)_([A-Z][A-Z0-9-]{0,6})_/) || [])[1];
function pendingFor(t) { return (state.taps || []).find(o => o.t === t && OPEN.includes(o.status)); }
function buyArea(r) {
  const p = state.data?.portfolio;
  if (!p || !state.folderId) return "";
  const held = (p.positions || []).some(x => x.t === r.t);
  if (pendingFor(r.t)) return `<span class="chip new">Order placed · waiting to fill</span>`;
  return `<button type="button" class="buybtn" data-buy="${esc(r.t)}"${held ? " title=\"You already hold this\"" : ""}>${held ? "Buy more" : "Buy"}</button>`;
}
function suggestion(r) {
  const L = state.data?.portfolio?.limits || {};
  const base = L.per_pick || L.dollars;
  if (!base) return null;
  const on = (L.sizing || state.data?.adaptive?.policy?.sizing || "equal") !== "equal";
  const k = on && r.sz != null ? r.sz : 1;
  const amt = Math.max(10, Math.round(base * k / 10) * 10);
  return { amt, k, on, sh: r.px ? amt / r.px : null };
}
function suggestLine(r) {
  const g = suggestion(r); if (!g) return "";
  const sh = g.sh == null ? "" : ` ≈ ${g.sh >= 10 ? Math.round(g.sh).toLocaleString() : g.sh.toFixed(1)} sh`;
  const why = !g.on ? "standard size" : g.k > 1.02 ? `${g.k.toFixed(2)}× · stronger pick` : g.k < 0.98 ? `${g.k.toFixed(2)}× · near the bar` : "standard size";
  return `<div class="sc" title="Suggested amount for this pick">Suggested ${money(g.amt)}${sh}<div class="foot" style="text-align:inherit">${why}</div></div>`;
}
function confirmBox(r) {
  if (state.confirm !== r.t) return state.tapMsg[r.t] ? `<div class="tapmsg ${state.tapMsg[r.t].ok ? "pos" : "neg"}">${esc(state.tapMsg[r.t].text)}</div>` : "";
  const p = state.data.portfolio, real = p.mode === "live";
  const amt = state.amounts[r.t] ?? (suggestion(r)?.amt || p.limits?.dollars || 5000);

    <button type="button" class="buybtn" data-send="${esc(r.t)}"${state.sending ? " disabled" : ""}>${state.sending ? "Sending…" : "Send order"}</button>
    <button type="button" class="link" data-cancel="1">Cancel</button>
    <span class="foot">Sent to Alpaca right away; fills now if the market is open, otherwise at the next open.</span>${state.tapMsg[r.t] ? `<div class="tapmsg neg">${esc(state.tapMsg[r.t].text)}</div>` : ""}</div>`;
}

// ---------- shorthand tags: a short word on the card, the full reason in a popup ----------
const TAG_RULES = [
  [/past buys ([+\-]?[\d.]+%) vs SPY avg \((\d+)\)/i, m => `Track ${m[1]} (${m[2]})`, "", "", "plain"],
  [/past buys beat the market consistently/i, () => "Proven buyer", "This member's purchases have beaten the market consistently over many trades."],

  [/committee oversees ([A-Za-z ]+)/i, m => `Committee: ${m[1].trim()}`, "The member sits on a committee that oversees this company's industry."],
  [/\$([\d.,]+[MBK]?) federal contracts/i, m => `$${m[1]} contracts`, "Federal contracts the company has won."],

  [/sponsored (\d+) (.+?) bill/i, m => `Bill sponsor`, "The member sponsored a bill in this area."],
  [/voted on a bill in this industry near the trade/i, () => "Vote nearby", "The member voted on a bill in this industry close to the trade date."],
  [/first time trading this stock/i, () => "First trade", "The first time this member traded this stock."],
  [/defense awards rising \(\$([\d.,]+[MB]?)/i, m => `Defense $${m[1]}`, "Defense Department awards to the company are rising."],
  [/federal grants or loans/i, () => "Federal grants", "The company received federal grants or loans."],
  [/their campaign paid the company/i, () => "Campaign paid co.", "The member's campaign paid this company."],
  [/usually trades before their trading partners/i, () => "Trades first", "This member usually trades before the members they often trade alongside."],
  [/bill passed recently/i, () => "Bill passed", "A bill in this industry passed recently."],
  [/jumped on disclosure day/i, () => "Already jumped", "The stock already jumped on the day the trade was disclosed, so some of the move may be gone.", "neg"],
  [/federal rule naming the company was published (\d+) days? after/i, m => `Rule +${m[1]}d`, "A federal rule naming the company came out shortly after the trade."],
  [/bill they back passed a chamber after the trade/i, () => "Their bill passed", "A bill this member backs passed the House or Senate after the trade."],
  [/already held it per yearly disclosure/i, () => "Already owned", "The member already owned this stock according to their yearly financial disclosure."],
  [/named in their yearly disclosure/i, () => "In disclosure", "The company appears in the member's yearly disclosure (job, income, travel or gift)."],
  [/committee colleague (?:made the same trade|also sold)/i, () => "Colleague too", "A colleague on the same committee made the same trade."],
  [/company lobbyist used to work for the (.+?) committee/i, () => "Ex-staff lobbyist", "A company lobbyist used to work for one of this member's committees."],
  [/but (\d+) members sold/i, m => `${m[1]} sold`, "Other members sold this stock around the same time.", "neg"],
  [/company is based in their state/i, () => "Home state", "The company is based in the member's state."],
  [/used options/i, () => "Options", "The trade used options."],
  [/spouse or family account/i, () => "Spouse/family", "The trade was in a spouse's or family member's account."],
  [/(\d+)x their usual (?:trade )?size/i, m => `${m[1]}× size`, "Much bigger than this member's usual trade."],
  [/former member of Congress lobbies/i, () => "Ex-member lobbyist", "A former member of Congress lobbies for the company."],
  [/holds a position with the company/i, () => "Position held", "The member holds a position with the company (yearly disclosure)."],
  [/top executive change (\d+) days? after/i, m => `Exec change +${m[1]}d`, "The company announced a top executive change shortly after the trade (8-K filing)."],
  [/8-K/i, () => "8-K after", "A major company announcement (8-K) shortly after the trade."],
  [/sold the entire position/i, () => "Sold all", "The member sold their entire position."],
  [/(\d+) company insider\(s\) (sold|bought)/i, m => `${m[1]} insiders ${m[2]}`, "Company insiders (executives, directors) made the same kind of trade."],
  [/already lagging SPY (-?[\d.]+%) over 3m/i, m => `Lagging ${m[1]}`, "The stock has already been lagging the S&P 500 over 3 months."],
  [/company testified before their committee/i, () => "Testified", "The company testified before this member's committee."],
  [/sold shortly before a company event/i, () => "Before event", "Sold shortly before a company event (earnings, FDA decision...)."],
  [/trading volume hit ([\d.]+)x normal/i, m => `Volume ${m[1]}×`, "Trading volume was unusually heavy in the two weeks before the trade."],
  [/closed committee briefing/i, () => "Closed briefing", "A closed (non-public) committee briefing shortly before the trade."],
  [/^FORMER tie: their last SEC filing for the company was (\w+ \d{4})/i, m => `Former · left ~${m[1]}`, "This family member's last SEC filing for the company is over 18 months old, so they may have left. The trade still counts, at half weight; check whether the tie still matters.", "neg"],
  [/^FORMER tie/i, () => "Former tie", "The family member may have left the company. The trade still counts, at half weight.", "neg"],
  [/spouse .* (?:company insider|insider)/i, () => "Spouse insider", "The member's spouse is a company insider per SEC filings."],

  [/testif/i, () => "Testimony after", "The company testified to their committee soon after the trade."],
];
let TIPS = [];
function reasonTag(text) {
  const t = String(text || "").trim();
  for (const [rx, lab, about, tone, plain] of TAG_RULES) {
    const m = t.match(rx);
    if (m) return { label: lab(m), about, tone: tone || (/^but\b/i.test(t) ? "neg" : ""), full: t, plain: !!plain };
  }
  const words = t.replace(/^but\s+/i, "").split(/\s+/);
  return { label: words.slice(0, 3).join(" ") + (words.length > 3 ? "…" : ""), about: "", tone: /^but\b/i.test(t) ? "neg" : "", full: t };
}
function tipBtn(label, title, body, cls = "") {
  const id = TIPS.push({ title, body }) - 1;
  return `<button type="button" class="tag ${cls}" data-tip="${id}">${esc(label)}</button>`;
}
function tagsHtml(reasons, max = 6, title = "Why it's flagged") {
  const rs = (Array.isArray(reasons) ? reasons : String(reasons || "").split(/;\s*/)).map(x => String(x).trim()).filter(Boolean);
  if (!rs.length) return "";
  const tags = rs.map(reasonTag);
  const seen = new Set(), uniq = tags.filter(g => !seen.has(g.label) && seen.add(g.label));
  const all = `<ul class="tipl">${rs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  const shown = uniq.slice(0, max).map(g => g.plain ? `<span class="tag plain">${esc(g.label)}</span>` : tipBtn(g.label, g.label, `<p>${esc(g.full)}</p>${g.about ? `<p class="foot">${esc(g.about)}</p>` : ""}`, g.tone));
  if (uniq.length > max) shown.push(tipBtn(`+${uniq.length - max} more`, title, all, "more"));
  else if (rs.length > 1) shown.push(tipBtn("All", title, all, "more"));
  return `<div class="tags">${shown.join("")}</div>`;
}
function openTip(i) {
  const t = TIPS[i]; if (!t) return;
  let bg = document.getElementById("tipbg");
  if (!bg) { bg = document.createElement("div"); bg.id = "tipbg"; bg.className = "tipbg"; document.body.appendChild(bg); }
  bg.innerHTML = `<div class="tipsheet" role="dialog" aria-modal="true" aria-label="${esc(t.title)}"><div class="tiph"><b>${esc(t.title)}</b><button type="button" class="link" data-tipclose="1" aria-label="Close">Close</button></div><div class="tipb">${t.body}</div></div>`;
  bg.hidden = false;
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-tip]");
  if (b) { ev.preventDefault(); openTip(+b.dataset.tip); return; }
  const bg = document.getElementById("tipbg");
  if (bg && !bg.hidden && (ev.target === bg || ev.target.closest("[data-tipclose]"))) { bg.hidden = true; bg.innerHTML = ""; }
});
addEventListener("keydown", e => { const bg = document.getElementById("tipbg"); if (e.key === "Escape" && bg && !bg.hidden) { bg.hidden = true; bg.innerHTML = ""; } });

function fmtShort(d) {
  const x = new Date(String(d).slice(0, 10) + "T12:00:00");
  return isNaN(x) ? String(d || "") : x.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function tradeLine(r) {
  const d = r.d ? String(r.d).slice(0, 10) : null, td = r.td ? String(r.td).slice(0, 10) : null;
  if (!td) return `Disclosed ${esc(fmtDate(d))}`;
  const lag = r.lag != null ? Math.round(r.lag) : (d ? Math.round((Date.parse(d) - Date.parse(td)) / 864e5) : null);
  return `${r.action === "SHORT" || r.action === "avoid" ? "Sold" : "Bought"} ${esc(fmtShort(td))} · filed ${esc(fmtShort(d))}${lag != null ? ` (${lag}d)` : ""}`;
}
function pickRow(r, side) {
  const isNew = (state.data.watchlist?.new || []).some(n => n.t === r.t && (side === "sell" ? n.action === "SHORT" : n.action === "BUY"));
  const ctx = [];
  const ctxNote = "Context only: not part of the score.";
  if (r.an) ctx.push(tipBtn(`Analysts ${r.an.replace(/_/g, " ")}`, "Analysts", `<p>Wall Street analysts' average rating: <b>${esc(r.an.replace(/_/g, " "))}</b>.</p><p class="foot">${ctxNote}</p>`, "ctx"));
  if (r.up != null) ctx.push(tipBtn(`Target ${pnum(r.up, 0)}`, "Analyst price target", `<p>Analysts' average price target is ${esc(pnum(r.up, 0))} from today's price.</p><p class="foot">${ctxNote}</p>`, "ctx"));
  if (r.earn) ctx.push(tipBtn(`Earnings ${fmtShort(r.earn)}`, "Next earnings report", `<p>${esc(fmtDate(String(r.earn).slice(0, 10)))}</p><p class="foot">${ctxNote}</p>`, "ctx"));
  if (r.news != null) ctx.push(tipBtn(`${r.news} news`, "News this week", `<p>${esc(r.news)} news stories about the company this week.</p><p class="foot">${ctxNote}</p>`, "ctx"));
  if (r.nwm) ctx.push(tipBtn(`${r.nwm} member+co news`, "In the news together", `<p>${esc(r.nwm)} stories mention the member and the company together.</p>`, "ctx"));
  (r.hear || []).forEach(h => ctx.push(tipBtn(`Testifies ${fmtShort(h.date)}`, "Testifies before Congress", `<p><b>${esc(fmtDate(h.date))}</b>: ${esc(h.title)}</p>`, "neg")));
  const pctTop = r.pct != null ? Math.max(1, Math.round(100 - r.pct)) : null;
  return `<article class="pick" data-hl="pick:${esc(r.t)}">
    <div class="tk"><b>${tkBtn(r.t)}</b><span class="chip ${esc(r.action)}">${esc(r.action)}</span>${isNew ? `<span class="chip new">New</span>` : ""}${r.def ? `<span class="chip watch">Defense</span>` : ""}${r.ags ? `<span class="chip avoid" title="The member bought while most analysts rated it hold or worse">Against Wall Street</span>` : ""}</div>
    <div>
      <div class="co">${esc(r.co || r.t)}${r.sec ? ` <span class="who">· ${esc(r.sec)}</span>` : ""}</div>
      <div class="who">${tradeLine(r)}</div>
      ${peopleRow(r, side)}
      ${tagsHtml(r.why, 6, `Why ${r.t} is on the list`)}
      ${ctx.length ? `<div class="tags">${ctx.join("")}</div>` : ""}
    </div>
    <div class="side">
      <div class="meter" title="Score ${r.s}"><i style="width:${Math.max(3, Math.min(100, r.s || 0))}%"></i></div>
      <div class="sc">Score ${r.s != null ? Number(r.s).toFixed(0) : "–"}${pctTop != null ? ` · top ${pctTop}%` : ""}</div>
      ${r.mt != null ? `<div class="mv ${cls(r.mt)}">${pct(r.mt)} since purchase</div>` : ""}<div class="mv ${cls(r.move)}">${pct(r.move)} since disclosure</div>
      ${side === "buy" && r.action === "BUY" ? suggestLine(r) : ""}
      ${side === "buy" ? buyArea(r) : ""}
    </div>
    ${side === "buy" ? confirmBox(r) : ""}
  </article>`;
}

const POST_TY = { funding: "Funding/jobs", visit: "Visit", meeting: "Meeting", oversight: "Letter/oversight", legislation: "Legislation",
  hearing: "Hearing", praise: "Praise", criticism: "Criticism", other: "Other" };
const POSTS = { feed: null, loading: false, err: null, show: "notable", n: 30 };
const PREV = { items: null, verdicts: {}, err: null, loading: false, busy: false };
function loadReview() {
  if (PREV.loading || PREV.items) return;

  loadPeopleReview().then(js => { PREV.items = js.items || []; PREV.verdicts = js.verdicts || {}; PREV.err = null; })
    .catch(e => { PREV.err = e; }).finally(() => { PREV.loading = false; render(); });
}
function reviewCount() { loadReview(); return (PREV.items || []).filter(q => !PREV.verdicts[q.key]).length; }
function reviewList() {
  if (PREV.err?.code === "app_only") return `<div class="empty">Reviews are in the Capitol Capital app.</div>`;
  if (!PREV.items) return `<div class="empty">${PREV.err ? esc(errorText(PREV.err)) : "Loading…"}</div>`;
  const left = PREV.items.filter(q => !PREV.verdicts[q.key]);

}

function perfTable(perf) {

  return `<div class="tbl"><table><thead><tr><th>Portfolio</th><th class="n">Total</th><th class="n">Per year</th><th class="n">vs S&amp;P per year</th><th class="n">Likely range</th><th class="n">Volatility</th><th class="n">Worst drop</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="foot">The likely range is where the true yearly difference probably sits (95% confidence). If it includes 0%, the result could be luck. Results include a 0.1% trading cost on every buy and sell.</p>`;
}

function verdictFor(rows) {
  const byG = Object.fromEntries(rows.map(r => [r.group, r]));
  const hi = byG.high || byG.yes, lo = byG.low || byG.no;
  if (!hi || !lo || hi.avg == null || lo.avg == null) return ["no", "Not enough data"];
  const diff = hi.avg - lo.avg;
  if (hi.n < 30) return ["no", "Too few trades"];
  if (diff > 0.01) return ["yes", "Helps"];
  if (diff < -0.01) return ["rev", "Works backwards"];
  return ["no", "No clear effect"];
}

function factorBlock(rows, title) {
  if (!rows || !rows.length) return `<div class="empty">No data yet.</div>`;
  const groups = {};
  rows.forEach(r => (groups[r.signal] = groups[r.signal] || []).push(r));
  const max = Math.max(0.02, ...rows.map(r => Math.abs(r.avg || 0)));
  const order = ["no", "yes", "low", "mid", "high"];
  return `<div class="fac">${Object.entries(groups).map(([sig, rs]) => {
    rs.sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));

  }).join("")}</div>`;
}

function liveVsSpy(d) {
  const c = d.close_report, p = d.portfolio;
  if (!c || c.since_start == null || c.spy_since_start == null || !c.equity || !p?.equity) return null;
  const e0 = c.equity / (1 + c.since_start / 100), acct = (p.equity / e0 - 1) * 100;
  let spy = c.spy_since_start, live = false;
  const S = p.spy;
  if (S && S.px) {

    const ref = dayOfBar === c.date ? S.day : S.prev;          // SPY's close on the report's day
    if (ref) { spy = ((1 + c.spy_since_start / 100) * (S.px / ref) - 1) * 100; live = true; }
  }
  return { acct, spy, gap: acct - spy, live };
}

// Alpaca's "today" is the account now vs the last trading day's 4 PM close. Outside a trading session that's

function dayLabel(p) {

  const part = k => (f.formatToParts(new Date()).find(x => x.type === k) || {}).value;
  const hm = (+part("hour") % 24) * 60 + +part("minute");
  return (["Sat", "Sun"].includes(part("weekday")) || hm < 960) ? "Since the last close (after-hours prices)" : "Change today";
}

const SERIES_VAR = { "Never-seen-years picks": "--s1", "Regular backtest, same years": "--s4", "Paper account": "--s1", "Small-company picks": "--s1", "Small-company index (IWM)": "--s3", "Long picks": "--s1", "Short picks": "--s2", "Copy every purchase": "--s4", "Defense fund (ITA)": "--s3", "S&P 500 (SPY)": "--spy" };
function drawChart(b = state.data?.backtest, sel = "#chart") {
  const host = $(sel);
  if (!host || !b?.curve?.dates?.length) { if (host) host.innerHTML = `<div class="empty">No growth curve in this data.</div>`; return; }
  const css = getComputedStyle(document.documentElement);
  const dates = b.curve.dates;
  const names = Object.keys(b.curve.series).filter(n => n in SERIES_VAR || /Long \d+% \/ short/.test(n));
  const colorOf = n => css.getPropertyValue(SERIES_VAR[n] || "--s3").trim();
  const W = Math.max(320, host.clientWidth - 24), H = W < 520 ? 240 : 320, m = { l: 48, r: 12, t: 10, b: 26 };
  let lo = 0, hi = 0;
  names.forEach(n => b.curve.series[n].forEach(v => { if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }));
  const band = b.band && b.curve.series[b.band.around] ? (() => {
    const base = b.curve.series[b.band.around], t0 = Date.parse(dates[0]);
    const up = [], dn = [];
    base.forEach((v, i) => {
      if (v == null) { up.push(null); dn.push(null); return; }
      const yrs = Math.max(0, (Date.parse(dates[i]) - t0) / 31557600000), w = (b.band.z || 1) * b.band.te * Math.sqrt(yrs) * 100;
      up.push(v + w); dn.push(v - w); lo = Math.min(lo, v - w); hi = Math.max(hi, v + w);
    });
    return { up, dn };
  })() : null;
  const span = hi - lo || 1; const step = [0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(s => span / s <= 6) || 2000;
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = i => m.l + (W - m.l - m.r) * (i / Math.max(1, dates.length - 1));
  const y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${css.getPropertyValue(v === 0 ? "--rule" : "--grid")}" stroke-width="1"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${v}%</text>`;
  const years = []; dates.forEach((d, i) => { const yy = d.slice(0, 4); if (!years.length || years[years.length - 1][0] !== yy) years.push([yy, i]); });
  years.forEach(([yy, i], k) => { if (k === 0 && years.length > 1 && years[1][1] - i < dates.length / 12) return; g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${yy}</text>`; });
  let paths = "";
  if (band) {
    const idx = band.up.map((v, i) => v == null ? -1 : i).filter(i => i >= 0);
    if (idx.length > 1) paths += `<path d="${idx.map((i, k) => (k ? "L" : "M") + x(i).toFixed(1) + "," + y(band.up[i]).toFixed(1)).join("")}${idx.slice().reverse().map(i => "L" + x(i).toFixed(1) + "," + y(band.dn[i]).toFixed(1)).join("")}Z" fill="${css.getPropertyValue("--accent-soft")}" stroke="none"/>`;
  }
  names.forEach(n => {
    const s = b.curve.series[n]; let dstr = "", pen = false;
    s.forEach((v, i) => { if (v == null) { pen = false; return; } dstr += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
    const spy = /SPY/.test(n);
    paths += `<path d="${dstr}" fill="none" stroke="${colorOf(n)}" stroke-width="2" ${spy ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
    const lastI = s.length - 1 - [...s].reverse().findIndex(v => v != null);
    if (lastI >= 0 && lastI < s.length) paths += `<circle cx="${x(lastI)}" cy="${y(s[lastI])}" r="3.5" fill="${colorOf(n)}" stroke="${css.getPropertyValue("--surface")}" stroke-width="2"/>`;
  });
  host.innerHTML = `<div class="legend">${band ? `<span><i class="band"></i>Luck range</span>` : ""}${names.map(n => `<span><i class="${/SPY/.test(n) ? "dash" : ""}" style="background:${colorOf(n)}"></i>${esc(n.replace(" (SPY)", ""))} <b class="mono ${cls(b.curve.series[n].filter(v => v != null).slice(-1)[0])}">${pnum(b.curve.series[n].filter(v => v != null).slice(-1)[0], 0)}</b></span>`).join("")}</div>
  <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth of each portfolio compared with the S&P 500">${g}${paths}<line id="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="${css.getPropertyValue("--muted")}" stroke-width="1" visibility="hidden"/><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  const hit = $("#hit", host), tip = $("#tip", host), xh = $("#xh", host);
  const move = ev => {
    const r = hit.getBoundingClientRect(); const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const i = Math.max(0, Math.min(dates.length - 1, Math.round(px / r.width * (dates.length - 1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="d">${esc(fmtDate(dates[i]))}</div>` + names.map(n => `<div class="r"><span style="color:${colorOf(n)}">●</span><span style="flex:1">${esc(n.replace(" (SPY)", ""))}</span><b>${pnum(b.curve.series[n][i], 1)}</b></div>`).join("") + (band && band.up[i] != null ? `<div class="r"><span style="flex:1;color:var(--muted)">Luck range</span><b>${pnum(band.dn[i], 1)} to ${pnum(band.up[i], 1)}</b></div>` : "");
    tip.hidden = false;

  };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("mouseleave", () => { tip.hidden = true; xh.setAttribute("visibility", "hidden"); });
}

  loadAlerts().then(js => { ALERTS.items = (js && js.items) || []; ALERTS.err = null; })
    .catch(e => { ALERTS.err = e; })
    .finally(() => { ALERTS.loading = false; alertsBadge(); if (state.tab === "alerts") render(); });

function markSeen() {

function renderAlerts() {

      <div class="tt">${esc(a.title)}</div>${a.body ? `<div class="bd">${esc(a.body)}</div>` : ""}
      ${many && isOpen ? `<ul>${a.items.map(x => `<li>${x.u ? `<button type="button" data-go="${esc(x.u)}">${esc(x.l)}</button>` : esc(x.l)}${x.x ? ` · <a href="${esc(x.x)}" target="_blank" rel="noopener">Go to post</a>` : ""}</li>`).join("")}</ul>` :

document.getElementById("main").addEventListener("click", ev => {
  const g = ev.target.closest("[data-go]");
  if (g) { ev.stopPropagation(); go(g.dataset.go); return; }
  if (ev.target.closest("a")) return;
  if (ev.target.closest("[data-arefresh]")) { ALERTS.items = null; refreshAlerts(); render(); return; }
  if (ev.target.closest("[data-aclear]")) {
    if (!confirm("Clear all alerts from this list?")) return;
    const keep = ALERTS.items; ALERTS.items = []; render();
    clearAllAlerts().catch(e => { ALERTS.items = keep; ALERTS.err = e; render(); });
    return;
  }
  if (ALERT_SWIPED) { ALERT_SWIPED = false; return; }      // the tap that ended a swipe doesn't open the alert
  const a = ev.target.closest("[data-alert]");
  if (!a) return;
  const it = (ALERTS.items || []).find(x => x.id === a.dataset.alert);
  if (!it) return;
  if ((it.items || []).length > 1 || !it.url || /#alerts/.test(it.url)) { ALERTS.open = ALERTS.open === it.id ? null : it.id; render(); }
  else go(it.url);
});

// swipe an alert left to clear it (it's only hidden from this list; the alert log is kept)
let ALERT_SWIPED = false, SW = null;
function dismissAlert(w) {
  const id = w.dataset.alw;
  w.style.maxHeight = w.offsetHeight + "px"; w.querySelector(".al").style.transform = "translateX(-110%)";
  requestAnimationFrame(() => w.classList.add("gone"));
  setTimeout(() => {
    const keep = ALERTS.items;
    ALERTS.items = (ALERTS.items || []).filter(x => x.id !== id); alertsBadge(); render();
    clearAlert(id).catch(e => { ALERTS.items = keep; ALERTS.err = e; render(); });
  }, 420);
}
document.addEventListener("touchstart", ev => {
  const w = ev.target.closest(".alw"); if (!w || ev.touches.length !== 1) { SW = null; return; }
  SW = { w, x: ev.touches[0].clientX, y: ev.touches[0].clientY, dx: 0, on: false };
}, { passive: true });
document.addEventListener("touchmove", ev => {
  if (!SW) return;
  const dx = ev.touches[0].clientX - SW.x, dy = ev.touches[0].clientY - SW.y;
  if (!SW.on) { if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { SW = null; return; } if (dx < -10) { SW.on = true; SW.w.classList.add("drag"); } else return; }
  SW.dx = Math.min(0, dx); SW.w.querySelector(".al").style.transform = `translateX(${SW.dx}px)`;
}, { passive: true });
document.addEventListener("touchend", () => {
  if (!SW) return;
  const s_ = SW; SW = null;
  if (!s_.on) return;
  ALERT_SWIPED = true; setTimeout(() => { ALERT_SWIPED = false; }, 400);
  s_.w.classList.remove("drag");
  if (s_.dx < -Math.min(120, s_.w.offsetWidth * 0.35)) dismissAlert(s_.w);
  else s_.w.querySelector(".al").style.transform = "";
});

// ---------- deep links: "#post/<id>", "#worth/NVDA", "#port/NVDA", "#t/NVDA", "#alerts/<id>", "#members/<id>", "#works/rare" ----------
let TARGET = null;        // {sel, until}: element to scroll to and flash once it's on the page
function postId(u) {      // same as cloud_store.post_id (FNV-1a, base 36)
  let h = 0x811c9dc5;
  for (const b of new TextEncoder().encode(String(u || ""))) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}
function go(link) {
  const u = new URL(link, location.href);
  try { history.pushState({}, "", u.hash || "#"); } catch (e) {}
  route(u.hash);
}
function route(hash) {
  const [a, ...rest] = String(hash || "").replace(/^#/, "").split("/");
  const b = decodeURIComponent(rest.join("/") || "");
  const tab = t => { state.tab = t; try { localStorage.setItem("ctd-tab", t); } catch (e) {} };
  const aim = sel => { TARGET = { sel, until: Date.now() + 20000 }; };
  if (a === "post" && b) {
    tab("today"); POSTS.show = "all"; POSTS.n = 400; aim(`[data-hl="post:${CSS.escape(b)}"]`);
    if (POSTS.err) { POSTS.err = null; POSTS.feed = null; }
  } else if (a === "worth" && b) { tab("today"); aim(`[data-hl="worth:${CSS.escape(b)}"],[data-hl="pick:${CSS.escape(b)}"]`); }
  else if (a === "port") { tab("port"); if (b) aim(`[data-hl="pos:${CSS.escape(b)}"]`); }
  else if (a === "t" && b) { tab("today"); render(); openChart(b); return; }
  else if (a === "alerts") { tab("alerts"); ALERTS.items = null; if (b) { ALERTS.open = b; aim(`[data-hl="alert:${CSS.escape(b)}"]`); } }
  else if (a === "posts") { tab("today"); aim("#posts"); }
  else if (a === "works") { tab("works"); }
  else if (/^today-/.test(a)) { tab("today"); aim("#" + a); }
  else if (a === "members") { tab("members"); MEM.key = b || null; MEM.open = null; MEM.tq = ""; MEM.tshow = 40; }
  else if (a === "health") { tab("health"); HEALTH.js = null; }
  else if (a === "me") { tab("me"); }
  else if (["today", "record", "defense", "small", "works", "real", "port", "alerts"].includes(a)) tab(a);
  else return;
  render(); scrollTo(0, 0);
}
function focusTarget() {
  if (!TARGET) return;
  if (Date.now() > TARGET.until) { TARGET = null; return; }
  const el = document.querySelector(TARGET.sel);
  if (!el) return;                       // not on the page yet (posts still loading): try again on the next render
  TARGET = null;
  el.scrollIntoView({ behavior: "smooth", block: "center" });

}

function errorText(e) {
  switch (e?.code) {
    case "login": return "Please log in.";

    case "offline": return "You're offline. Connect to the internet and tap Refresh.";

}
async function api(path, opts = {}) {
  let r;
  try { r = await fetch(path, { credentials: "same-origin", ...opts }); }
  catch (e) { throw { code: "offline" }; }
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw { code: "login" }; }
  let js = null;
  try { js = await r.json(); } catch (e) { if (r.ok) throw { code: "bad_json", message: "the results file is incomplete; try Refresh in a minute" }; }
  if (r.status === 404 && js?.error === "no-file") throw { code: "no_file" };
  if (!r.ok) throw { code: js?.error || "http", why: js?.why, message: js?.message || ("error " + r.status), status: r.status };
  return { js, headers: r.headers };
}
const WHY_BUY = { "amount-over-limit": "the amount is over your per-order limit", "not-enough-cash": "not enough buying power",
  "not-tradable": "Alpaca can't trade this stock", "not-found": "stock not found on Alpaca", "no-price": "no current price",
